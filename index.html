<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tableau Desktop Specialist 題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+TC:wght@400;500;600&display=swap">

<script>
/* Runs before the stylesheet is applied: a saved dark theme that only takes
   effect after the first paint shows up as a white flash on every load. */
(function(){
  try{
    var p = JSON.parse(localStorage.getItem("tableau-bank-v2" + ":prefs") || "{}");
    if(p.theme === "light" || p.theme === "dark") document.documentElement.dataset.theme = p.theme;
    if(p.fs) document.documentElement.style.setProperty("--fs", p.fs);
  }catch(e){}
})();
</script>

<style>
:root{
  --paper:#EFF3F3; --surface:#FFFFFF; --surface-2:#F6F9F9;
  --ink:#152022; --ink-2:#5A6C6E; --ink-3:#8A9A9C;
  --line:#D6E0E0; --line-strong:#B9C8C8;
  --accent:#0E6F70; --accent-soft:rgba(14,111,112,.10);
  --ok:#2C7F52; --ok-soft:rgba(44,127,82,.12);
  --warn:#A86A16; --warn-soft:rgba(168,106,22,.13);
  --bad:#B8443D; --bad-soft:rgba(184,68,61,.11);
  --shadow:0 1px 2px rgba(21,32,34,.05), 0 8px 24px -12px rgba(21,32,34,.18);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans TC","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --fs:1;   /* display scale, set from 設定 */
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#101718; --surface:#182223; --surface-2:#1E2A2B;
  --ink:#E6EDEC; --ink-2:#9BADAD; --ink-3:#758787;
  --line:#2A3839; --line-strong:#3A4C4D;
  --accent:#5AC3C1; --accent-soft:rgba(90,195,193,.13);
  --ok:#6BC48C; --ok-soft:rgba(107,196,140,.14);
  --warn:#D9A441; --warn-soft:rgba(217,164,65,.15);
  --bad:#E5837A; --bad-soft:rgba(229,131,122,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#101718; --surface:#182223; --surface-2:#1E2A2B;
  --ink:#E6EDEC; --ink-2:#9BADAD; --ink-3:#758787;
  --line:#2A3839; --line-strong:#3A4C4D;
  --accent:#5AC3C1; --accent-soft:rgba(90,195,193,.13);
  --ok:#6BC48C; --ok-soft:rgba(107,196,140,.14);
  --warn:#D9A441; --warn-soft:rgba(217,164,65,.15);
  --bad:#E5837A; --bad-soft:rgba(229,131,122,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:calc(16px * var(--fs));line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:36px 20px 90px;display:flex;flex-direction:column;gap:26px}
[hidden]{display:none !important}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* masthead */
.mast{display:flex;flex-direction:column;gap:9px}
.eyebrow{font-family:var(--mono);font-size:calc(11.5px * var(--fs));letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:calc(clamp(28px,5vw,40px) * var(--fs));line-height:1.1;letter-spacing:-.02em;margin:0}
.sub{color:var(--ink-2);font-size:calc(14.5px * var(--fs));margin:0;max-width:62ch}
.sub a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.sub a:hover{border-bottom-color:currentColor}

/* tabs */
.tabs{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.tab{font:500 13.5px/1 var(--body);font-size:calc(13.5px * var(--fs));color:var(--ink-2);background:none;border:0;padding:9px 15px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-family:var(--display);font-size:calc(19px * var(--fs));font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-family:var(--display);font-size:calc(15px * var(--fs));font-weight:700;margin:0}
p.note{margin:0;color:var(--ink-2);font-size:calc(14px * var(--fs))}
.btn{font:500 14.5px/1 var(--body);font-size:calc(14.5px * var(--fs));padding:11px 20px;border-radius:9px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink-2);border-color:var(--line-strong)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--ink-3)}
.btn.sm{padding:8px 14px;font-size:calc(13.5px * var(--fs))}
.chip{font-size:calc(12px * var(--fs));font-weight:500;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.multi{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:var(--surface-2);color:var(--ink-3)}
.chip.narr{background:transparent;color:var(--ink-3);border:1px dashed var(--line-strong)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* setup grid */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:calc(11px * var(--fs));letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select{font:400 15px var(--body);font-size:calc(15px * var(--fs));padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-2);color:var(--ink)}
.blueprint{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.blueprint li{display:flex;align-items:center;gap:10px;font-size:calc(14px * var(--fs));color:var(--ink-2)}
.blueprint .bar{height:7px;border-radius:4px;background:var(--accent);flex:none}
.blueprint .nm{flex:1}
.blueprint .ct{font-family:var(--mono);font-size:calc(12.5px * var(--fs));color:var(--ink-3)}

/* exam header */
.examtop{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.timer{font-family:var(--mono);font-size:calc(22px * var(--fs));font-weight:500;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.timer.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.timer.crit{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.progresstext{font-family:var(--mono);font-size:calc(12.5px * var(--fs));color:var(--ink-3)}

/* navigator */
.navcard{padding:16px 20px;gap:12px}
.navcard summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  font-family:var(--display);font-size:calc(15px * var(--fs));font-weight:700;color:var(--ink)}
.navcard summary::-webkit-details-marker{display:none}
.navcard summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--ink-3);
  border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-left:auto;transition:transform .15s ease}
.navcard[open] summary::after{transform:rotate(-135deg)}
.navsum{font-family:var(--mono);font-size:calc(12px * var(--fs));font-weight:400;color:var(--ink-3)}
.navcard:not([open]){gap:0}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.nav-cell{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-3);font-family:var(--mono);font-size:calc(11.5px * var(--fs));cursor:pointer;padding:0;display:grid;place-items:center;position:relative}
.nav-cell.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nav-cell.flagged::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.nav-cell.now{outline:2px solid var(--ink);outline-offset:1px}
.nav-cell.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nav-cell.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

/* question */
.qhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.qnum{font-family:var(--mono);font-size:calc(12.5px * var(--fs));color:var(--ink-3);letter-spacing:.06em}
.tlink{margin-left:auto;font-family:var(--mono);font-size:calc(12px * var(--fs));color:var(--ink-3);text-decoration:none;border-bottom:1px dashed var(--line-strong)}
.tlink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.stem{font-family:var(--display);font-weight:500;font-size:calc(20px * var(--fs));line-height:1.35;letter-spacing:-.01em;margin:0;text-wrap:balance}
.stem-zh{margin:-10px 0 0;color:var(--ink-2);font-size:calc(14.5px * var(--fs))}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;font:400 15.5px/1.45 var(--body);font-size:calc(15.5px * var(--fs));color:var(--ink);transition:border-color .15s ease,background .15s ease}
.opt:hover:not(:disabled){border-color:var(--line-strong)}
.opt:disabled{cursor:default}
.key{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--mono);font-size:calc(11.5px * var(--fs));color:var(--ink-3);background:var(--surface);margin-top:1px}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .key{border-color:var(--accent);color:var(--accent);font-weight:500}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{border-color:var(--bad);color:var(--bad)}
.mark{margin-left:auto;font-family:var(--mono);font-size:calc(12px * var(--fs));flex:none;padding-top:2px}
.mark.ok{color:var(--ok)} .mark.no{color:var(--bad)}
.verdict{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line);padding:2px 0 2px 16px}
.verdict.ok{border-left-color:var(--ok)} .verdict.no{border-left-color:var(--bad)}
.verdict h3{font-size:calc(15px * var(--fs))} .verdict.ok h3{color:var(--ok)} .verdict.no h3{color:var(--bad)}
.verdict p{margin:0;font-size:calc(14.5px * var(--fs));color:var(--ink-2)}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.hint{font-family:var(--mono);font-size:calc(11.5px * var(--fs));color:var(--ink-3);margin-left:auto}

/* score */
.scorewrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.bigscore{font-family:var(--display);font-size:calc(62px * var(--fs));line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pass{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:calc(13px * var(--fs));padding:6px 13px;border-radius:999px;border:1px solid}
.pass.yes{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pass.no{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.metric{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.metric b{font-family:var(--display);font-size:calc(23px * var(--fs));font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.metric span{font-size:calc(12px * var(--fs));color:var(--ink-3)}

/* weakness chart */
.chart{display:flex;flex-direction:column;gap:9px}
.crow{display:grid;grid-template-columns:minmax(96px,1.15fr) 1fr auto;align-items:center;gap:11px}
.clabel{font-size:calc(13.5px * var(--fs));color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrack{display:block;height:11px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.cfill{display:block;height:100%;border-radius:5px;min-width:3px}
.cfill.good{background:var(--ok)} .cfill.mid{background:var(--warn)} .cfill.low{background:var(--bad)}
.cval{font-family:var(--mono);font-size:calc(12.5px * var(--fs));color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
.legendline{display:flex;gap:14px;flex-wrap:wrap;font-size:calc(12px * var(--fs));color:var(--ink-3)}
.legendline i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* topic list */
.topics{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;text-align:left;width:100%;color:var(--ink);font:400 14.5px var(--body);font-size:calc(14.5px * var(--fs))}
.trow:hover{border-color:var(--accent)}
.trow .tn{flex:1}
.trow .tc{font-family:var(--mono);font-size:calc(12px * var(--fs));color:var(--ink-3)}
.domhead{display:flex;align-items:baseline;gap:9px;margin-top:6px}
.domhead h3{font-size:calc(15px * var(--fs))}
.domhead span{font-family:var(--mono);font-size:calc(11.5px * var(--fs));color:var(--ink-3)}

/* history */
.hlist{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.hlist li{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);font-size:calc(14px * var(--fs))}
.hlist li:last-child{border-bottom:0}
.hdate{font-family:var(--mono);font-size:calc(12.5px * var(--fs));color:var(--ink-3)}
.hkind{color:var(--ink-2)}
.hscore{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.empty{padding:26px;text-align:center;color:var(--ink-3);font-size:calc(14px * var(--fs));border:1px dashed var(--line-strong);border-radius:11px}

/* browse */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:19px 21px;display:flex;flex-direction:column;gap:11px}
.entry .stem{font-size:calc(17px * var(--fs))}
.entry .stem-zh{font-size:calc(13.5px * var(--fs));margin-top:-7px}
.ans{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none;font-size:calc(14.5px * var(--fs))}
.ans li{display:flex;gap:10px;align-items:baseline;color:var(--ink-3)}
.ans li.hit{color:var(--ink);font-weight:500}
.ans .b{font-family:var(--mono);font-size:calc(11.5px * var(--fs));flex:none;color:var(--ink-3)}
.ans li.hit .b{color:var(--ok)}
.why{margin:0;font-size:calc(14px * var(--fs));color:var(--ink-2);border-left:3px solid var(--accent-soft);padding-left:14px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filterbar select,.filterbar input{font:400 14px var(--body);font-size:calc(14px * var(--fs));padding:8px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink)}

/* confirm dialog — browsers block window.confirm() inside sandboxed frames,
   so every confirmation is a real element in the page instead */
.modal-back{position:fixed;inset:0;background:rgba(10,18,19,.55);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px -12px rgba(0,0,0,.45);
  max-width:460px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px}
.modal h3{font-family:var(--display);font-size:calc(17px * var(--fs));font-weight:700}
.modal p{margin:0;font-size:calc(14.5px * var(--fs));color:var(--ink-2);white-space:pre-line}
.modal .row{justify-content:flex-end;gap:8px}
.modal .btn.danger{background:var(--bad);border-color:var(--bad);color:var(--paper)}

/* glossary */
.gloss-group{display:flex;flex-direction:column;gap:2px}
.gloss-group h3{margin-bottom:6px}
.gloss-note{font-size:calc(12.5px * var(--fs));color:var(--ink-3);margin:-2px 0 10px}
.term{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.term:last-child{border-bottom:0}
.term-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.term-en{font-family:var(--display);font-size:calc(15.5px * var(--fs));font-weight:700;letter-spacing:-.01em}
.term-zh{font-size:calc(14px * var(--fs));color:var(--accent);font-weight:500}
.term p{margin:0;font-size:calc(14px * var(--fs));color:var(--ink-2);line-height:1.6}
.gloss-count{font-family:var(--mono);font-size:calc(12px * var(--fs));color:var(--ink-3)}

footer{color:var(--ink-3);font-size:calc(12.5px * var(--fs));border-top:1px solid var(--line);padding-top:16px;line-height:1.7}
footer a{color:var(--ink-2)}
@media (max-width:560px){
  .card{padding:19px 17px}
  .hint{display:none}
  /* on a phone the masthead blurb is read once and then only costs screen,
     and the tabs are better scrolled than wrapped onto a second row */
  .wrap{padding:18px 14px 70px;gap:18px}
  .sub{display:none}
  /* five tabs will not fit one row on a phone, and a tab scrolled off the edge
     is a tab nobody finds — so wrap them and tighten the padding instead */
  .tabs{flex-wrap:wrap}
  .tab{padding:8px 11px;font-size:calc(13px * var(--fs))}
  h1{font-size:calc(26px * var(--fs))}
  .examtop{padding:8px 0}
  .timer{font-size:calc(19px * var(--fs));padding:3px 10px}
  .crow{grid-template-columns:minmax(78px,1fr) 1fr auto}
  .hlist li{grid-template-columns:1fr auto}
  .hdate{grid-column:1/-1}
}
/* settings */
.pref{display:flex;flex-direction:column;gap:9px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:500 14px/1.2 var(--body);padding:10px 14px;border-radius:9px;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2);
  cursor:pointer;display:flex;align-items:center;gap:8px}
.seg button:hover{border-color:var(--ink-3);color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg .sz{font-family:var(--display);font-weight:700;line-height:1}
.sw{width:15px;height:15px;border-radius:50%;border:1px solid var(--line-strong);flex:none}
.sw.light{background:#FFFFFF}
.sw.dark{background:#182223}
.sw.sys{background:linear-gradient(135deg,#FFFFFF 0 50%,#182223 50%)}
.prefprev{border:1px dashed var(--line-strong);border-radius:12px;padding:17px;
  background:var(--surface-2);display:flex;flex-direction:column;gap:11px}
.prevtag{font:400 11.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
</style>

<div class="wrap">
  <header class="mast">
    <div class="eyebrow">SALESFORCE CERTIFIED TABLEAU DESKTOP FOUNDATIONS</div>
    <h1>Tableau Desktop Specialist 題庫</h1>
    <p class="sub" id="subline"></p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="exam">模擬考</button>
    <button class="tab" role="tab" aria-selected="false" data-view="topic">主題練習</button>

<script>
const DOMAINS = [{"id": "D1", "zh": "連接與準備資料", "en": "Connecting to and Preparing Data", "weight": 25}, {"id": "D2", "zh": "探索與分析資料", "en": "Exploring and Analyzing Data", "weight": 35}, {"id": "D3", "zh": "分享洞察", "en": "Sharing Insights", "weight": 25}, {"id": "D4", "zh": "Tableau 概念", "en": "Understanding Tableau Concepts", "weight": 15}];
const QS = [{"id": "TtChR0LBQtQ-115", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 115, "d": "D1", "topic": "Join / Relationship / Blending", "multi": true, "q": "How can the logical layer be changed to the physical layer, or how do you define a join in the data source tab? (select all that apply)", "zh": "要從邏輯層進到實體層（也就是定義 join）有哪些做法？（複選）", "o": ["Double click on logical layer", "Right Click on Table -> Open", "Right Click on Table -> change to physical layer"], "a": [0, 1], "ex": "在邏輯層的表上「雙擊」或「右鍵 ▸ Open」都會展開實體層的 join/union 畫布，join 就在那裡定義。沒有「change to physical layer」這個選項。"}, {"id": "TtChR0LBQtQ-163", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 163, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "Data Blending simulates ____ Join?", "zh": "Data blending 的行為相當於哪一種 join？", "o": ["Left", "Right", "Inner", "full outer"], "a": [0], "ex": "Blending 會保留主要資料來源的所有值，再從次要資料來源帶入對應的列——這正是 left join 的行為（主要＝左表）。次要來源沒有對應時顯示為 null。"}, {"id": "TtChR0LBQtQ-205", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 205, "d": "D1", "topic": "Join / Relationship / Blending", "multi": true, "q": "What is true about Data Blending? (select all that apply)", "zh": "關於 data blending，下列哪些敘述正確？（複選）", "o": ["Fields in the blends must be aggregated first", "Blending apply sheet by sheet", "connect data from multiple data source", "Fields in the blend must be combined first"], "a": [0, 1, 2], "ex": "Blending 的三個特性：次要來源的欄位一定是彙總後才帶進視圖（所以會看到 AVG／SUM 包起來）、混合關係是「逐工作表」設定的（每張表可以不同）、而且它專門用於跨資料來源。欄位不需要事先合併。"}, {"id": "TtChR0LBQtQ-250", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 250, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": true, "q": "What are two methods for renaming a field in a visualization? (choose two)", "zh": "重新命名欄位有哪兩種方法？（複選）", "o": ["From the Data pane, use the field's drop-down menu and select Rename", "From the Data pane, right-click the field and select Replace References", "From the Data pane, click and hold on the field until the name is editable", "From the Format menu, select Field Labels"], "a": [0, 2], "ex": "資料窗格裡用欄位的下拉選單選 Rename，或在欄位上按住不放直到名稱變成可編輯狀態。Replace References 是把參照指向另一個欄位、Field Labels 是格式設定，都不是重新命名。"}, {"id": "TtChR0LBQtQ-324", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 324, "d": "D1", "topic": "資料來源與連線", "multi": false, "q": "You need to display the complete list of potential data connections when you connect to a server. What action should you perform?", "zh": "連接伺服器時要看到完整的連線類型清單，該怎麼做？", "o": ["Select Connecting to Data.", "Select More under To a File.", "Select More under To a Server.", "Select File on the menu, and then select New."], "a": [2], "ex": "開始頁的 Connect 面板分成 To a File 與 To a Server 兩區，各只列出常用項目；點 To a Server 下方的 More… 才會展開完整的伺服器連接器清單。"}, {"id": "TtChR0LBQtQ-371", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 371, "d": "D1", "topic": "資料來源與連線", "multi": false, "q": "When creating a data source, how can you add additional connections to different databases?", "zh": "建立資料來源時，要再加入其他資料庫的連線該怎麼做？", "o": ["From the drop-down menu of the current connection, select Edit Connection.", "From the Connections pane, select Add.", "From the Data menu, select New Data Source.", "From the File menu, select New."], "a": [1], "ex": "資料來源頁左側的 Connections 窗格有一個 Add，用它在「同一個資料來源」裡加入第二個連線，就能做跨資料庫的 join。Data ▸ New Data Source 建立的是另一個獨立的資料來源。"}, {"id": "TtChR0LBQtQ-430", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 430, "d": "D1", "topic": "Extract vs Live", "multi": false, "q": "When should you use an extract instead of a live connection?", "zh": "什麼情況下應該用 extract 而不是 live 連線？", "o": ["When connections to a database are very slow", "When you plan to use Tableau Prep Builder", "When maximum security is required for the data", "When data sources are hosted on-premises"], "a": [0], "ex": "官方列出的 extract 好處是：能處理極大量資料、查詢效能比直連來源好、開啟部分原生來源不支援的功能、以及可離線使用。連線很慢正是典型的改用 extract 時機。（注意：影片這題標的答案是 B「打算使用 Tableau Prep Builder」，與官方說明不符，這裡依官方文件更正為 A。）"}, {"id": "TtChR0LBQtQ-505", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 505, "d": "D1", "topic": "Join / Relationship / Blending", "multi": true, "q": "What are the two characteristics of relationships? (Choose two.)", "zh": "relationship 有哪兩個特性？（複選）", "o": ["Relationships will query every table in a data model regardless of whether the fields are in the visualization.", "Relationships will query only the tables and fields needed to create a visualization.", "Relationships are only supported when using extracts.", "Relationships are aware automatically of the native level of detail of logical tables."], "a": [1, 3], "ex": "Relationship 是「延遲、依需求」查詢：只查視圖真正用到的表與欄位；而且它知道每張邏輯表本身的細分層級，所以不同粒度的表結合時不會產生重複列。它對 live 與 extract 都適用。"}, {"id": "TtChR0LBQtQ-560", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 560, "d": "D1", "topic": "Join / Relationship / Blending", "multi": true, "q": "What are three reasons to use joins instead of relationships? (Choose three.)", "zh": "有哪三個理由會選擇用 join 而不是 relationship？（複選）", "o": ["You need to use a specific join type.", "You need to create an extract that will have multiple tables.", "You need to use row-level security.", "You need to use a data model that supports shared dimensions.", "You need to connect to multiple databases."], "a": [0, 2, 3], "ex": "需要明確指定 join 型別（inner／left／right／full outer）、需要列層級安全性、或資料模型要共用維度時，就得回到實體層用 join。多表擷取與跨資料庫連線用 relationship 也做得到。"}, {"id": "TtChR0LBQtQ-620", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 620, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "When should you use a relationship instead of a join for two data sets?", "zh": "兩份資料集在什麼情況下該用 relationship 而不是 join？", "o": ["To use both data sets across multiple sheets in a visualization.", "The data sets are in two separate tables within a single spreadsheet.", "The data sets include similar data aggregated at different levels of detail.", "The data sets include similar data aggregated up to the highest level."], "a": [2], "ex": "Relationship 最大的價值就在「粒度不同」的情況：它會各自以原本的細分層級查詢再對應，避免 join 造成的重複列與數值灌水。"}, {"id": "TtChR0LBQtQ-680", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 680, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "When should you use Union to combine data?", "zh": "什麼情況下該用 union 合併資料？", "o": ["When the data is at different level of details", "When the data will be used to add new fields column.", "When the data has same structure.", "When the data comes from different connections."], "a": [2], "ex": "Union 是把結構相同的表往下疊（例如各月份、各分店的同格式資料表），欄位必須對得起來。要增加欄位是 join；粒度不同用 relationship。"}, {"id": "TtChR0LBQtQ-757", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 757, "d": "D1", "topic": "資料清理（Pivot / Split / 別名）", "multi": false, "q": "A field named Product has a format of ID-Name-Description. You plan to separate the field into two fields and use a hyphen (\"-\") as a separator. What action will result in only one new field that contains Description?", "zh": "Product 欄位格式為 ID-Name-Description，想用「-」分隔且只產生一個含 Description 的新欄位，該怎麼做？", "o": ["A custom split on \"-\" and the first column of the Product field", "A default split on the Product field", "A custom split on \"-\" and all columns of the Product field", "A custom split on \"-\" and the last column of the Product field"], "a": [3], "ex": "Custom Split 可以指定「從左邊算第幾欄」或「從右邊算第幾欄」。Description 在最後，所以選以「-」分隔並取最後一欄，就只會多出一個欄位。選 all columns 會一次拆出三個欄位。"}, {"id": "TtChR0LBQtQ-880", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 880, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": false, "q": "You are building a view that includes Cost and Sale Price data. When you add the Cost field to the view, a prefix of $ is included. When you add the Sale Price field to the view, no prefix is included. But you want the $ prefix to be included for the Sale Price field, too. What should you do?", "zh": "Cost 欄位帶有 $ 前綴、Sale Price 沒有，想讓 Sale Price 也顯示 $，該怎麼做？", "o": ["Edit the attributes for the Sale Price field.", "Create an alias for the Sale Price field.", "Change the data type for the Sale Price field.", "Edit the default properties for the Sale Price field."], "a": [3], "ex": "數值的顯示格式屬於欄位的 Default Properties ▸ Number Format，設成貨幣即可，之後這個欄位在任何視圖都會帶 $。別名只適用於離散維度的成員、改資料型別不會加前綴。"}, {"id": "TtChR0LBQtQ-940", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 940, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": false, "q": "You have made changes to the structure of a data set, such as renaming fields used in the view. This has resulted in broken references in your viz. What step should you take to fix the broken references?", "zh": "資料來源結構改變（例如欄位被改名）導致視圖出現參照失效，該怎麼修？", "o": ["Close and reopen the worksheet.", "Replace all references.", "Delete the renamed fields.", "Reconnect to the data source"], "a": [1], "ex": "在失效的欄位上按右鍵選 Replace References，把它指向新的欄位，所有用到它的工作表、計算與篩選會一次修正。刪掉欄位或重連都會讓工作表壞得更徹底。"}, {"id": "TtChR0LBQtQ-994", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 994, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "Which one of the following is not a type of join in Tableau?", "zh": "下列哪一個不是 Tableau 的 join 類型？", "o": ["Inner join", "Left join", "Right join", "Top join"], "a": [3], "ex": "Tableau 支援 inner、left、right、full outer 四種 join。「Top join」不存在——Top 是篩選器的功能（Top N），不是結合方式。"}, {"id": "TtChR0LBQtQ-1040", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 1040, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "The Start page in Tableau Desktop includes which three main areas?", "zh": "Tableau Desktop 的開始頁包含哪三個主要區塊？", "o": ["Connect, Open, and Discover", "Connect, Resources, and Discover", "Explore, Resources, and Recommendations", "Connect, Explore, and Recommendations"], "a": [0], "ex": "開始頁分三欄：左側 Connect（連接資料）、中間 Open（最近開啟與範例活頁簿）、右側 Discover（訓練影片、部落格、Viz of the Day）。"}, {"id": "TtChR0LBQtQ-1120", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 1120, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "A teacher has a table named Class and a table named After-School. The Class table is on the left and the After-School table is on the right. Which type of join should you use to build a view that displays only the students in the class that attend the after-school program?", "zh": "Class 表在左、After-School 表在右，要只顯示「同時出現在兩張表」的學生，該用哪種 join？", "o": ["Full Outer", "Inner", "Right", "Left"], "a": [1], "ex": "只要兩邊都有的記錄＝取交集＝inner join。Left 會把班上所有學生都留下、Right 會留下所有課後班學生、Full outer 兩邊全留。"}, {"id": "TtChR0LBQtQ-1180", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 1180, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": true, "q": "Which of the following are stored in a .tds file? (Select 3)", "zh": ".tds 檔案會儲存下列哪三項？（複選）", "o": ["Visualization", "Metadata Edit", "Data Extract", "Data Connection Info", "Calculated Field"], "a": [1, 3, 4], "ex": ".tds 存的是「連線資訊 ＋ 你對這個來源做的中繼設定」：連線位址、中繼資料編輯（改名、預設屬性）、計算欄位，另外還有群組與集合。它不含視覺化（那在 .twb），也不含資料本身（那是 .hyper）。"}, {"id": "TtChR0LBQtQ-1230", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 1230, "d": "D1", "topic": "Join / Relationship / Blending", "multi": true, "q": "Which statements regarding unions is correct? (Select 2)", "zh": "關於 union 的敘述，哪兩項正確？（複選）", "o": ["Tables cannot be union from different databases", "The union columns need to have the same data type", "The columns must have the same names"], "a": [0, 1], "ex": "Union 只能在同一個連線／資料庫內進行，而且對應欄位的資料型別要一致（字串對數值不會合併）。欄位名稱不必完全相同——名稱不同的欄位會被視為不同欄位並各自保留，可再手動合併（merge）。"}, {"id": "TtChR0LBQtQ-1280", "vid": "TtChR0LBQtQ", "part": "AllAboutDATA P2", "ts": 1280, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "How many types of joins are available in Tableau?", "zh": "Tableau 提供幾種 join 類型？", "o": ["3", "4", "5", "2"], "a": [1], "ex": "四種：inner、left、right、full outer。在實體層拖入第二張表時，點兩表之間的文氏圖就會看到這四個選項。"}, {"id": "XSkPENGfpUs-143", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 143, "d": "D2", "topic": "Marks Card", "multi": false, "q": "In which chart can you not change size? (In which chart does the Size mark not work?)", "zh": "哪一種圖表無法調整大小（Size 標記沒有作用）？", "o": ["Pie chart", "Treemap", "heatmap", "Box-Whisker Plot"], "a": [2], "ex": "依影片給的答案為 heatmap。注意本組第 13 題卻說 heatmap 用 Size 與 Color 兩個標記呈現資料，兩題互相矛盾；Tableau 的 Show Me 裡 heat map 確實會用到 Size。實際考試若遇到，建議以「Highlight Table（只用顏色）」的概念理解這題。"}, {"id": "XSkPENGfpUs-194", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 194, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "You have a Bar Chart with 2 Dimensions in the column shelf and 1 measure in row shelf. How to convert the view into stacked bar chart?", "zh": "Columns 有兩個維度、Rows 有一個度量的長條圖，要變成堆疊長條圖該怎麼做？", "o": ["Drag measures to Label mark.", "Drag Dimension to Color mark.", "Swap Dimension with Measures.", "Drag Measures to Size mark."], "a": [1], "ex": "把其中一個維度從 Columns 移到 Marks 的 Color，長條就會依該維度分段堆疊。堆疊長條的本質就是「一個維度決定長度、另一個維度決定顏色分段」。"}, {"id": "XSkPENGfpUs-287", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 287, "d": "D2", "topic": "圖表類型與 Show Me", "multi": true, "q": "You create a dual axis chart that shows sales and profit over time. What should you do to distinguish sales from profit? (Choose two.)", "zh": "雙軸圖同時顯示 sales 與 profit，要讓兩者容易區分該怎麼做？（複選）", "o": ["Adjust the time frame displayed.", "Change the mark types of sales and profit.", "Adjust the aggregations for sales and profit to be different.", "Change the color of sales and profit."], "a": [1, 3], "ex": "雙軸圖的兩個度量各有自己的 Marks 卡，可以分別設定標記類型（例如一個長條、一個折線）與顏色，這是最直接的區分方式。改時間範圍或改彙總方式都會改變資料本身，不是區分手段。"}, {"id": "XSkPENGfpUs-341", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 341, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "You need to create a scatter plot chart that displays the relationship between two measures. What should you do first?", "zh": "要做出呈現兩個度量關係的散佈圖，第一步該做什麼？", "o": ["Add one measure to Rows and the other to Columns.", "Add both measures to Rows and a dimension to Columns.", "Disaggregate each measure.", "Add both measures to Columns and a dimension to Rows."], "a": [0], "ex": "散佈圖的定義就是兩個度量各占一軸：一個放 Rows、一個放 Columns。之後再加維度到 Detail 才會把單一標記拆成多個點。"}, {"id": "XSkPENGfpUs-516", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 516, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "If there is a Dimension in the Column shelf and measures in the rows shelf, and you need to build a stacked bar chart, what should be done?", "zh": "Columns 有維度、Rows 有度量，要做堆疊長條圖該怎麼做？", "o": ["Drag Dimension in color", "Drag Dimension in label", "Drag Measure into column", "Drag Dimension into rows"], "a": [0], "ex": "再拖一個維度到 Color，長條就會依該維度分段堆疊。這與第 2 題是同一個概念的不同問法。"}, {"id": "XSkPENGfpUs-525", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 525, "d": "D2", "topic": "地圖", "multi": false, "q": "What should you do first to build the map?", "zh": "要建立地圖，第一步該做什麼？", "o": ["Drag Country field on the Marks card.", "Drag Latitude to the Columns shelf and Longitude to the Rows shelf.", "Drag Latitude to the Rows shelf and Longitude to the Columns shelf.", "Drag Region Field Detail on the Marks card."], "a": [2], "ex": "緯度（Latitude）是南北方向，要放 Rows（Y 軸）；經度（Longitude）是東西方向，放 Columns（X 軸）。放反了地圖會整個轉 90 度。"}, {"id": "XSkPENGfpUs-560", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 560, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "With the Marks card drop-down menu set to Automatic, a line chart will be created whenever you place what on the Rows shelf and the Columns shelf?", "zh": "Marks 設為 Automatic 時，Rows 與 Columns 放什麼會自動產生折線圖？", "o": ["Measures on one shelf, and a date dimension on the other", "Zero or more dimensions on one shelf, and 2 or more measures on the other", "Zero or more measures on one shelf, and 2 or more dimensions on the other", "A date dimension followed by a continuous measure on one shelf"], "a": [3], "ex": "Automatic 判斷折線圖的條件是「日期維度 ＋ 連續度量」的組合：日期在一軸形成連續的時間軸，度量在另一軸，Tableau 就會把點連成線。"}, {"id": "XSkPENGfpUs-651", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 651, "d": "D2", "topic": "Bins 與直方圖", "multi": false, "q": "How many Measures are required to create a Histogram?", "zh": "建立直方圖需要幾個度量？", "o": ["1", "2", "3", "No Measures Required"], "a": [0], "ex": "直方圖只需要一個度量：Tableau 會把它切成 bin 當作 X 軸，Y 軸則是每個 bin 的計數。所以 Show Me 的直方圖條件是「1 個 measure」。"}, {"id": "XSkPENGfpUs-680", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 680, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "What kind of chart do we use to see trends?", "zh": "要觀察趨勢應該用哪一種圖表？", "o": ["Line Chart", "Bar Chart", "Pie Chart", "Treemap"], "a": [0], "ex": "折線圖沿時間軸把資料點連起來，是呈現趨勢與走向的標準選擇。"}, {"id": "XSkPENGfpUs-720", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 720, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "How many fields are required to create a Side-by-side Bar chart and Side-by-side Line Chart?", "zh": "建立並排長條圖與並排折線圖需要幾個欄位？", "o": ["2", "3", "4", "5"], "a": [1], "ex": "Show Me 的並排長條圖需要 1 個以上維度加 1 個以上度量，實際最少三個欄位（兩個維度 ＋ 一個度量）：一個維度分欄、一個維度並排、度量決定長度。"}, {"id": "XSkPENGfpUs-760", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 760, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "How many categories is ideal to show in a Pie chart?", "zh": "圓餅圖最適合顯示幾個類別？", "o": ["2-5 categories", "1-3 categories", "3-5 categories", "1-5 categories"], "a": [0], "ex": "圓餅圖切片一多就難以比較角度，最佳實務是 2–5 個類別；超過就該改用長條圖。"}, {"id": "XSkPENGfpUs-790", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 790, "d": "D2", "topic": "Marks Card", "multi": true, "q": "The Shape option is available for which two views? (Choose two.)", "zh": "Shape（形狀）標記可用於哪兩種視圖？（複選）", "o": ["Scatter plots", "Side-by-side circles", "Tree maps", "Packed bubbles"], "a": [0, 1], "ex": "Shape 標記只在標記類型為 Shape／Circle 這類點狀圖時才有作用，散佈圖與並排圓點都屬於這類。Tree map 與 packed bubble 的標記形狀由圖表本身決定（方塊、圓形），不能改。"}, {"id": "XSkPENGfpUs-800", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 800, "d": "D2", "topic": "Marks Card", "multi": false, "q": "Heatmap uses ______ & ______ to display data?", "zh": "熱圖用哪兩個標記屬性來呈現資料？", "o": ["Shape & Size", "Size & Color", "Only Size", "Label & Size"], "a": [1], "ex": "Tableau 的 heat map 以 Size 表示一個度量、Color 表示另一個度量（或同一個），因此需要兩個標記屬性。只用顏色的那種叫 Highlight Table。"}, {"id": "XSkPENGfpUs-939", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 939, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "How many Measures are required to create a Scatter Plot?", "zh": "建立散佈圖需要幾個度量？", "o": ["1", "2", "3", "No Measures Required"], "a": [1], "ex": "散佈圖需要兩個度量，分別放在 X 軸與 Y 軸，才能表達兩者的關係。"}, {"id": "XSkPENGfpUs-947", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 947, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "What is the default shape of a Tree Map?", "zh": "樹狀圖的預設形狀是什麼？", "o": ["Rectangle", "Square", "Circle", "Triangle"], "a": [0], "ex": "樹狀圖以巢狀的長方形（rectangle）填滿畫布，面積代表度量大小。"}, {"id": "XSkPENGfpUs-960", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 960, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "Can we use the Dual Axis option on Dimensions?", "zh": "Dual Axis（雙軸）可以用在維度上嗎？", "o": ["Yes", "No"], "a": [1], "ex": "依影片答案為 No。雙軸是把第二個「軸」疊上來，而軸只有連續欄位才會產生，一般離散維度不會有軸。（嚴格說連續日期這類欄位也能形成雙軸，所以這題問法偏簡化。）"}, {"id": "XSkPENGfpUs-975", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 975, "d": "D2", "topic": "Bins 與直方圖", "multi": false, "q": "Is a Bin created automatically when we use the histogram chart?", "zh": "使用直方圖時會自動建立 bin 嗎？", "o": ["Yes", "No"], "a": [0], "ex": "是。從 Show Me 選直方圖時，Tableau 會自動替該度量產生一個「<欄位名> (bin)」欄位並放到 Columns，之後可右鍵 Edit 調整組距。"}, {"id": "XSkPENGfpUs-990", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 990, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "What is the default shape of a Heat Map?", "zh": "熱圖的預設形狀是什麼？", "o": ["Rectangle", "Square", "Circle", "Triangle"], "a": [1], "ex": "Tableau 的 heat map 預設以正方形（square）標記排成格狀，再用大小與顏色編碼數值。"}, {"id": "XSkPENGfpUs-1005", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 1005, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "Can we create a Line Chart without a Date Field?", "zh": "沒有日期欄位可以做折線圖嗎？", "o": ["Yes", "No"], "a": [0], "ex": "依官方文件更正為 Yes。Tableau 說明「You can create a line chart with discrete or continuous dimensions」——只要軸上是可形成順序的欄位（連續數值也可以），把標記類型設為 Line 就能連成線，並非非日期不可。（影片這題標的答案是 No，那是就 Show Me 的自動判定而言。）"}, {"id": "XSkPENGfpUs-1016", "vid": "XSkPENGfpUs", "part": "AllAboutDATA P3", "ts": 1016, "d": "D4", "topic": "效能最佳化", "multi": false, "q": "What type of chart has the slowest processing time?", "zh": "哪一種圖表的處理速度最慢？", "o": ["CrossTab", "Line Chart", "Bar Chart", "TreeMap"], "a": [0], "ex": "交叉表（文字表）要為每一格產生一個標記，資料一多標記數量就爆增，是所有圖表中渲染最慢的。這也是效能最佳化建議少用大型交叉表的原因。"}, {"id": "dNbDqCba5SA-456", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 456, "d": "D2", "topic": "排序與群組", "multi": true, "q": "What are the valid ways to group data? [Select All Apply]", "zh": "建立群組（group）有哪些有效做法？（複選）", "o": ["Using Label in the View", "From Analytic Pane", "From Dimension Shelf", "From Mark in the View"], "a": [0, 2, 3], "ex": "三個入口：在視圖中選取標題（label／header）後按迴紋針、在資料窗格的維度上按右鍵 ▸ Create ▸ Group、以及在視圖中框選標記後建立群組。Analytics 窗格只放參考線與模型，不能建群組。"}, {"id": "dNbDqCba5SA-475", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 475, "d": "D2", "topic": "Sets / Hierarchies", "multi": true, "q": "What are two use cases for creating hierarchies from the Data pane? (Choose two.)", "zh": "從資料窗格建立階層的兩個用途是什麼？（複選）", "o": ["To organize related fields together", "To add drilldown functionality for fields", "To create faster-performing queries", "To concatenate all fields into a single field"], "a": [0, 1], "ex": "階層做兩件事：把相關的維度組織成一組，以及讓視圖出現 +／− 可以逐層鑽取。它不會加快查詢，也不是把欄位串接起來。"}, {"id": "dNbDqCba5SA-505", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 505, "d": "D2", "topic": "排序與群組", "multi": false, "q": "Which statement accurately describes creating a group by selecting headers in a view?", "zh": "在視圖中選取標題來建立群組，哪個敘述正確？", "o": ["The grouped dimension is added to Color.", "A newly created group only exists in the current view.", "A new group updates the aliases from the selected headers.", "The grouped dimension replaces the original dimension field on Rows or Columns."], "a": [2], "ex": "從標題建立的群組會沿用被選成員的名稱作為群組別名。群組是資料來源層級的欄位（會出現在資料窗格，不只存在當前視圖），也不會自動被丟到 Color 或取代原欄位。"}, {"id": "dNbDqCba5SA-540", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 540, "d": "D2", "topic": "Marks Card", "multi": false, "q": "To best improve the display of a scatter plot that has overlapping shapes, you should adjust the ______ of the marks.", "zh": "散佈圖標記重疊時，調整標記的什麼最能改善顯示？", "o": ["mark size", "mark borders", "color opacity", "color palette"], "a": [0], "ex": "依影片答案為縮小標記大小，讓重疊的點分開。（實務上調整不透明度或加上標記邊框也是常見做法，本題以影片給的答案為準。）"}, {"id": "dNbDqCba5SA-570", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 570, "d": "D2", "topic": "Marks Card", "multi": false, "q": "Which mark type is used in a highlight table?", "zh": "Highlight table 使用哪一種標記類型？", "o": ["Area", "Square", "Polygon", "Text"], "a": [1], "ex": "Highlight table 是以 Square 標記排成格狀，再用顏色深淺標示數值大小。若標記類型是 Text，那就是一般的交叉表。"}, {"id": "dNbDqCba5SA-597", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 597, "d": "D2", "topic": "排序與群組", "multi": false, "q": "Is Group used only for Dimensions?", "zh": "Group 只能用在維度上嗎？", "o": ["Yes", "No"], "a": [1], "ex": "依影片答案為 No。群組主要用於合併維度成員，但度量也能先轉成離散再分組，所以「只能用於維度」的說法不成立。"}, {"id": "dNbDqCba5SA-620", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 620, "d": "D2", "topic": "Bins 與直方圖", "multi": false, "q": "Can we create Bins on Dimensions?", "zh": "可以在維度上建立 bin 嗎？", "o": ["Yes", "No"], "a": [1], "ex": "不行。Bin 是把「連續數值」切成等距區間，只有數值型的度量（或數值型欄位）才有 Create ▸ Bins 這個選項；一般文字維度按右鍵看不到它。"}, {"id": "dNbDqCba5SA-650", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 650, "d": "D2", "topic": "Sets / Hierarchies", "multi": false, "q": "Can we create sets on Measures?", "zh": "可以在度量上建立集合（set）嗎？", "o": ["Yes", "No"], "a": [1], "ex": "不行。集合是「維度成員的子集」，在度量上按右鍵 ▸ Create 看不到 Set 選項。要依度量值挑成員，做法是在維度的集合裡用 Top 或 Condition 條件搭配該度量。"}, {"id": "dNbDqCba5SA-825", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 825, "d": "D2", "topic": "Sets / Hierarchies", "multi": true, "q": "What are the valid ways to create a set? [Select All Apply]", "zh": "建立集合（set）有哪些有效做法？（複選）", "o": ["Using Label in the View", "From Analytic Pane", "From Dimension Shelf", "From Mark in the View"], "a": [0, 2, 3], "ex": "與建立群組同樣三個入口：視圖中的標題、資料窗格的維度右鍵 ▸ Create ▸ Set、以及框選視圖中的標記後建立集合。Analytics 窗格一樣不行。"}, {"id": "dNbDqCba5SA-860", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 860, "d": "D2", "topic": "篩選器 Filters", "multi": true, "q": "Which of the following is true about Context Filter? [Select All Apply]", "zh": "關於 context filter，下列哪些正確？（複選）", "o": ["It is Independent Filter", "Can be Rearranged in Filter Shelf", "Grey in Color", "Access by user."], "a": [0, 2], "ex": "Context filter 會先獨立執行並產生暫存子集，其他一般篩選器都在它之後運作，所以它本身是「獨立」的；在 Filters 架上它會顯示為灰色以示區別。內容篩選器會被提到架子最上方，不能任意重新排序。"}, {"id": "dNbDqCba5SA-900", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 900, "d": "D2", "topic": "篩選器 Filters", "multi": true, "q": "What options will appear when a discrete dimension is used in a filter? [Select all Apply]", "zh": "用離散維度做篩選時會出現哪些選項頁籤？（複選）", "o": ["Single value", "Multiple search", "wildcard", "range of values"], "a": [0, 1, 2], "ex": "離散維度的篩選器提供單選清單、多選清單與萬用字元比對。Range of values（範圍滑桿）只有連續欄位才會出現。"}, {"id": "dNbDqCba5SA-950", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 950, "d": "D2", "topic": "篩選器 Filters", "multi": true, "q": "What options will appear when continuous measures are used in a filter? [Select All Apply]", "zh": "用連續度量做篩選時會出現哪些選項？（複選）", "o": ["single value", "multiple search", "AtMost", "Range of values", "special"], "a": [2, 3], "ex": "連續度量的篩選器是數值範圍式的：Range of values（介於）、At least（至少）、At most（至多）、Special（null 相關）。單選／多選清單與萬用字元是離散欄位才有的。"}, {"id": "dNbDqCba5SA-1000", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 1000, "d": "D2", "topic": "計算欄位", "multi": true, "q": "What options are available in a parameter? [Select All Apply]", "zh": "參數（parameter）的允許值有哪些選項？（複選）", "o": ["All", "Range", "Selected", "List"], "a": [0, 1, 3], "ex": "參數的 Allowable values 有三種：All（任意值）、List（清單）、Range（範圍）。沒有叫 Selected 的選項。"}, {"id": "dNbDqCba5SA-1030", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 1030, "d": "D2", "topic": "計算欄位", "multi": true, "q": "A parameter is used to replace a constant value in: [Select All Apply]", "zh": "參數可以用來取代下列哪些地方的固定值？（複選）", "o": ["Calculated Field", "Reference line", "Set", "Group", "Bins"], "a": [0, 1, 2, 4], "ex": "參數可以驅動計算欄位裡的常數、參考線的位置、集合的 Top N 門檻、以及 bin 的組距大小。只有 Group 不行——群組是靜態指定成員，沒有可參數化的數值。"}, {"id": "dNbDqCba5SA-1060", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 1060, "d": "D2", "topic": "計算欄位", "multi": false, "q": "Can we use the Multi-Select option in a Parameter?", "zh": "參數可以做多選嗎？", "o": ["Yes", "No"], "a": [1], "ex": "不行。參數控制項只有滑桿與輸入框等單值形式（一次只能有一個值），要多選得用篩選器或集合。"}, {"id": "dNbDqCba5SA-1100", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 1100, "d": "D2", "topic": "計算欄位", "multi": false, "q": "While writing Calculated fields, which color represents parameters?", "zh": "撰寫計算欄位時，參數以什麼顏色顯示？", "o": ["Red", "Violet", "Blue", "Green"], "a": [1], "ex": "計算編輯器的語法上色：函數是藍色、欄位是橘色、參數是紫色（violet）、註解是灰色。看到紫色就知道那是參數而不是欄位。"}, {"id": "dNbDqCba5SA-1130", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 1130, "d": "D2", "topic": "篩選器 Filters", "multi": false, "q": "Context Filter executes first, then Extract filter executes -", "zh": "是非題：context filter 會先執行，然後才輪到 extract filter。", "o": ["Yes", "No"], "a": [1], "ex": "順序相反。篩選器的執行順序是：Extract filter ▸ Data source filter ▸ Context filter ▸ Dimension filter ▸ Measure filter ▸ Table calc filter。Extract filter 最早，因為它在產生擷取檔時就先把資料濾掉了。"}, {"id": "dNbDqCba5SA-1157", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 1157, "d": "D2", "topic": "篩選器 Filters", "multi": true, "q": "What options are available when we pass a Date Field in the filter shelf? [Select all apply]", "zh": "把日期欄位拖到篩選架時，會出現哪些選項？（複選）", "o": ["Relative Date", "Date Of Range", "Special", "Range of values", "Starting Day"], "a": [0, 1, 2], "ex": "日期篩選對話框提供 Relative dates（相對日期，如過去 3 個月）、Range of dates（日期區間）與 Special（null／全部）。「Starting Day」不是選項名稱。"}, {"id": "dNbDqCba5SA-1182", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 1182, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "Why do we use a Bar Chart?", "zh": "什麼情況下使用長條圖？", "o": ["Moving Average", "Percentage of Total", "Time Series Analysis", "Categories Analysis"], "a": [3], "ex": "長條圖用長度比較各類別的數值，是類別分析的標準圖表。移動平均與占比是表計算、時間序列是折線圖。"}, {"id": "dNbDqCba5SA-1212", "vid": "dNbDqCba5SA", "part": "AllAboutDATA P4", "ts": 1212, "d": "D2", "topic": "篩選器 Filters", "multi": true, "q": "Filter options of discrete dimensions are - [Select All Apply]", "zh": "離散維度的篩選器有哪些頁籤？（複選）", "o": ["General", "Special", "Atleast", "Condition"], "a": [0, 3], "ex": "離散維度的篩選對話框有 General、Wildcard、Condition、Top 四個頁籤。Special 與 At least 是連續欄位篩選才會出現的選項。"}, {"id": "ZRxUYvQ0qw0-301", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 301, "d": "D2", "topic": "排序與群組", "multi": true, "q": "From which locations can you sort a visualization? [Select All Apply]", "zh": "可以從哪些位置對視覺化排序？（複選）", "o": ["The Analysis menu", "Tooltip on the Marks card", "An axis", "The Worksheet menu", "A field label", "A header"], "a": [2, 4, 5], "ex": "視圖上有三個排序入口：座標軸上的排序圖示、欄位標籤（field label）旁的排序按鈕、以及標題（header）上的排序圖示。Analysis／Worksheet 選單裡沒有排序指令，Tooltip 更不是排序位置。"}, {"id": "ZRxUYvQ0qw0-330", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 330, "d": "D2", "topic": "排序與群組", "multi": false, "q": "Different types of \"Sort by\" options available in Tableau", "zh": "Tableau 的「Sort by」有哪幾種排序依據？", "o": ["Field", "Manual", "Nested", "Data Source Order", "Alphabetic", "All"], "a": [5], "ex": "全部都是：排序對話框的 Sort By 提供 Data Source Order、Alphabetic、Field、Manual，巢狀排序（Nested）則是在視圖中對子層級排序時的行為，所以答案是 All。"}, {"id": "ZRxUYvQ0qw0-360", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 360, "d": "D2", "topic": "排序與群組", "multi": false, "q": "What are the \"Sort by\" options not available in Tableau?", "zh": "下列哪一個「不是」Tableau 的排序依據？", "o": ["Field", "Nested", "Manual", "Numeric"], "a": [3], "ex": "沒有叫 Numeric 的排序選項——要依數值排序是選 Field 再指定該度量與彙總方式。"}, {"id": "ZRxUYvQ0qw0-400", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 400, "d": "D2", "topic": "排序與群組", "multi": false, "q": "There are 4 Regions [East, West, North, South]. How can we sort them in [North, East, South, West] order?", "zh": "四個區域要排成 North, East, South, West 這種自訂順序，該用哪種排序？", "o": ["Manual Sort", "Nested Sort", "Alphabetic Sort", "Field Sort"], "a": [0], "ex": "任意指定的順序只能用 Manual（手動）排序——在排序對話框裡直接拖曳成員調整位置，或在視圖中拖動標題。"}, {"id": "ZRxUYvQ0qw0-430", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 430, "d": "D2", "topic": "排序與群組", "multi": false, "q": "How to clear all Sort at a time?", "zh": "要一次清除所有排序該怎麼做？", "o": ["Right Click on field -> Sort -> Clear Sort", "Right Click on field -> Clear Sort", "Click on Worksheet Menu -> Clear Sort"], "a": [2], "ex": "Worksheet 選單的 Clear ▸ Sorts 會一次移除工作表上所有排序。在單一欄位上按右鍵只能清掉那個欄位的排序。"}, {"id": "ZRxUYvQ0qw0-447", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 447, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": false, "q": "You want to provide additional information when hovering over a field in the Data pane. What should you configure for the field?", "zh": "想讓滑鼠停在資料窗格的欄位上時顯示補充說明，該設定什麼？", "o": ["An alias", "A header label", "A default comment", "A hierarchy"], "a": [2], "ex": "欄位右鍵 ▸ Default Properties ▸ Comment 寫的註解，會在滑鼠停留於該欄位時以提示顯示，常用來說明欄位定義或計算邏輯。"}, {"id": "ZRxUYvQ0qw0-655", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 655, "d": "D2", "topic": "表計算 Table Calculations", "multi": false, "q": "When viewing quick table calculations, such as Percent Difference From, that use a value in the previous column, what will be the first data value in the visualization?", "zh": "使用「與前一欄比較」類的快速表計算（例如 Percent Difference From）時，第一個資料值會是什麼？", "o": ["Zero (0)", "Null", "Duplicated from the nearest column", "The current value"], "a": [1], "ex": "第一個位置沒有「前一個值」可以比較，所以結果是 Null（畫面上留白）。這也是為什麼差異類表計算的第一欄總是空的。"}, {"id": "ZRxUYvQ0qw0-690", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 690, "d": "D2", "topic": "表計算 Table Calculations", "multi": false, "q": "Which is not a Table Calculation type?", "zh": "下列哪一個不是表計算的類型？", "o": ["Standard deviation", "Rank", "YOY Growth", "Percentile"], "a": [0], "ex": "標準差是彙總函數（在度量的 Measure 選單裡），不是表計算。Rank、YOY Growth、Percentile 都在快速表計算清單中。"}, {"id": "ZRxUYvQ0qw0-713", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 713, "d": "D2", "topic": "參考線／趨勢線／預測", "multi": true, "q": "Valid ways to add total in a worksheet", "zh": "在工作表加入總計有哪些有效做法？（複選）", "o": ["From Analytic Pane", "From Worksheet Menu", "From Analysis Menu", "From Format Menu"], "a": [0, 2], "ex": "兩個入口：Analytics 窗格把 Totals 拖進視圖，或功能表 Analysis ▸ Totals ▸ Show Column/Row Grand Totals。Worksheet 與 Format 選單裡沒有這個功能。"}, {"id": "ZRxUYvQ0qw0-740", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 740, "d": "D2", "topic": "表計算 Table Calculations", "multi": false, "q": "The view is showing a line chart over time. If we want to display percentage of growth over year, which table calculation will be used?", "zh": "折線圖顯示時間趨勢，要呈現「年成長率」該用哪個表計算？", "o": ["Percentile", "YOY Growth", "Compound growth rate", "Percent difference"], "a": [1], "ex": "Year over Year Growth 就是專門算「與去年同期相比的成長百分比」，是快速表計算的內建選項。"}, {"id": "ZRxUYvQ0qw0-770", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 770, "d": "D2", "topic": "參考線／趨勢線／預測", "multi": false, "q": "Forecasting is only possible with at least one measure?", "zh": "是非題：預測至少需要一個度量才能執行。", "o": ["True", "False"], "a": [0], "ex": "True。預測需要一個日期維度加上至少一個要預測的度量，兩者缺一不可。"}, {"id": "ZRxUYvQ0qw0-800", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 800, "d": "D2", "topic": "參考線／趨勢線／預測", "multi": false, "q": "Technique used for Forecasting", "zh": "Tableau 的預測使用哪一種技術？", "o": ["Exponential Smoothing", "Binomial", "Polynomial"], "a": [0], "ex": "Tableau 的預測採用指數平滑法（exponential smoothing），會考慮趨勢與季節性並給出信賴區間。Polynomial 是趨勢線的模型之一，不是預測法。"}, {"id": "ZRxUYvQ0qw0-892", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 892, "d": "D2", "topic": "表計算 Table Calculations", "multi": true, "q": "Scope of Table Calculation is [Select All Apply]", "zh": "表計算的計算範圍（scope）有哪些？（複選）", "o": ["Cell", "Row Level", "Pane", "Table"], "a": [0, 2, 3], "ex": "表計算的定址範圍是 Table、Pane、Cell 三種（各自還有 across／down 的變化）。Row Level 是列層級計算，屬於一般計算欄位，不是表計算的範圍。"}, {"id": "ZRxUYvQ0qw0-900", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 900, "d": "D2", "topic": "參考線／趨勢線／預測", "multi": false, "q": "Which is not a Trend Model?", "zh": "下列哪一個不是趨勢線模型？", "o": ["Exponential", "Linear", "Power", "Binomial Distribution"], "a": [3], "ex": "Tableau 的趨勢線模型有 Linear、Logarithmic、Exponential、Power、Polynomial 五種。Binomial Distribution（二項分布）不在其中。"}, {"id": "ZRxUYvQ0qw0-910", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 910, "d": "D2", "topic": "參考線／趨勢線／預測", "multi": true, "q": "What options appear when you drag a Reference line into the view? [Select All Apply]", "zh": "把參考線拖進視圖時會出現哪些範圍選項？（複選）", "o": ["Cell", "Table", "View", "Pane"], "a": [0, 1, 3], "ex": "參考線可以套用在 Table、Pane、Cell 三種範圍上，拖進視圖時就會看到這三個放置目標。View 不是參考線的範圍單位。"}, {"id": "ZRxUYvQ0qw0-930", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 930, "d": "D2", "topic": "參考線／趨勢線／預測", "multi": false, "q": "What options appear when you drag a Trend line into the view?", "zh": "把趨勢線拖進視圖時會出現哪些範圍選項？", "o": ["Cell", "Table", "View", "None of them"], "a": [3], "ex": "趨勢線沒有 Table／Pane／Cell 的範圍選擇——拖進去時出現的是模型類型（Linear、Logarithmic、Exponential、Power、Polynomial），所以以上皆非。"}, {"id": "ZRxUYvQ0qw0-940", "vid": "ZRxUYvQ0qw0", "part": "AllAboutDATA P5", "ts": 940, "d": "D2", "topic": "表計算 Table Calculations", "multi": false, "q": "You need to show how Internet Usage values change from year-to-year as a percentage. Which quick table calculation should you apply to the Internet Usage field?", "zh": "要以百分比呈現數值逐年的變化，該套用哪個快速表計算？", "o": ["Percentile", "Difference", "Compound growth rate", "Percent difference"], "a": [3], "ex": "Percent Difference From 會算出與前一個值相比的變化百分比，正是「逐年變化百分比」。Difference 給的是絕對差值而非百分比。"}, {"id": "iWdxDSnmi90-280", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 280, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What is the value of FIND('TABLEAU', 'TU')?", "zh": "FIND('TABLEAU', 'TU') 的結果是什麼？", "o": ["1", "TRUE", "FALSE", "0"], "a": [3], "ex": "FIND 回傳子字串出現的起始位置，找不到時回傳 0。'TABLEAU' 裡沒有連續的 'TU'（T 後面是 A），所以是 0。注意 FIND 回傳數字不是布林值。"}, {"id": "iWdxDSnmi90-320", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 320, "d": "D4", "topic": "彙總與細分層級", "multi": false, "q": "COUNTD considers the NULL values as zero", "zh": "是非題：COUNTD 會把 NULL 當成 0 來計算。", "o": ["True", "False"], "a": [1], "ex": "False。COUNTD 計算的是相異的非 NULL 值，NULL 直接被忽略而不是當成一個值或 0。"}, {"id": "iWdxDSnmi90-360", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 360, "d": "D4", "topic": "彙總與細分層級", "multi": true, "q": "Which two types of aggregations can be applied to string fields? (Choose two.)", "zh": "哪兩種彙總可以套用在字串欄位上？（複選）", "o": ["Minimum", "Sum", "Average", "Count Distinct"], "a": [0, 3], "ex": "MIN／MAX 對字串是取字母順序的最前／最後，COUNT 與 COUNTD 則是計數，這些都適用字串。SUM 與 AVG 需要數值，傳字串會直接報錯。"}, {"id": "iWdxDSnmi90-420", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 420, "d": "D2", "topic": "計算欄位", "multi": false, "q": "You have the following string value: Sales Data. Which calculated field produces an output of Sales?", "zh": "字串為「Sales Data」，哪個計算欄位會輸出「Sales」？", "o": ["LEFT (\"Sales Data\")", "LEFT (\"Sales Data\", 5)", "LTRIM (\"Sales Data\")", "RTRIM (\"Sales Data\")"], "a": [1], "ex": "LEFT(字串, 位數) 取左邊指定字數，「Sales」剛好 5 個字元。LEFT 必須帶第二個參數；LTRIM／RTRIM 只是去掉前後空白。"}, {"id": "iWdxDSnmi90-480", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 480, "d": "D4", "topic": "維度 vs 度量", "multi": false, "q": "What is created by a calculated field that has a formula of SUM(Sales) / SUM(Profit)?", "zh": "公式為 SUM(Sales) / SUM(Profit) 的計算欄位會產生什麼？", "o": ["A measure", "A dimension", "A set", "A parameter"], "a": [0], "ex": "結果是彙總後的數值，Tableau 會把它歸類成度量（綠色）。這種比率型計算欄位（例如 Profit Ratio）是最常見的計算度量。"}, {"id": "iWdxDSnmi90-540", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 540, "d": "D1", "topic": "資料型別與欄位角色", "multi": true, "q": "What are the two examples of a date value? (Choose two.)", "zh": "下列哪兩個是有效的日期值寫法？（複選）", "o": ["January 1 1995", "December", "Wednesday", "2020-05-01"], "a": [0, 3], "ex": "完整日期需要年月日三個部分：「January 1 1995」與「2020-05-01」都指到某一天。只寫「December」或「Wednesday」是日期的一部分（月份／星期），無法構成一個日期值。"}, {"id": "iWdxDSnmi90-600", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 600, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What is the output of ABS(-10)?", "zh": "ABS(-10) 的結果是什麼？", "o": ["-10", "10", "9", "11"], "a": [1], "ex": "ABS 取絕對值，去掉正負號，所以 -10 變成 10。"}, {"id": "iWdxDSnmi90-765", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 765, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What is the output of FLOOR(7.2345)?", "zh": "FLOOR(7.2345) 的結果是什麼？", "o": ["7", "8", "7.3", "7.23"], "a": [0], "ex": "FLOOR 無條件捨去到最接近的較小整數，7.2345 → 7。"}, {"id": "iWdxDSnmi90-790", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 790, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What is the output of ROUND(7.2345)?", "zh": "ROUND(7.2345) 的結果是什麼？", "o": ["7", "8", "7.3", "7.23"], "a": [0], "ex": "ROUND 不指定小數位時四捨五入到整數，7.2345 → 7。若寫 ROUND(7.2345, 2) 才會得到 7.23。"}, {"id": "iWdxDSnmi90-815", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 815, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What is the output of CEILING(7.2345)?", "zh": "CEILING(7.2345) 的結果是什麼？", "o": ["7", "8", "7.3", "7.23"], "a": [1], "ex": "CEILING 無條件進位到最接近的較大整數，7.2345 → 8。與 FLOOR 剛好相反。"}, {"id": "iWdxDSnmi90-840", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 840, "d": "D2", "topic": "計算欄位", "multi": false, "q": "Is the ZN function used to replace Null value with Zero?", "zh": "ZN 函數是用來把 Null 換成 0 嗎？", "o": ["Yes", "No"], "a": [0], "ex": "是。ZN(expression) 在數值為 Null 時回傳 0，否則回傳原值，常用來避免 Null 讓後續計算整個變成 Null。"}, {"id": "iWdxDSnmi90-865", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 865, "d": "D2", "topic": "計算欄位", "multi": false, "q": "Do LEFT and LTRIM return the same value?", "zh": "LEFT 與 LTRIM 會回傳相同的結果嗎？", "o": ["Yes", "No"], "a": [1], "ex": "不一樣。LEFT 是「從左邊取 N 個字元」，LTRIM 是「去掉左邊的空白」，兩者用途完全不同。"}, {"id": "iWdxDSnmi90-890", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 890, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What is the output of CONTAINS('Tableau', 'le')?", "zh": "CONTAINS('Tableau', 'le') 的結果是什麼？", "o": ["True", "4", "False", "5"], "a": [0], "ex": "CONTAINS 回傳布林值：'Tableau' 裡含有 'le'（Tab-le-au），所以是 True。要取得位置得用 FIND。"}, {"id": "iWdxDSnmi90-1000", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 1000, "d": "D2", "topic": "計算欄位", "multi": false, "q": "Which date function is used to increment the specified date?", "zh": "哪個日期函數用來將指定日期往後推移？", "o": ["DATENAME", "DATEPARSE", "DATEADD", "DATEPART"], "a": [2], "ex": "DATEADD('month', 3, [Order Date]) 會把日期加上指定的間隔。DATEPART 取出某個部分的數值、DATENAME 取出名稱字串、DATEPARSE 把字串轉成日期。"}, {"id": "iWdxDSnmi90-1218", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 1218, "d": "D2", "topic": "LOD 運算式", "multi": false, "q": "______ are used to run complex queries involving many dimensions.", "zh": "＿＿＿ 用來執行牽涉多個維度的複雜查詢。", "o": ["Calculations", "LOD Expressions", "Functions", "Operators"], "a": [1], "ex": "LOD（Level of Detail）運算式讓你指定計算要在哪些維度的層級上進行，正是處理多維度複雜彙總的工具。"}, {"id": "iWdxDSnmi90-1240", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 1240, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What is the output of DATEDIFF()?", "zh": "DATEDIFF() 回傳什麼型別的值？", "o": ["Integer value", "Date value", "Float value", "String value"], "a": [0], "ex": "DATEDIFF 回傳兩個日期相差幾個單位（天、月、年…），是整數。"}, {"id": "iWdxDSnmi90-1260", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 1260, "d": "D2", "topic": "計算欄位", "multi": false, "q": "Does TODAY() return the current Date and time?", "zh": "TODAY() 會回傳目前的日期「和時間」嗎？", "o": ["Yes", "No"], "a": [1], "ex": "不會。TODAY() 只回傳日期，要連時間一起取得須用 NOW()。這是兩者最常考的差別。"}, {"id": "iWdxDSnmi90-1278", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 1278, "d": "D2", "topic": "LOD 運算式", "multi": false, "q": "What is the correct syntax of Fixed LOD?", "zh": "FIXED LOD 的正確語法是哪一個？", "o": ["{FIXED [Region] : SUM([Sales])}", "{FIXED,[Region] : SUM([Sales])}", "{FIXED [Region] : SUM([Sales])", "{FIXED [Region]} : {SUM([Sales])}"], "a": [0], "ex": "格式是 {FIXED 維度 : 彙總運算式}——整段用大括號包住，維度與運算式之間用冒號分隔，維度之間才用逗號。"}, {"id": "iWdxDSnmi90-1300", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 1300, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What is the output of MAKEDATE(2023,01,01)?", "zh": "MAKEDATE(2023,01,01) 的結果是什麼？", "o": ["2023-01-01", "01/01/2023", "2023-01-01", "01-01-2023"], "a": [1], "ex": "MAKEDATE(年, 月, 日) 會組出一個日期值，畫面上依預設日期格式顯示為 01/01/2023。"}, {"id": "iWdxDSnmi90-1320", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 1320, "d": "D2", "topic": "計算欄位", "multi": false, "q": "Which of the following is not a type of calculation in Tableau?", "zh": "下列哪一個不是 Tableau 的計算類型？", "o": ["Date Calculation", "Number Calculations", "String Calculation", "Text Calculation"], "a": [3], "ex": "Tableau 的函數分類是 Number、String、Date、Type Conversion、Aggregate、Logical、Table Calculation、LOD 等，沒有「Text Calculation」這個名稱（字串類叫 String）。"}, {"id": "iWdxDSnmi90-1341", "vid": "iWdxDSnmi90", "part": "AllAboutDATA P6", "ts": 1341, "d": "D2", "topic": "計算欄位", "multi": false, "q": "The function STDEV (expression) returns the statistical standard deviation of all values in all the expressions based on a sample of the population.", "zh": "是非題：STDEV 回傳的是以「樣本」為基礎的標準差。", "o": ["False", "True"], "a": [1], "ex": "True。STDEV 是樣本標準差；若要計算整個母體的標準差要用 STDEVP。同樣的區別也出現在 VAR 與 VARP。"}, {"id": "MJ36LDTBQ2Y-457", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 457, "d": "D3", "topic": "格式化與版面", "multi": true, "q": "Different ways to show mark label in the view? [Select all apply]", "zh": "要顯示標記標籤（mark label）有哪些做法？（複選）", "o": ["Drag field to text of mark card", "From analysis menu -> show mark label", "From worksheet menu -> show mark label", "Clicking show mark label on the toolbar."], "a": [0, 1], "ex": "兩個入口：把欄位拖到 Marks 卡的 Text（或 Label），或功能表 Analysis ▸ Show Mark Labels。Worksheet 選單沒有這個項目，工具列上的按鈕也不是標記標籤的開關。"}, {"id": "MJ36LDTBQ2Y-490", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 490, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "You need to access options to change a dimension's color palette. In addition to the Marks card, what else can you use?", "zh": "除了 Marks card 之外，還可以從哪裡更改維度的色盤？", "o": ["Edit in Shelf", "Edit Caption", "The Format menu", "The Color legend"], "a": [3], "ex": "視圖右側的色彩圖例（Color legend）雙擊或按下拉選 Edit Colors，就能改整個色盤與個別成員的顏色。Format 選單處理的是字型、框線、對齊這類格式，不是色盤。"}, {"id": "MJ36LDTBQ2Y-520", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 520, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "How can you access options to apply bold formatting to an axis in the view?", "zh": "要把視圖中座標軸的文字設為粗體，該怎麼進入設定？", "o": ["Select Text on the Marks card.", "Select Field Labels on the Format menu.", "Right-click on the Field and select Format.", "Right-click on the axis."], "a": [3], "ex": "直接在座標軸上按右鍵選 Format，右側會開啟該軸的格式窗格，可調字型與粗體。"}, {"id": "MJ36LDTBQ2Y-560", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 560, "d": "D3", "topic": "格式化與版面", "multi": true, "q": "What are multiple ways to access bolding options for the text in a tooltip?", "zh": "要把提示框（tooltip）中的文字設為粗體，有哪些做法？（複選）", "o": ["Hover over a mark and press CTRL+B.", "Hover over a mark and press ALT+F.", "Right-click on the Field and select Format.", "Select Worksheet on the menu, and then select Tooltip.", "Select Tooltip on the Marks card.", "Select Format on the menu, and then select Font."], "a": [2, 3, 4, 5], "ex": "進入提示框編輯器的路徑有：Marks 卡上的 Tooltip、Worksheet ▸ Tooltip、欄位右鍵 ▸ Format，以及 Format ▸ Font 統一設定字型。滑鼠停在標記上按快捷鍵並不會開啟格式設定。"}, {"id": "MJ36LDTBQ2Y-600", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 600, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "Does Tableau allow you to add custom color?", "zh": "Tableau 可以自訂顏色嗎？", "o": ["Yes", "No"], "a": [0], "ex": "可以。除了在 Edit Colors 裡挑選或輸入十六進位色碼，也能編輯 Preferences.tps 檔加入自訂色盤。"}, {"id": "MJ36LDTBQ2Y-640", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 640, "d": "D3", "topic": "格式化與版面", "multi": true, "q": "Which statements are correct? (Select 2)", "zh": "下列哪兩個敘述正確？（複選）", "o": ["Use shapes for categorical values", "Use shapes for quantitative values", "Use bars for categorical values", "Use bars for quantitative values", "Use a maximum of different 7 shapes"], "a": [0, 3], "ex": "形狀用來區分類別（質化）資料，長度／長條用來表達數量（量化）資料——這是視覺編碼的基本原則：形狀不適合表達大小，長條不適合表達類別身分。"}, {"id": "MJ36LDTBQ2Y-755", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 755, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "You want to set up a custom colour palette which is available in every workbook. Where should you set it up?", "zh": "想讓自訂色盤在每個活頁簿都能使用，該在哪裡設定？", "o": ["Marks card in the workbook", "Marks card in the server", "Preference.tps in your Tableau Desktop repository", "Preference.tps on Tableau Server"], "a": [2], "ex": "自訂色盤要寫進 My Tableau Repository 底下的 Preferences.tps，重啟 Tableau 後所有活頁簿都能選到。在 Marks 卡上改顏色只影響當前視圖。"}, {"id": "MJ36LDTBQ2Y-808", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 808, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "If a field with continuous values is dragged to Color marks, what color palette will we get?", "zh": "把連續值的欄位拖到 Color 標記，會得到哪一種色盤？", "o": ["Diverging color palette", "Sequential color palette", "Continuous color palette", "Discrete palette"], "a": [0], "ex": "依影片答案為 diverging（雙向）色盤。（實務上連續欄位預設多半是單色漸層的 sequential 色盤，含正負值時才會用 diverging，本題以影片給的答案為準。）"}, {"id": "MJ36LDTBQ2Y-830", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 830, "d": "D3", "topic": "格式化與版面", "multi": true, "q": "Valid ways to italicize tooltip content in Tableau? [Select All Apply]", "zh": "要把提示框內容設為斜體，有哪些有效做法？（複選）", "o": ["From worksheet menu", "From format Menu", "From Mark card - Tooltip option", "From analysis menu"], "a": [0, 1, 2], "ex": "Worksheet ▸ Tooltip、Format ▸ Font、以及 Marks 卡的 Tooltip 都能進入提示框的文字格式設定。Analysis 選單管的是分析功能，與格式無關。"}, {"id": "MJ36LDTBQ2Y-860", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 860, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "Default duration time for Animations is", "zh": "動畫的預設持續時間是多久？", "o": ["0.2 second", "0.3 second", "0.4 second", "0.5 second"], "a": [1], "ex": "Format ▸ Animations 的預設 Duration 是 0.3 秒（Medium）。可調整為更快或更慢。"}, {"id": "MJ36LDTBQ2Y-900", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 900, "d": "D3", "topic": "格式化與版面", "multi": true, "q": "What are the true statements about Animation?", "zh": "關於動畫，下列哪些敘述正確？（複選）", "o": ["It can be turned on for specific sheet only", "Sequential animations take more time but make complex changes clear by presenting them step by step", "It is possible to turn on animations for entire workbook."], "a": [0, 1, 2], "ex": "三個都對。動畫可以只對單一工作表開啟、也可以整本活頁簿開啟；動畫型態分 Simultaneous（同時）與 Sequential（循序），循序較慢但能把複雜變化一步步呈現。"}, {"id": "MJ36LDTBQ2Y-940", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 940, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "What does the highlighter marker/icon do in Tableau? (工具列上的螢光筆圖示)", "zh": "工具列上的螢光筆圖示有什麼作用？", "o": ["Toggle highlight on/off", "Hide", "Filter", "Clear values"], "a": [0], "ex": "那是 Highlight 的開關，按下後選取的標記會保持原色、其餘變淡，用來聚焦而不移除資料。"}, {"id": "MJ36LDTBQ2Y-958", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 958, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "Can we copy the formatting of one worksheet to another worksheet?", "zh": "可以把一張工作表的格式複製到另一張嗎？", "o": ["Yes", "No"], "a": [0], "ex": "可以。在工作表頁籤上按右鍵選 Copy Formatting，再到目標工作表按右鍵選 Paste Formatting。"}, {"id": "MJ36LDTBQ2Y-1060", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 1060, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "How to show Summary of a view in Tableau?", "zh": "要顯示視圖的摘要資訊（Summary）該怎麼做？", "o": ["Click on Worksheet menu -> Show Summary", "Click on Analysis Menu -> Show Summary", "Right on view name -> show Summary", "Right click on the field -> show Summary"], "a": [0], "ex": "Worksheet ▸ Show Summary 會開啟摘要卡，顯示目前視圖的筆數、總和、平均、最小最大值等統計。"}, {"id": "MJ36LDTBQ2Y-1100", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 1100, "d": "D3", "topic": "儀表板 Dashboards", "multi": false, "q": "What is a tooltip in Tableau?", "zh": "Tableau 的 tooltip 是什麼？", "o": ["A way to group related dimensions together.", "A way to limit the data displayed in a chart or table.", "A way to provide additional information about data points in a visualization.", "A way to create a custom calculation in a chart or table."], "a": [2], "ex": "提示框是滑鼠停在標記上時顯示的補充資訊，可放欄位值、說明文字，甚至嵌入另一張工作表（Viz in Tooltip）。"}, {"id": "MJ36LDTBQ2Y-1130", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 1130, "d": "D2", "topic": "Marks Card", "multi": false, "q": "What is the purpose of the marks card in Tableau?", "zh": "Marks card 的用途是什麼？", "o": ["To adjust the formatting of a chart or graph.", "To display a list of available charts and graphs.", "To apply filters to a chart or graph.", "To define the visual encoding of a chart or graph."], "a": [3], "ex": "Marks card 決定資料如何被「視覺編碼」：顏色、大小、形狀、標籤、細節、提示框，以及標記類型本身。"}, {"id": "MJ36LDTBQ2Y-1180", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 1180, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "What is the difference between a workbook and a worksheet in Tableau?", "zh": "活頁簿（workbook）與工作表（worksheet）的差別是什麼？", "o": ["A workbook contains multiple worksheets, while a worksheet contains a single visualization.", "A workbook is used to create visualizations, while a worksheet is used to connect to data sources.", "A workbook contains data sources, while a worksheet contains visualizations.", "A workbook is used to publish visualizations, while a worksheet is used to edit them."], "a": [0], "ex": "活頁簿是整份檔案，裡面可以有多張工作表、儀表板與故事；每張工作表就是一個視覺化。"}, {"id": "MJ36LDTBQ2Y-1220", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 1220, "d": "D3", "topic": "Story 故事", "multi": false, "q": "What is a story in Tableau?", "zh": "Tableau 的 story 是什麼？", "o": ["A story is a sheet that contains a sequence of worksheets or dashboards that work together to convey information.", "Stories can be used to show how facts are connected. Provide context."], "a": [0], "ex": "Story 本身是一種工作表，裡面依序放入工作表或儀表板（story point），用來把資料按敘事順序串起來說明。"}, {"id": "MJ36LDTBQ2Y-1254", "vid": "MJ36LDTBQ2Y", "part": "AllAboutDATA P7", "ts": 1254, "d": "D3", "topic": "格式化與版面", "multi": true, "q": "What two methods can you use to change the font of a worksheet title?", "zh": "要更改工作表標題的字型，有哪兩種做法？（複選）", "o": ["Select Format on the menu, and then select Title and Caption.", "Select Format on the menu, and then select Font.", "Double-click the title in a particular view and use the dialog box.", "Right-click the title in a view, and then select format Title."], "a": [1, 2], "ex": "兩種：Format ▸ Font 統一調整字型，或直接雙擊標題開啟編輯對話框在裡面改。"}, {"id": "1ZcDwpIFRqg-178", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 178, "d": "D3", "topic": "儀表板 Dashboards", "multi": false, "q": "Dashboard is a collection of ______", "zh": "儀表板是什麼的集合？", "o": ["Several workbook", "Several Worksheet", "Several story point"], "a": [1], "ex": "儀表板把多張工作表排在同一個畫面上，再加上篩選器、圖例、文字等物件並讓它們互相連動。"}, {"id": "1ZcDwpIFRqg-210", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 210, "d": "D3", "topic": "儀表板 Dashboards", "multi": false, "q": "How to duplicate a sheet?", "zh": "要複製一張工作表該怎麼做？", "o": ["Go to worksheet menu -> Duplicate", "Right click on sheet tab -> Duplicate", "Go to Dashboard menu -> Duplicate", "None of the above"], "a": [1], "ex": "在下方的工作表頁籤上按右鍵選 Duplicate，會複製出一張內容相同的新工作表。"}, {"id": "1ZcDwpIFRqg-240", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 240, "d": "D3", "topic": "儀表板動作 Actions", "multi": false, "q": "To send the information between sheets ______ are used.", "zh": "要在工作表之間傳遞資訊，使用什麼？", "o": ["URL Action", "Highlight Action", "Filter Action", "None"], "a": [2], "ex": "Filter action 把來源工作表選取的值當成條件送到目標工作表，是儀表板中跨表連動最常用的方式。"}, {"id": "1ZcDwpIFRqg-1023", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1023, "d": "D3", "topic": "格式化與版面", "multi": true, "q": "What are the types of Device preview options available in Tableau?", "zh": "Tableau 的裝置預覽（Device preview）有哪些類型？（複選）", "o": ["Default", "Desktop", "Phone", "Laptop"], "a": [0, 1, 2], "ex": "儀表板的 Device Preview 提供 Default、Desktop、Tablet、Phone 四種版面。沒有 Laptop 這個裝置類型。"}, {"id": "1ZcDwpIFRqg-1060", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1060, "d": "D3", "topic": "發佈到 Server / Cloud", "multi": false, "q": "Where do we publish workbooks/Dashboard?", "zh": "活頁簿／儀表板要發佈到哪裡？", "o": ["Tableau desktop", "Tableau Server", "Tableau Reader"], "a": [1], "ex": "Tableau Server（或 Tableau Cloud）是發佈目的地。Desktop 是製作工具，Reader 只能開啟本機的 .twbx 檔。"}, {"id": "1ZcDwpIFRqg-1090", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1090, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "What is the correct way to apply one font to the entire Workbook at a time?", "zh": "要一次把同一種字型套用到整本活頁簿，正確做法是？", "o": ["Format > Format Font", "Format > Title and Caption", "Format > Field Labels", "Format > Workbook"], "a": [3], "ex": "Format ▸ Workbook 開啟活頁簿層級的格式設定，改一次就套用到所有工作表；其他選項都只影響當前工作表的局部。"}, {"id": "1ZcDwpIFRqg-1120", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1120, "d": "D3", "topic": "儀表板動作 Actions", "multi": false, "q": "Types of Action available in Tableau?", "zh": "Tableau 有哪些動作（action）類型？", "o": ["Filter Action", "Highlight Action", "Go to URL", "Go to Sheet", "Change Parameter/Change Set Values", "All of the Above"], "a": [5], "ex": "以上皆是。Dashboard ▸ Actions 可建立 Filter、Highlight、Go to URL、Go to Sheet、Change Parameter、Change Set Values 六種。"}, {"id": "1ZcDwpIFRqg-1438", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1438, "d": "D3", "topic": "儀表板動作 Actions", "multi": true, "q": "Action Run options can be set to? [Select all apply]", "zh": "動作的觸發方式（Run action on）可以設定成哪些？（複選）", "o": ["Hover", "Select", "Menu", "Highlight"], "a": [0, 1, 2], "ex": "三種觸發方式：Hover（滑過）、Select（點選）、Menu（從提示框選單）。Highlight 是動作的「類型」而不是觸發方式。"}, {"id": "1ZcDwpIFRqg-1500", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1500, "d": "D3", "topic": "儀表板動作 Actions", "multi": false, "q": "What best describes a Filter Action in a Dashboard?", "zh": "哪個敘述最能描述儀表板中的 Filter Action？", "o": ["Displays a Hyperlink that user can click to access additional information online", "Displays a card by which the user can adjust the filter selection in the Dashboard", "Target sheet is filtered based on the selection in the Source sheet", "Used to highlight data in the view when user hovers over data points"], "a": [2], "ex": "Filter action 的核心行為：在來源工作表選取標記，目標工作表就依該選取值被篩選。第一個描述是 URL action、最後一個是 highlight action。"}, {"id": "1ZcDwpIFRqg-1550", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1550, "d": "D3", "topic": "格式化與版面", "multi": true, "q": "What are the possible methods to improve the font readability? (Select three options)", "zh": "要提升字體可讀性有哪三種做法？（複選）", "o": ["Make the Font as bold", "Increase the Font Size", "Make use of Underline", "Make use of a brighter Color"], "a": [0, 1, 3], "ex": "加粗、放大、用對比更明顯的顏色都能提升可讀性。底線反而會干擾文字辨識，不是建議做法。"}, {"id": "1ZcDwpIFRqg-1600", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1600, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "We need to make the title on a Dashboard Italic. Which is the menu we need to select?", "zh": "要把儀表板標題設成斜體，該從哪裡進入？", "o": ["Show dashboard title", "Right-click the Dashboard title > Select Edit Title", "Dashboard Tab", "Layout Tab"], "a": [1], "ex": "在儀表板標題上按右鍵選 Edit Title，會開啟文字編輯對話框，裡面就能設定斜體、字型與大小。"}, {"id": "1ZcDwpIFRqg-1640", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1640, "d": "D3", "topic": "Story 故事", "multi": false, "q": "A story point can contain either only Worksheet or only Dashboard but not both.", "zh": "是非題：一個 story point 只能放工作表或儀表板其中一種，不能兩者都放。", "o": ["True", "False"], "a": [0], "ex": "True。每個 story point 承載一張工作表或一個儀表板，不能在同一個 story point 裡同時放兩者。要並列多張圖，做法是先做成儀表板再放進 story point。"}, {"id": "1ZcDwpIFRqg-1655", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1655, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "We need to apply bold text formatting to the Rows or Columns separately i.e. independent of each other. Which is the best approach for it?", "zh": "要讓 Rows 與 Columns 的文字格式各自獨立設定（例如只把其中一邊變粗體），最好的做法是？", "o": ["Text on Marks card", "Rows tab or Columns tab on Format Font Pane", "Sheets tab on Format Font Pane", "Worksheet Menu > Font"], "a": [1], "ex": "Format ▸ Font 開啟的格式窗格上方有 Sheet／Rows／Columns 三個頁籤，切到 Rows 或 Columns 就能各自設定，不會互相影響。"}, {"id": "1ZcDwpIFRqg-1835", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1835, "d": "D3", "topic": "儀表板動作 Actions", "multi": true, "q": "Select the best options that describe dashboard actions (Select three options)", "zh": "哪三個敘述正確描述了儀表板動作？（複選）", "o": ["Can be used to link sheets to other sheets in any workbook", "Can have multiple Source and Target Sheets", "The Run action on can be set to Hover, Select or Menu", "Can be set to Filter, Highlight, or Go to URL"], "a": [1, 2, 3], "ex": "動作可以指定多張來源與目標工作表、觸發方式有 Hover／Select／Menu、類型包含 Filter／Highlight／Go to URL。但動作只能連結「同一本活頁簿」內的工作表，不能跨活頁簿。"}, {"id": "1ZcDwpIFRqg-1860", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1860, "d": "D3", "topic": "格式化與版面", "multi": true, "q": "What are the dashboard size options available in Tableau? [Select all apply]", "zh": "儀表板的尺寸選項有哪些？（複選）", "o": ["Fixed", "Custom zise", "Automatic",
