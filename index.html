dPbrkbDY", "part": "Part 8", "ts": 716, "d": "D4", "topic": "檔案格式與產品線", "multi": false, "q": "Which option is NOT a current, valid a Tableau file type?", "zh": "下列哪一個「不是」目前有效的 Tableau 檔案類型？", "o": [".twbx", ".twb", ".hyper", ".tde", ".tbm"], "a": [3], "ex": ".tde（Tableau Data Extract）是舊版擷取格式，自 2018.1 起已被 .hyper 取代並淘汰。.twb 是活頁簿、.twbx 是封裝活頁簿、.hyper 是現行擷取格式、.tbm 是書籤檔。"}, {"id": "kQuGn_QuNII-97", "vid": "kQuGn_QuNII", "part": "Part 9", "ts": 97, "d": "D3", "topic": "儀表板 Dashboards", "multi": false, "q": "True or False: You can embed external websites in Tableau dashboards.", "zh": "是非題：可以在 Tableau 儀表板中嵌入外部網站。", "o": ["true", "false"], "a": [0], "ex": "true。儀表板物件清單中有 Web Page 物件，把網址拖進去即可嵌入外部網頁；還能搭配 URL action 讓網頁內容隨著使用者點選的標記動態改變。"}, {"id": "kQuGn_QuNII-289", "vid": "kQuGn_QuNII", "part": "Part 9", "ts": 289, "d": "D2", "topic": "排序與群組", "multi": false, "q": "What does the \"Group\" feature in Tableau Desktop allow?", "zh": "Tableau Desktop 的「Group」功能可以做什麼？", "o": ["Grouping members of dimensions together", "Grouping users together", "Grouping visualizations together", "To cluster data automatically"], "a": [0], "ex": "Group 把同一個維度中的多個成員合併成一個新成員，例如把幾個州合併成「West」，或把拼寫不一致的類別合併。使用者群組是 Server 端的權限概念；自動分群是 Clustering。"}, {"id": "kQuGn_QuNII-477", "vid": "kQuGn_QuNII", "part": "Part 9", "ts": 477, "d": "D3", "topic": "發佈到 Server / Cloud", "multi": true, "q": "What does publishing a workbook to Tableau Public allow? (select multiple)", "zh": "把活頁簿發佈到 Tableau Public 可以做到哪些事？（複選）", "o": ["Sharing via link", "Embedding in websites", "Offline Access", "Setting Subscriptions", "Refreshing Data Extracts"], "a": [0, 1], "ex": "Tableau Public 提供公開連結與網頁嵌入碼。它不支援離線存取、不支援訂閱（那是 Server／Cloud 的功能），資料重新整理也受限（僅部分連接器可自動更新）。"}, {"id": "kQuGn_QuNII-618", "vid": "kQuGn_QuNII", "part": "Part 9", "ts": 618, "d": "D2", "topic": "地圖", "multi": false, "q": "Which feature should be used in Tableau to automatically categorize geographical data based on names?", "zh": "要讓 Tableau 依名稱自動辨識並分類地理資料，該用什麼功能？", "o": ["Geocoding", "Data extraction", "Spatial files", "Mapping"], "a": [0], "ex": "Geocoding（地理編碼）是 Tableau 內建的地理角色辨識：欄位命名為 City／State／Country 等時會自動指派地理角色並產生經緯度。Spatial file 是自帶幾何資訊的檔案，不是「依名稱自動分類」。"}];
const GLOSSARY = {"groups": [{"k": "core", "zh": "核心概念", "note": "這六組分不清楚，後面全部會卡住"}, {"k": "data", "zh": "連接與準備資料"}, {"k": "view", "zh": "視圖與圖表"}, {"k": "organize", "zh": "整理與篩選"}, {"k": "analyze", "zh": "分析功能"}, {"k": "share", "zh": "儀表板與分享"}, {"k": "file", "zh": "檔案格式與產品"}], "terms": [{"g": "core", "en": "Dimension", "zh": "維度", "note": "質化資料（名稱、類別、日期）。它負責「切分」——把資料分成一組一組。預設放在資料窗格上半部。"}, {"g": "core", "en": "Measure", "zh": "度量", "note": "量化資料（數值）。它負責「計算」——拖進視圖時會自動被彙總成 SUM。"}, {"g": "core", "en": "Discrete", "zh": "離散", "note": "藍色欄位，產生一格一格的「標題（header）」。注意：離散不等於維度，度量也可以轉成離散。"}, {"g": "core", "en": "Continuous", "zh": "連續", "note": "綠色欄位，產生一條有範圍的「座標軸（axis）」。同樣地，連續不等於度量，日期就常是連續維度。"}, {"g": "core", "en": "Aggregation", "zh": "彙總", "note": "把多列壓成一個值：SUM、AVG、MIN、MAX、COUNT、COUNTD 等。度量預設 SUM。"}, {"g": "core", "en": "Granularity / Level of Detail", "zh": "細分層級（粒度）", "note": "視圖裡每個標記代表多細的資料。維度放越多、粒度越細；彙總越多、粒度越粗。兩者是反向關係。"}, {"g": "core", "en": "Mark", "zh": "標記", "note": "視圖中的一個資料點（一根長條、一個圓點、一格方塊）。左下角會顯示目前有幾個標記。"}, {"g": "core", "en": "Row-level vs Aggregate calculation", "zh": "列層級 vs 彙總計算", "note": "[Sales]-[Cost] 是逐列算再彙總；SUM([Sales])-SUM([Cost]) 是先彙總再相減。遇到比率類計算兩者結果會不同。"}, {"g": "data", "en": "Data Source", "zh": "資料來源", "note": "一組連線設定加上你對它做的所有中繼調整（改名、計算欄位、預設屬性）。"}, {"g": "data", "en": "Live Connection", "zh": "即時連線", "note": "每次操作都直接查來源，資料永遠最新，但速度取決於來源。"}, {"g": "data", "en": "Extract", "zh": "擷取", "note": "把資料存成本地 .hyper 快照。優點是快、可離線、資料量大也撐得住；缺點是需要排程更新。"}, {"g": "data", "en": "Incremental Refresh", "zh": "增量更新", "note": "只把比上次更新更新的列加進擷取檔，不重載全部（那是 Full Refresh）。"}, {"g": "data", "en": "Join", "zh": "結合", "note": "在「實體層」把兩張表接寬——欄位變多。要指定型別：inner／left／right／full outer 四種。"}, {"g": "data", "en": "Union", "zh": "聯集", "note": "把結構相同的表往下疊——列變多。欄位型別要一致，只能在同一個連線內做。"}, {"g": "data", "en": "Relationship", "zh": "關聯", "note": "「邏輯層」的麵條線。不必指定 join 型別，Tableau 依視圖用到的欄位自動決定查詢，還會保留各表原本的粒度。"}, {"g": "data", "en": "Data Blending", "zh": "資料混合", "note": "跨「不同資料來源」在視圖層級合併，行為等同 left join。主要來源藍勾、次要來源橘勾。是最後手段，不是首選。"}, {"g": "data", "en": "Logical / Physical Layer", "zh": "邏輯層／實體層", "note": "Relationship 在邏輯層，Join 與 Union 在實體層。雙擊邏輯表就進到實體層。"}, {"g": "data", "en": "Pivot", "zh": "欄轉列", "note": "把多個欄位轉成「欄位名／值」兩欄的直式結構，常用在把年度分欄的寬表整理成長表。"}, {"g": "data", "en": "Split / Custom Split", "zh": "分割", "note": "用分隔符號把一欄拆成多欄。Custom Split 可以指定分隔符號與要取第幾欄（從左或從右數）。"}, {"g": "data", "en": "Alias", "zh": "別名", "note": "改成員的「顯示名稱」，不動底層資料。只有離散維度可以設，度量、日期、連續欄位都不行。"}, {"g": "data", "en": "Data Interpreter", "zh": "資料解譯器", "note": "自動清掉試算表的裝飾標題、空白列、合併儲存格。只對檔案類來源有效，連 SQL 資料庫時不會出現。"}, {"g": "data", "en": "Custom SQL", "zh": "自訂 SQL", "note": "直接寫 SQL 定義資料來源。彈性大但可能影響效能。"}, {"g": "data", "en": "Metadata Grid", "zh": "中繼資料格線", "note": "資料來源頁的欄位清單檢視，可看隱藏欄位、來源原始欄位名、欄位屬於哪張表。"}, {"g": "data", "en": "Default Properties", "zh": "預設屬性", "note": "欄位層級的預設設定：數值格式、預設彙總、顏色、排序、註解。改一次全活頁簿適用。"}, {"g": "data", "en": "Replace References", "zh": "取代參照", "note": "欄位改名或換資料來源後，把所有用到舊欄位的地方一次指向新欄位。"}, {"g": "data", "en": "Data Source Filter", "zh": "資料來源篩選器", "note": "在資料來源層級就先濾掉資料，所有工作表都套用，執行順序排在最前面。"}, {"g": "data", "en": "Web Data Connector (WDC)", "zh": "網頁資料連接器", "note": "連接 REST API、JSON、XML 等網路資料來源的機制。"}, {"g": "view", "en": "Worksheet", "zh": "工作表", "note": "一張視覺化。多張工作表組成活頁簿。"}, {"g": "view", "en": "Shelf", "zh": "架", "note": "Columns、Rows、Filters、Pages 這些放欄位的區域。"}, {"g": "view", "en": "Marks Card", "zh": "標記卡", "note": "決定資料怎麼被「視覺編碼」：Color、Size、Label／Text、Detail、Tooltip、Shape、Path，以及標記類型本身。"}, {"g": "view", "en": "Detail", "zh": "細節", "note": "Marks 卡上的屬性。放欄位進去會把標記切更細，但不改變視圖結構——用來提高粒度而不加座標軸。"}, {"g": "view", "en": "Pages Shelf", "zh": "頁面架", "note": "把欄位拖進去會產生播放控制器，可逐頁前進或自動播放，形成動畫。與篩選器不同，它是「一次看一頁」。"}, {"g": "view", "en": "Show Me", "zh": "顯示方式", "note": "右上角的圖表建議面板，會依你選的欄位亮出可用圖表，並標示各圖表需要幾個維度／度量。"}, {"g": "view", "en": "Axis vs Header", "zh": "座標軸 vs 標題", "note": "連續欄位產生軸（有刻度範圍），離散欄位產生標題（一格一格的標籤）。這是判斷藍綠的最快方式。"}, {"g": "view", "en": "Dual Axis", "zh": "雙軸", "note": "把第二個度量以獨立的軸疊在同一窗格。兩個度量各有自己的 Marks 卡，可分別設定顏色與標記類型。刻度要對齊再選 Synchronize Axis。"}, {"g": "view", "en": "Crosstab / Text Table", "zh": "交叉表", "note": "純文字的表格。每格一個標記，資料一多渲染最慢，是效能最差的圖表。"}, {"g": "view", "en": "Highlight Table", "zh": "強調表", "note": "交叉表加上顏色深淺。標記類型是 Square，只用 Color。"}, {"g": "view", "en": "Heat Map", "zh": "熱圖", "note": "用 Size ＋ Color 兩個屬性呈現，預設形狀是正方形。與只用顏色的 Highlight Table 不同。"}, {"g": "view", "en": "Treemap", "zh": "樹狀圖", "note": "巢狀長方形，面積代表大小。適合呈現階層與占比。"}, {"g": "view", "en": "Packed Bubbles", "zh": "打包泡泡圖", "note": "以圓的大小比較各類別的量體差異。"}, {"g": "view", "en": "Histogram", "zh": "直方圖", "note": "看單一度量的分布。只需要一個度量，Tableau 會自動產生 bin 欄位。"}, {"g": "view", "en": "Scatter Plot", "zh": "散佈圖", "note": "兩個度量各占一軸，看兩者的關係。需要兩個度量。"}, {"g": "view", "en": "Box-and-Whisker Plot", "zh": "盒鬚圖", "note": "呈現分布：盒子是四分位距（IQR），中線是中位數，鬚線外是離群值。"}, {"g": "view", "en": "Gantt Chart", "zh": "甘特圖", "note": "用長條長度表示「持續時間」，沿時間軸排列。適合追蹤期間與進度。"}, {"g": "view", "en": "Symbol Map / Filled Map", "zh": "符號地圖／填色地圖", "note": "前者在地圖上放標記（大小顏色編碼），後者把區域整塊填色。"}, {"g": "view", "en": "Geographic Role", "zh": "地理角色", "note": "指派欄位為 City／State／Country 等，Tableau 會自動產生 Latitude／Longitude (generated) 兩個度量。"}, {"g": "organize", "en": "Filter", "zh": "篩選器", "note": "把資料從視圖中移除。離散欄位有 General／Wildcard／Condition／Top 四個頁籤；連續欄位是範圍式的。"}, {"g": "organize", "en": "Context Filter", "zh": "內容篩選器", "note": "先執行並產生暫存子集，之後的篩選與 Top N 都以這個子集為母體。在架上顯示為灰色。只有 Top N、占比、FIXED LOD 這類「需要看全體」的計算才會受影響。"}, {"g": "organize", "en": "Order of Operations", "zh": "執行順序", "note": "Extract → Data source → Context → Dimension → Measure → Table calc。記住這串就能解釋大部分「篩選結果跟預期不一樣」。"}, {"g": "organize", "en": "Group", "zh": "群組", "note": "把同一維度的多個成員合併成一個新成員（圖示是迴紋針）。用於合併相似類別或修正拼寫不一致。"}, {"g": "organize", "en": "Set", "zh": "集合", "note": "維度成員的子集，分 In／Out 兩邊（圖示是兩個交疊的圓）。可用 Top N 條件並綁定參數做成動態集合。"}, {"g": "organize", "en": "Bin", "zh": "組距", "note": "把連續數值切成等距區間。只有數值欄位能建立，是直方圖的基礎。"}, {"g": "organize", "en": "Hierarchy", "zh": "階層", "note": "把相關維度依層級組織（如 Category ▸ Sub-Category），視圖上會出現 +／− 可逐層鑽取。圖示是樹狀分支。"}, {"g": "organize", "en": "Sort", "zh": "排序", "note": "依 Data Source Order／Alphabetic／Field／Manual 排序。入口有座標軸、欄位標籤、標題三處。"}, {"g": "organize", "en": "Parameter", "zh": "參數", "note": "使用者可調整的「單一值」變數。允許值有 All／List／Range 三種，不能多選。常搭配計算欄位驅動篩選、Top N、參考線。"}, {"g": "organize", "en": "Highlight", "zh": "強調", "note": "讓相關標記保持原色、其餘變淡。注意資料仍然全部都在——這是它與 Filter 最大的差別。"}, {"g": "analyze", "en": "Calculated Field", "zh": "計算欄位", "note": "你自己寫公式產生的新欄位。編輯器裡函數藍色、欄位橘色、參數紫色。"}, {"g": "analyze", "en": "Table Calculation", "zh": "表計算", "note": "在「視圖已彙總的結果」上再算一次：Running Total、Percent of Total、Rank、Moving Average、YOY Growth 等。範圍分 Table／Pane／Cell。"}, {"g": "analyze", "en": "LOD Expression", "zh": "細分層級運算式", "note": "{FIXED 維度 : 彙總}。讓計算跳脫視圖的粒度。FIXED 完全忽略視圖、INCLUDE 加入更細的維度、EXCLUDE 移除視圖中的維度。"}, {"g": "analyze", "en": "Reference Line / Band", "zh": "參考線／參考區間", "note": "在軸上畫一條線或一個區間（常數、平均、中位數、參數驅動）。範圍可設 Table／Pane／Cell。"}, {"g": "analyze", "en": "Trend Line", "zh": "趨勢線", "note": "模型有 Linear、Logarithmic、Exponential、Power、Polynomial 五種。沒有 Table／Pane／Cell 的範圍選擇。"}, {"g": "analyze", "en": "Forecast", "zh": "預測", "note": "以指數平滑法往未來延伸並給信賴區間。需要一個日期加至少一個度量。"}, {"g": "analyze", "en": "Cluster", "zh": "分群", "note": "依度量值自動把相近的標記分組，用來從雜亂的散點中找出群體。"}, {"g": "analyze", "en": "Totals / Grand Totals", "zh": "總計／小計", "note": "從 Analytics 窗格拖入或 Analysis ▸ Totals 加入。"}, {"g": "share", "en": "Dashboard", "zh": "儀表板", "note": "把多張工作表排在同一畫面，加上篩選器、圖例、文字、圖片、網頁等物件並讓它們連動。"}, {"g": "share", "en": "Story", "zh": "故事", "note": "把工作表或儀表板依序串成敘事頁籤（story point）。一個 story point 只能放一張工作表或一個儀表板。"}, {"g": "share", "en": "Dashboard Action", "zh": "儀表板動作", "note": "類型：Filter、Highlight、Go to URL、Go to Sheet、Change Parameter、Change Set Values。觸發方式：Hover、Select、Menu。"}, {"g": "share", "en": "Tooltip", "zh": "提示框", "note": "滑鼠停在標記上顯示的補充資訊。"}, {"g": "share", "en": "Viz in Tooltip", "zh": "提示框內嵌圖表", "note": "把另一張工作表嵌進提示框，會自動以該標記為條件篩選。"}, {"g": "share", "en": "Tiled vs Floating", "zh": "並排 vs 浮動", "note": "Tiled 物件自動排開不重疊；Floating 可自由擺放並疊 /* ---------------- storage ---------------- */
let DB = {attempts:[], seen:{}};
function load(){ try{ const r=localStorage.getItem(STORE); if(r){ const d=JSON.parse(r); DB.attempts=d.attempts||[]; DB.seen=d.seen||{}; } }catch(e){} }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(DB)); }catch(e){} }
load();

/* ---------------- helpers ---------------- */
const domOf = id => DOMAINS.find(d=>d.id===id) || {id:id, zh:id, weight:0};
const eqSet = (a,b)=> a.length===b.length && [...a].sort((x,y)=>x-y).every((v,i)=>v===[...b].sort((x,y)=>x-y)[i]);
const mmss = s => Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const clock = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Questions pulled straight from the real exam (not a video) carry vid:"exam" and
// have no timestamp to link to — skip the link instead of pointing at a broken one.
const tlinkHTML = q => q.vid==="exam" ? "" :
  '<a class="tlink" href="https://youtu.be/'+q.vid+'?t='+q.ts+'" target="_blank" rel="noopener">影片 '+mmss(q.ts)+' ↗</a>';
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function recordResult(q, correct){
  const s = DB.seen[q.id] || {n:0,ok:0};
  s.n++; if(correct) s.ok++;
  DB.seen[q.id] = s; save();
}
function statsBy(keyFn){
  const m = new Map();
  QS.forEach(q=>{
    const s = DB.seen[q.id]; if(!s || !s.n) return;
    const k = keyFn(q); const e = m.get(k) || {n:0,ok:0};
    e.n += s.n; e.ok += s.ok; m.set(k, e);
  });
  return m;
}

/* ---------------- tabs ---------------- */
// A sandboxed frame ignores the browser's own confirm dialog, so asking that
// way silently returned "no" and every confirmation flow died. Ask in the page.
function askConfirm(opts){
  return new Promise(resolve=>{
    const back = document.getElementById("modal-back");
    const ok = document.getElementById("modal-ok");
    const cancel = document.getElementById("modal-cancel");
    document.getElementById("modal-title").textContent = opts.title || "確認";
    document.getElementById("modal-body").textContent = opts.body || "";
    ok.textContent = opts.ok || "確定";
    cancel.textContent = opts.cancel || "取消";
    ok.className = "btn" + (opts.danger ? " danger" : "");
    back.hidden = false;
    ok.focus();
    const done = v =>{
      back.hidden = true;
      ok.onclick = cancel.onclick = back.onclick = null;
      document.removeEventListener("keydown", key);
      resolve(v);
    };
    const key = e =>{ if(e.key==="Escape") done(false); };
    ok.onclick = ()=>done(true);
    cancel.onclick = ()=>done(false);
    back.onclick = e =>{ if(e.target===back) done(false); };
    document.addEventListener("keydown", key);
  });
}

function examInProgress(){
  return !!session && session.mode==="exam" && !session.done;
}
// One place decides what happens when an unfinished exam is about to be left,
// so the tab bar, the 結束作答 button and closing the browser all agree.
async function confirmLeaveExam(what){
  if(!examInProgress()) return true;
  const answered = Object.keys(session.picks).length;
  return askConfirm({
    title: what,
    body: "模擬考尚未完成（已作答 " + answered + " / " + session.qs.length + " 題）。\n" +
          "結束後這次作答不會計入測驗紀錄，也無法回到原本的進度。",
    ok: "結束作答", cancel: "繼續作答", danger: true});
}
function abandonExam(){
  if(session && session.timer) clearInterval(session.timer);
  endSession();
  renderExamHome();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = async ()=>{
    // 設定 is the one tab that does not end a running exam. Turning the text up
    // because you cannot read it should not cost you the attempt — and the clock
    // keeps running while you are in there, so it is not a way to buy time.
    if(t.dataset.view!=="exam" && t.dataset.view!=="prefs"){
      if(!(await confirmLeaveExam("離開模擬考"))) return;
      if(examInProgress()) abandonExam();
    }
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t));
    ["exam","topic","stats","browse","gloss","prefs"].forEach(v=>{
      document.getElementById("view-"+v).hidden = (v!==t.dataset.view);
    });
    if(t.dataset.view==="stats") renderStats();
    if(t.dataset.view==="topic") renderTopicHome();
    if(t.dataset.view==="browse") renderBrowse();
    if(t.dataset.view==="gloss") renderGlossary();
    if(t.dataset.view==="prefs") renderPrefs();
    if(t.dataset.view==="exam" && !session) renderExamHome();
    window.scrollTo({top:0,behavior:"smooth"});
  };
});

/* =====================================================================
   SESSION ENGINE — used by both 模擬考 (timed, feedback at end)
   and 主題練習 (untimed, feedback per question)
   ===================================================================== */
let session = null;   // {mode, qs, picks, flags, i, tLeft, timer, done, startedAt}
const wideScreen = ()=> window.matchMedia("(min-width:700px)").matches;
// null means "follow the screen size" — decided at render time, not once at load,
// so a phone gets it collapsed even if the page was first laid out wider.
let navOpenChoice = null;
const navShouldOpen = ()=> navOpenChoice === null ? wideScreen() : navOpenChoice;

function buildExamSet(n){
  // draw by domain weight, fall back to whatever exists
  const want = {};
  DOMAINS.forEach(d=> want[d.id] = Math.round(n * d.weight / 100));
  let pool = [], used = new Set();
  DOMAINS.forEach(d=>{
    const avail = shuffle(QS.filter(q=>q.d===d.id));
    avail.slice(0, want[d.id]).forEach(q=>{ pool.push(q); used.add(q.id); });
  });
  const rest = shuffle(QS.filter(q=>!used.has(q.id)));
  while(pool.length < n && rest.length) pool.push(rest.pop());
  return shuffle(pool).slice(0, n);
}

function startSession(mode, qs, opts){
  opts = opts || {};
  session = {mode, qs, picks:{}, flags:{}, revealed:{}, i:0, done:false,
             graded:mode!=="exam", startedAt:Date.now(),
             label:opts.label||"", tLeft: mode==="exam" ? EXAM.minutes*60 : null};
  if(mode==="exam"){
    session.timer = setInterval(()=>{
      session.tLeft--;
      const el = document.getElementById("timer");
      if(el){
        el.textContent = clock(session.tLeft);
        el.className = "timer" + (session.tLeft<=300?" crit":session.tLeft<=600?" warn":"");
      }
      if(session.tLeft<=0) finishExam(true);
    }, 1000);
  }
  render();
}
function endSession(){ if(session && session.timer) clearInterval(session.timer); session=null; }

function render(){
  const host = document.getElementById(session && session.mode==="exam" ? "view-exam" : "view-topic");
  if(!session) return;
  if(session.done){ renderResults(host); return; }
  const q = session.qs[session.i];
  const picked = session.picks[q.id] || [];
  const revealed = session.graded && !!session.revealed[q.id];

  host.innerHTML = "";

  // top bar
  const top = document.createElement("div");
  top.className = "examtop";
  if(session.mode==="exam"){
    top.innerHTML = '<span class="timer" id="timer">'+clock(session.tLeft)+'</span>'+
      '<span class="progresstext">第 '+(session.i+1)+' / '+session.qs.length+' 題　·　已作答 '+Object.keys(session.picks).length+'</span>';
    const submit = document.createElement("button");
    submit.className = "btn sm"; submit.textContent = "交卷";
    submit.style.marginLeft = "auto";
    submit.onclick = async ()=>{
      const left = session.qs.length - Object.keys(session.picks).length;
      if(await askConfirm({title:"交卷",
          body:(left ? "還有 " + left + " 題未作答，未作答會計為錯誤。\n" : "") + "交卷後會顯示分數與逐題解析，並計入測驗紀錄。",
          ok:"確定交卷", cancel:"再檢查一下"})) finishExam(false);
    };
    top.appendChild(submit);
    const abandon = document.createElement("button");
    abandon.className = "btn ghost sm"; abandon.textContent = "結束作答";
    abandon.onclick = async ()=>{ if(await confirmLeaveExam("結束作答")) abandonExam(); };
    top.appendChild(abandon);
  } else {
    top.innerHTML = '<span class="progresstext">'+esc(session.label)+'　·　第 '+(session.i+1)+' / '+session.qs.length+' 題</span>';
    const quit = document.createElement("button");
    quit.className = "btn ghost sm"; quit.textContent = "結束練習"; quit.style.marginLeft="auto";
    quit.onclick = ()=>{ session.done = true; render(); };
    top.appendChild(quit);
  }
  host.appendChild(top);

  // question card
  const card = document.createElement("div");
  card.className = "card";
  const d = domOf(q.d);
  const head = document.createElement("div");
  head.className = "qhead";
  head.innerHTML = '<span class="qnum">Q'+String(session.i+1).padStart(2,"0")+'</span>'+
    '<span class="chip">'+esc(d.zh)+'</span><span class="chip plain">'+esc(q.topic)+'</span>'+
    (q.multi?'<span class="chip multi">複選</span>':'')+
    (session.mode==="exam" ? '' : (q.src==="narration"?'<span class="chip narr" title="答案取自講者口述">口述</span>':''))+
    (session.mode==="exam" ? '' : tlinkHTML(q));
  card.appendChild(head);

  const stem = document.createElement("p"); stem.className="stem"; stem.textContent=q.q; card.appendChild(stem);
  // The exam is in English, so a translation sitting under the stem while you
  // answer is a crutch in any mode. It appears once the answer is revealed —
  // by then you are learning, not being tested. (The exam has no reveal step;
  // its translation comes back in the post-submit review.)
  if(revealed){
    const zh = document.createElement("p"); zh.className="stem-zh"; zh.textContent=q.zh;
    card.appendChild(zh);
  }

  const opts = document.createElement("div"); opts.className="opts";
  q.o.forEach((text,k)=>{
    const b = document.createElement("button");
    b.className="opt"; b.type="button"; b.disabled = revealed;
    if(revealed){
      if(q.a.includes(k)) b.classList.add("right");
      else if(picked.includes(k)) b.classList.add("wrong");
    } else if(picked.includes(k)) b.classList.add("picked");
    b.innerHTML = '<span class="key">'+KEYS[k]+'</span><span>'+esc(text)+'</span>';
    if(revealed){
      const m = document.createElement("span");
      if(q.a.includes(k)){ m.className="mark ok"; m.textContent="正解"; b.appendChild(m); }
      else if(picked.includes(k)){ m.className="mark no"; m.textContent="你選的"; b.appendChild(m); }
    }
    b.onclick = ()=>{
      if(q.multi){
        const s = new Set(session.picks[q.id]||[]);
        s.has(k)?s.delete(k):s.add(k);
        session.picks[q.id] = [...s];
      } else {
        session.picks[q.id] = [k];
      }
      render();
    };
    opts.appendChild(b);
  });
  card.appendChild(opts);

  if(revealed){
    const ok = eqSet(picked, q.a);
    const v = document.createElement("div");
    v.className = "verdict " + (ok?"ok":"no");
    v.innerHTML = '<h3>'+(ok?"答對了":"答錯了")+'　<span class="mono" style="font-size:12.5px;font-weight:400">正解：'+
      q.a.map(i=>KEYS[i]+". "+esc(q.o[i])).join("　")+'</span></h3>';
    const p = document.createElement("p"); p.textContent = q.ex; v.appendChild(p);
    card.appendChild(v);
  }

  // actions
  const act = document.createElement("div"); act.className="actions";
  if(session.i>0){
    const pb = document.createElement("button");
    pb.className="btn ghost"; pb.textContent="上一題";
    pb.onclick = ()=>{ session.i--; render(); };
    act.appendChild(pb);
  }
  if(session.graded && !revealed){
    const sb = document.createElement("button");
    sb.className="btn"; sb.textContent = q.multi?"送出（可複選）":"送出答案";
    sb.disabled = picked.length===0;
    sb.onclick = ()=>{ session.revealed[q.id] = true; recordResult(q, eqSet(picked, q.a)); render(); };
    act.appendChild(sb);
  } else {
    const nb = document.createElement("button");
    nb.className="btn";
    nb.textContent = session.i===session.qs.length-1 ? (session.mode==="exam"?"最後一題":"看結果") : "下一題";
    nb.onclick = async ()=>{
      if(session.i===session.qs.length-1){
        if(session.mode==="exam"){
          if(await askConfirm({title:"最後一題", body:"這是最後一題，要交卷了嗎？", ok:"交卷", cancel:"再檢查一下"})) finishExam(false);
        }
        else { session.done=true; render(); }
      } else { session.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
    };
    act.appendChild(nb);
  }
  if(session.mode==="exam"){
    const fb = document.createElement("button");
    fb.className="btn ghost"; fb.textContent = session.flags[q.id] ? "★ 已標記" : "☆ 標記待複查";
    fb.onclick = ()=>{ session.flags[q.id] = !session.flags[q.id]; render(); };
    act.appendChild(fb);
  }
  const hint = document.createElement("span");
  hint.className="hint"; hint.textContent="鍵盤 1–6 選項　Enter 下一步";
  act.appendChild(hint);
  card.appendChild(act);
  // navigator sits above the question so the whole exam stays in view. On a
  // phone 45 cells would bury the question, so it starts collapsed there and
  // remembers whatever the reader chooses.
  if(session.mode==="exam"){
    const nav = document.createElement("details");
    nav.className="card navcard";
    nav.open = navShouldOpen();          // set before wiring ontoggle, so this does not count as a choice
    nav.ontoggle = ()=>{ navOpenChoice = nav.open; };
    const sum = document.createElement("summary");
    sum.innerHTML = '<span>題目導覽</span><span class="navsum">已作答 ' +
      Object.keys(session.picks).length + ' / ' + session.qs.length + '</span>';
    nav.appendChild(sum);
    const grid = document.createElement("div"); grid.className="nav-grid";
    session.qs.forEach((qq,idx)=>{
      const c = document.createElement("button");
      c.className = "nav-cell" + (session.picks[qq.id]?" answered":"") + (session.flags[qq.id]?" flagged":"") + (idx===session.i?" now":"");
      c.textContent = idx+1;
      c.title = "第 "+(idx+1)+" 題" + (session.picks[qq.id]?"（已作答）":"（未作答）");
      c.onclick = ()=>{
        session.i = idx;
        if(!wideScreen()) navOpenChoice = false;   // on a phone, collapse so the question is visible
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      };
      grid.appendChild(c);
    });
    nav.appendChild(grid);
    const lg = document.createElement("div");
    lg.className="legendline";
    lg.innerHTML = '<span><i style="background:var(--accent)"></i>已作答</span><span><i style="background:var(--warn)"></i>已標記</span><span><i style="background:var(--line-strong)"></i>未作答</span>';
    nav.appendChild(lg);
    host.appendChild(nav);
  }

  host.appendChild(card);
}

function finishExam(auto){
  if(session.timer) clearInterval(session.timer);
  session.done = true;
  // Time can run out while you are on 設定; land back on the paper, not on a
  // settings screen with no hint that the exam just ended.
  if(auto) setTimeout(()=>{
    const tab = document.querySelector('.tab[data-view="exam"]');
    if(tab && tab.getAttribute("aria-selected")!=="true") tab.click();
  }, 0);
  session.autoSubmitted = !!auto;
  session.elapsed = Math.round((Date.now()-session.startedAt)/1000);
  session.qs.forEach(q=> recordResult(q, eqSet(session.picks[q.id]||[], q.a)));
  const right = session.qs.filter(q=>eqSet(session.picks[q.id]||[], q.a)).length;
  const byDom = {};
  session.qs.forEach(q=>{
    const e = byDom[q.d] || {n:0,ok:0};
    e.n++; if(eqSet(session.picks[q.id]||[], q.a)) e.ok++;
    byDom[q.d]=e;
  });
  DB.attempts.unshift({
    at: Date.now(), kind:"exam", n: session.qs.length, right,
    pct: Math.round(right/session.qs.length*100),
    elapsed: session.elapsed, byDom
  });
  DB.attempts = DB.attempts.slice(0,50);
  save();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

  session.qs.forEach((q,idx)=>{
    const ok = eqSet(session.picks[q.id]||[], q.a);
    const c = document.createElement("button");
    c.className = "nav-cell " + (ok?"right":"wrong");
    c.textContent = idx+1;
    c.onclick = ()=>{ document.getElementById("rev-"+idx).scrollIntoView({behavior:"smooth",block:"center"}); };
    grid.appendChild(c);
  });
  rcard.appendChild(grid);
  host.appendChild(rcard);

  session.qs.forEach((q,idx)=>{
    const picked = session.picks[q.id] || [];
    const ok = eqSet(picked, q.a);
    const e = document.createElement("article");
    e.className="entry"; e.id = "rev-"+idx;
    e.innerHTML = '<div class="qhead"><span class="qnum">Q'+String(idx+1).padStart(2,"0")+'</span>'+
      '<span class="chip">'+esc(domOf(q.d).zh)+'</span><span class="chip plain">'+esc(q.topic)+'</span>'+
      '<span class="chip '+(ok?"":"multi")+'" style="'+(ok?'background:var(--ok-soft);color:var(--ok)':'background:var(--bad-soft);color:var(--bad)')+'">'+(ok?"答對":"答錯")+'</span>'+
      tlinkHTML(q)+'</div>'+
      '<p class="stem">'+esc(q.q)+'</p><p class="stem-zh">'+esc(q.zh)+'</p>';
    const ul = document.createElement("ul"); ul.className="ans";
    q.o.forEach((t,k)=>{
      const li = document.createElement("li");
      if(q.a.includes(k)) li.className="hit";
      let tag = q.a.includes(k) ? "✔" : KEYS[k];
      li.innerHTML = '<span class="b">'+tag+'</span><span>'+esc(t)+(picked.includes(k)&&!q.a.includes(k)?' <span style="color:var(--bad)">← 你選的</span>':'')+'</span>';
      ul.appendChild(li);
    });
    e.appendChild(ul);
    const why = document.createElement("p"); why.className="why"; why.textContent=q.ex; e.appendChild(why);
    host.appendChild(e);

  const act = document.createElement("div"); act.className="card";
  const row = document.createElement("div"); row.className="row";
  const again = document.createElement("button");
  again.className="btn"; again.textContent = session.mode==="exam" ? "再考一次（重新抽題）" : "回主題列表";
  again.onclick = ()=>{

    else renderTopicHome();

  const wrong = session.qs.filter(q=>!eqSet(session.picks[q.id]||[], q.a));
  if(wrong.length){

    wb.onclick = ()=>{ const w=[...wrong]; endSession(); document.querySelector('.tab[data-view="topic"]').click(); startSession("practice", shuffle(w), {label:"錯題複習"}); };
    row.appendChild(wb);
  }
  const back = document.createElement("button");
  back.className="btn ghost"; back.textContent="回設定畫面";
  back.onclick = ()=>{ const m=session.mode; endSession(); if(m==="exam") renderExamHome(); else renderTopicHome(); };
  row.appendChild(back);
  act.appendChild(row);
  host.appendChild(act);
}

/* ---------------- 紀錄與弱點 ---------------- */
function barChart(rows, sortWorst){
  const wrap = document.createElement("div"); wrap.className="chart";
  const data = sortWorst ? [...rows].sort((a,b)=> a.ok/a.n - b.ok/b.n) : rows;
  data.forEach(r=>{
    const pct = Math.round(r.ok/r.n*100);
    const cls = pct>=80?"good":pct>=60?"mid":"low";
    const row = document.createElement("div"); row.className="crow";
    row.innerHTML = '<span class="clabel" title="'+esc(r.label)+'">'+esc(r.label)+'</span>'+
      '<span class="ctrack"><span class="cfill '+cls+'" style="width:'+Math.max(pct,2)+'%"></span></span>'+
      '<span class="cval">'+pct+'%　'+r.ok+'/'+r.n+'</span>';
    wrap.appendChild(row);
  });
  const lg = document.createElement("div"); lg.className="legendline";
  lg.innerHTML = '<span><i style="background:var(--ok)"></i>穩 80%+</span>'+
                 '<span><i style="background:var(--warn)"></i>普通 60–79%</span>'+
                 '<span><i style="background:var(--bad)"></i>弱 &lt;60%</span>';
  wrap.appendChild(lg);
  return wrap;
}
function weakestTopics(n){
  const m = statsBy(q=>q.topic);
  return [...m.entries()].filter(([,v])=>v.n>=2).map(([k,v])=>({label:k,ok:v.ok,n:v.n}))
    .sort((a,b)=> a.ok/a.n - b.ok/b.n).slice(0,n).filter(r=> r.ok/r.n < 0.85);
}

          const names = new Set(weak.map(w=>w.label));
          document.querySelector('.tab[data-view="topic"]').click();
          startSession("practice", shuffle(QS.filter(q=>names.has(q.topic))), {label:"弱點補強"});
        };
        row.appendChild(b);
        c.appendChild(row);
      }
      host.appendChild(c);
    }
  }

  const hc = document.createElement("div"); hc.className="card";
  hc.innerHTML = '<h2>模擬考紀錄</h2>';
  if(!exams.length){
    const e = document.createElement("div"); e.className="empty"; e.textContent="還沒有模擬考紀錄。";
    hc.appendChild(e);
  } else {
    const ul = document.createElement("ul"); ul.className="hlist";
    exams.forEach(a=>{
      const li = document.createElement("li");
      const dt = new Date(a.at);
      const stamp = dt.getFullYear()+"/"+String(dt.getMonth()+1).padStart(2,"0")+"/"+String(dt.getDate()).padStart(2,"0")+" "+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0");
      li.innerHTML = '<span class="hdate">'+stamp+'</span>'+
        '<span class="hkind">'+a.n+' 題　·　用時 '+clock(a.elapsed)+'</span>'+
        '<span class="hscore" style="color:'+(a.pct>=EXAM.pass?'var(--ok)':'var(--bad)')+'">'+a.pct+'%</span>'+
        '<span class="hdate">'+a.right+'/'+a.n+'</span>';
      ul.appendChild(li);
    });
    hc.appendChild(ul);
    const row = document.createElement("div"); row.className="row";
    const cl = document.createElement("button");
    cl.className="btn ghost sm"; cl.textContent="清除所有紀錄";
    cl.onclick = async ()=>{
      if(await askConfirm({title:"清除紀錄", body:"確定清除所有作答紀錄與弱點統計？此動作無法復原。",
                           ok:"清除", cancel:"取消", danger:true})){ DB={attempts:[],seen:{}}; save(); renderStats(); }
    };
    row.appendChild(cl);
    hc.appendChild(row);
  }
  host.appendChild(hc);
}

/* ---------------- 題庫總覽 ---------------- */
function renderBrowse(){
  const host = document.getElementById("view-browse");
  if(host.dataset.built) return;
  host.dataset.built = "1";
  host.innerHTML = "";
  const bar = document.createElement("div"); bar.className="card";
  bar.innerHTML = '<h2>題庫總覽</h2>';
  const fb = document.createElement("div"); fb.className="filterbar";
  const sel = document.createElement("select");
  sel.innerHTML = '<option value="">全部領域</option>' + DOMAINS.map(d=>'<option value="'+d.id+'">'+esc(d.zh)+'</option>').join("");
  const q = document.createElement("input");
  q.type="search"; q.placeholder="搜尋題目關鍵字…"; q.style.flex="1"; q.style.minWidth="180px";
  const count = document.createElement("span"); count.className="progresstext";
  fb.append(sel, q, count);
  bar.appendChild(fb);
  host.appendChild(bar);

  const list = document.createElement("div"); list.className="stack";
  host.appendChild(list);

  function draw(){
    const term = q.value.trim().toLowerCase();
    const rows = QS.filter(x=> (!sel.value || x.d===sel.value) &&
      (!term || (x.q+" "+x.zh+" "+x.topic+" "+x.o.join(" ")).toLowerCase().includes(term)));
    count.textContent = rows.length + " 題";
    list.innerHTML = "";
    rows.forEach((x,n)=>{
      const e = document.createElement("article"); e.className="entry";
      e.innerHTML = '<div class="qhead"><span class="qnum">'+esc(x.part)+'</span>'+
        '<span class="chip">'+esc(domOf(x.d).zh)+'</span><span class="chip plain">'+esc(x.topic)+'</span>'+
        (x.multi?'<span class="chip multi">複選</span>':'')+
        (x.src==="narration"?'<span class="chip narr" title="這題畫面上的綠勾未被擷取到，答案取自講者在影片中口述的結論">答案來自口述</span>':'')+
        tlinkHTML(x)+'</div>'+
        '<p class="stem">'+esc(x.q)+'</p><p class="stem-zh">'+esc(x.zh)+'</p>';
      const ul = document.createElement("ul"); ul.className="ans";
      x.o.forEach((t,k)=>{
        const li = document.createElement("li");
        if(x.a.includes(k)) li.className="hit";
        li.innerHTML = '<span class="b">'+(x.a.includes(k)?"✔":KEYS[k])+'</span><span>'+esc(t)+'</span>';
        ul.appendChild(li);
      });
      e.appendChild(ul);
      const why = document.createElement("p"); why.className="why"; why.textContent=x.ex; e.appendChild(why);
      list.appendChild(e);
    });
    if(!rows.length){
      const em = document.createElement("div"); em.className="empty"; em.textContent="沒有符合的題目。";
      list.appendChild(em);
    }
  }
  sel.onchange = draw; q.oninput = draw;
  draw();
}

/* ---------------- 名詞對照 ---------------- */
function renderGlossary(){
  const host = document.getElementById("view-gloss");
  if(host.dataset.built) return;
  host.dataset.built = "1";
  host.innerHTML = "";

  const bar = document.createElement("div"); bar.className="card";
  bar.innerHTML = '<h2>名詞對照</h2><p class="note">考試是英文出題，這裡把題庫裡實際出現的名詞整理成中英對照，'+
    '重點放在容易混淆的幾組。搜尋中英文都可以。</p>';
  const fb = document.createElement("div"); fb.className="filterbar";
  const q = document.createElement("input");
  q.type="search"; q.placeholder="搜尋名詞或解釋…"; q.style.flex="1"; q.style.minWidth="180px";
  const count = document.createElement("span"); count.className="gloss-count";
  fb.append(q, count); bar.appendChild(fb); host.appendChild(bar);

  const list = document.createElement("div"); list.className="stack";
  host.appendChild(list);

  function draw(){
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    list.innerHTML = "";
    GLOSSARY.groups.forEach(g=>{
      const items = GLOSSARY.terms.filter(t=> t.g===g.k &&
        (!term || (t.en+" "+t.zh+" "+t.note).toLowerCase().includes(term)));
      if(!items.length) return;
      shown += items.length;
      const card = document.createElement("div"); card.className="card gloss-group";
      card.innerHTML = '<h3>'+esc(g.zh)+'</h3>' + (g.note ? '<p class="gloss-note">'+esc(g.note)+'</p>' : '');
      items.forEach(t=>{
        const el = document.createElement("div"); el.className="term";
        el.innerHTML = '<div class="term-head"><span class="term-en">'+esc(t.en)+'</span>'+
                       '<span class="term-zh">'+esc(t.zh)+'</span></div><p>'+esc(t.note)+'</p>';
        card.appendChild(el);
      });
      list.appendChild(card);
    });
    count.textContent = shown + " 個名詞";
    if(!shown){
      const em = document.createElement("div"); em.className="empty"; em.textContent="沒有符合的名詞。";
      list.appendChild(em);
    }
  }
  q.oninput = draw;
  draw();
}
if(!GLOSSARY || !GLOSSARY.terms || !GLOSSARY.terms.length){
  document.getElementById("tab-gloss").hidden = true;   // banks without a glossary just don't show the tab
}

/* ---------------- display preferences ---------------- */
// Under their own storage key, so 清除紀錄 wipes the attempt history without
// also throwing away how the person set the page up to read.
const PREFS_KEY = "tableau-bank-v2" + ":prefs";
const FS_STEPS = [{v:.9,n:"小"},{v:1,n:"標準"},{v:1.15,n:"大"},{v:1.3,n:"更大"},{v:1.45,n:"特大"}];
const THEMES = [{v:"light",n:"白色系",c:"light"},{v:"dark",n:"黑色系",c:"dark"},
                {v:"system",n:"跟系統設定相同",c:"sys"}];
let PREFS = {theme:"system", fs:1};
try{
  const p = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
  if(THEMES.some(t=>t.v===p.theme)) PREFS.theme = p.theme;
  if(FS_STEPS.some(f=>f.v===p.fs)) PREFS.fs = p.fs;
}catch(e){}
function applyPrefs(){
  const r = document.documentElement;
  if(PREFS.theme==="system") delete r.dataset.theme; else r.dataset.theme = PREFS.theme;
  r.style.setProperty("--fs", PREFS.fs);
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); }catch(e){}
}
applyPrefs();
const sysDark = window.matchMedia("(prefers-color-scheme:dark)");

function renderPrefs(){
  const host = document.getElementById("view-prefs");
  if(host.dataset.built){ host._sync(); return; }
  host.dataset.built = "1";

  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = '<h2>設定</h2><p class="note">只改變這台裝置上的顯示方式，'+
    '不會動到作答紀錄，也不會影響題目內容。</p>';

  const fsBox = document.createElement("div"); fsBox.className = "pref";
  fsBox.innerHTML = '<h3>字體大小</h3>';
  const fsSeg = document.createElement("div"); fsSeg.className = "seg";
  FS_STEPS.forEach(f=>{
    const b = document.createElement("button"); b.type = "button";
    // the label is drawn at the size it sets, so the choice is visible in the control
    b.innerHTML = '<span class="sz" style="font-size:'+(13*f.v).toFixed(1)+'px">Aa</span>'+f.n;
    b.onclick = ()=>{ PREFS.fs = f.v; applyPrefs(); host._sync(); };
    fsSeg.appendChild(b);
  });
  fsBox.appendChild(fsSeg);

  const thBox = document.createElement("div"); thBox.className = "pref";
  thBox.innerHTML = '<h3>背景顏色</h3>';
  const thSeg = document.createElement("div"); thSeg.className = "seg";
  THEMES.forEach(t=>{
    const b = document.createElement("button"); b.type = "button";
    b.innerHTML = '<span class="sw '+t.c+'"></span>'+t.n;
    b.onclick = ()=>{ PREFS.theme = t.v; applyPrefs(); host._sync(); };
    thSeg.appendChild(b);
  });
  const thNote = document.createElement("p"); thNote.className = "note";
  thBox.append(thSeg, thNote);

  // A sample built from the real question classes: judging a text size against
  // lorem ipsum tells you nothing about whether you can read an exam stem.
  const prev = document.createElement("div"); prev.className = "prefprev";
  prev.innerHTML = '<span class="prevtag">預覽</span>'+
    '<p class="stem">Which of the following is a valid aggregation in Tableau?</p>'+
    '<p class="stem-zh">下列哪一個是 Tableau 中有效的彙總方式？</p>'+
    '<div class="opts">'+
      '<div class="opt picked"><span class="key">A</span><span>MEDIAN</span></div>'+
      '<div class="opt"><span class="key">B</span><span>ROUNDUP</span></div>'+
    '</div>';

  const foot = document.createElement("div"); foot.className = "row";
  const reset = document.createElement("button");
  reset.className = "btn ghost sm"; reset.type = "button"; reset.textContent = "回復預設";
  reset.onclick = ()=>{ PREFS = {theme:"system", fs:1}; applyPrefs(); host._sync(); };
  foot.appendChild(reset);

  card.append(fsBox, thBox, prev, foot);
  host.innerHTML = ""; host.appendChild(card);

  host._sync = ()=>{
    [...fsSeg.children].forEach((b,i)=> b.setAttribute("aria-pressed", FS_STEPS[i].v===PREFS.fs));
    [...thSeg.children].forEach((b,i)=> b.setAttribute("aria-pressed", THEMES[i].v===PREFS.theme));
    thNote.textContent = PREFS.theme==="system"
      ? "目前系統是" + (sysDark.matches ? "深色" : "淺色") + "模式，頁面會跟著變。"
      : "固定使用" + (PREFS.theme==="dark" ? "深色" : "淺色") + "，不受系統設定影響。";
  };
  host._sync();
}
sysDark.addEventListener("change", ()=>{
  const h = document.getElementById("view-prefs");
  if(h.dataset.built) h._sync();
});

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e=>{
  if(!session || session.done) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  const q = session.qs[session.i];
  if(e.key>="1" && e.key<="6"){
    const k=+e.key-1;
    if(k<q.o.length){
      const btns = document.querySelectorAll(".opt");
      if(btns[k] && !btns[k].disabled) btns[k].click();
    }
  }
  if(e.key==="Enter"){
    const b = document.querySelector(".actions .btn:not(.ghost)");
    if(b && !b.disabled) b.click();
  }
  if(e.key==="ArrowRight" && session.i<session.qs.length-1){ session.i++; render(); }
  if(e.key==="ArrowLeft" && session.i>0){ session.i--; render(); }
});

window.addEventListener("beforeunload", e=>{
  if(examInProgress()){ e.preventDefault(); e.returnValue = ""; }
});

renderExamHome();
</script>
