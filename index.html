 "Range"], "a": [0, 2, 3], "ex": "三種：Fixed size（固定尺寸）、Automatic（隨視窗自動調整）、Range（在最小與最大之間縮放）。沒有叫 Custom size 的獨立選項。"}, {"id": "1ZcDwpIFRqg-1875", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1875, "d": "D3", "topic": "儀表板 Dashboards", "multi": true, "q": "Select the Objects that are available in a Tableau Dashboard. (Select all apply)", "zh": "哪些是 Tableau 儀表板可用的物件？（複選）", "o": ["Vertical Container", "Web Page", "Video", "Extension", "URL Link", "Data story"], "a": [0, 1, 3, 5], "ex": "儀表板物件包含 Horizontal／Vertical 容器、Text、Image、Web Page、Blank、Navigation、Download、Extension、Data Story。沒有 Video 物件，也沒有叫「URL Link」的物件（要連外部網址是用 Go to URL 動作）。"}, {"id": "1ZcDwpIFRqg-1885", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1885, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "Floating option allows to overlap the sheets in the dashboard", "zh": "是非題：Floating（浮動）可以讓儀表板中的工作表互相重疊。", "o": ["True", "False"], "a": [0], "ex": "True。Tiled（並排）物件會自動排開不重疊；Floating 物件則可以自由放置並疊在其他物件之上。"}, {"id": "1ZcDwpIFRqg-1890", "vid": "1ZcDwpIFRqg", "part": "AllAboutDATA P8", "ts": 1890, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "Which statement accurately describes adding a dashboard layout for a mobile device?", "zh": "關於為行動裝置加入儀表板版面，哪個敘述正確？", "o": ["Dashboards designed in portrait mode are optimal for viewing on a phone.", "Dashboard device layout changes will be saved between workbooks.", "Only workbooks published to Tableau Online support mobile layouts.", "Dashboard changes made for one device layout apply to other device layouts."], "a": [0], "ex": "手機是直向持握，所以直向（portrait）版面最適合手機檢視。每個裝置版面是各自獨立的，改了其中一個不會影響其他版面，也不會跨活頁簿保存。"}, {"id": "5sQje-6Bf34-242", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 242, "d": "D3", "topic": "匯出與列印", "multi": false, "q": "In which situation should you save a workbook as a PDF document?", "zh": "什麼情況下應該把活頁簿存成 PDF？", "o": ["Users have Tableau Desktop but not Tableau Reader.", "You want document users to be able to filter and sort the views.", "Analysis does not require a live connection to a data source.", "You need to maintain local hard copies of the views."], "a": [3], "ex": "PDF 是靜態快照，適合需要留存或列印紙本的情境。它不能互動（無法篩選排序），所以想保留互動性應該給 .twbx 讓對方用 Tableau Reader 開。"}, {"id": "5sQje-6Bf34-280", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 280, "d": "D3", "topic": "匯出與列印", "multi": false, "q": "From a Tableau Dashboard we need to export an image. Which path should we use?", "zh": "要從儀表板匯出圖片，該走哪個路徑？", "o": ["Dashboard Menu > Copy Image", "Dashboard Menu > Export Image", "Format Menu > Copy Formatting", "File Menu > Save As"], "a": [1], "ex": "儀表板畫面下的 Dashboard 選單有 Export Image，可存成 PNG／JPEG 等圖檔。Copy Image 只是複製到剪貼簿。"}, {"id": "5sQje-6Bf34-320", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 320, "d": "D3", "topic": "匯出與列印", "multi": false, "q": "Invalid format of exporting is", "zh": "下列哪一個「不是」有效的匯出格式？", "o": ["Export as workbook", "Export as Image", "Export as data", "None of the above"], "a": [0], "ex": "Worksheet ▸ Export 提供 Image、Data、Crosstab to Excel。「Export as workbook」不存在——要產生活頁簿檔案是用 File ▸ Save As。"}, {"id": "5sQje-6Bf34-360", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 360, "d": "D3", "topic": "儀表板動作 Actions", "multi": false, "q": "What does a URL action on a Dashboard do?", "zh": "儀表板上的 URL action 有什麼作用？", "o": ["Displays a drop-down list with a filter option the user can click", "Open a webpage of a web-based resource from an action on the source sheet", "Used to connect to Web-based data to create a data source", "Used to filter data between two views on a Dashboard"], "a": [1], "ex": "URL action 讓使用者點選標記時開啟指定網址，網址還能帶入該標記的欄位值。它不是資料連線方式，也不是篩選。"}, {"id": "5sQje-6Bf34-400", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 400, "d": "D3", "topic": "匯出與列印", "multi": true, "q": "When exporting a worksheet as an image in Tableau, which of the following formats are available? [Select all Apply]", "zh": "把工作表匯出成圖片時，有哪些格式可選？（複選）", "o": [".BMP", ".PNG", ".SVG", ".JPEG"], "a": [0, 1, 2, 3], "ex": "四種都可以：Worksheet ▸ Export ▸ Image 的存檔類型包含 PNG、BMP、JPEG 與 EMF／SVG 這類向量格式。"}, {"id": "5sQje-6Bf34-440", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 440, "d": "D3", "topic": "匯出與列印", "multi": false, "q": "Which of the following are valid ways to copy a worksheet?", "zh": "複製工作表的有效做法是哪一個？", "o": ["By simply click ctrl + V", "Click on analysis menu -> Copy -> image", "Click on worksheet menu -> copy -> image", "Right click on the worksheet viz -> Copy"], "a": [3], "ex": "在視圖上按右鍵選 Copy 即可複製。Analysis 選單沒有 Copy；Worksheet 選單的 Copy 是複製影像或資料而非工作表本身。"}, {"id": "5sQje-6Bf34-482", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 482, "d": "D4", "topic": "檔案格式與產品線", "multi": false, "q": "We need to share the workbook with anyone who does not have access to the data source and the external files associated with that workbook. The workbook has to be shared in what format?", "zh": "對方沒有資料來源與相關外部檔案的存取權，活頁簿要用什麼格式分享？", "o": [".twb", ".twbx", ".tde", "All of the above"], "a": [1], "ex": ".twbx 是封裝活頁簿，把資料擷取、背景圖片、自訂圖形等一起打包，對方不需要連到原始資料就能開啟。.twb 只有活頁簿本身，開啟時仍需要原始連線。"}, {"id": "5sQje-6Bf34-531", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 531, "d": "D3", "topic": "匯出與列印", "multi": false, "q": "We need to save a Workbook in Tableau as a PDF. We need to use", "zh": "要把活頁簿存成 PDF，該用哪個路徑？", "o": ["Presentation mode in the Toolbar", "File > Print to PDF", "Worksheet -> Export -> PDF", "File > Save As"], "a": [1], "ex": "File ▸ Print to PDF 會把選定的工作表輸出成 PDF。Worksheet ▸ Export ▸ Image 的清單裡沒有 PDF。"}, {"id": "5sQje-6Bf34-560", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 560, "d": "D3", "topic": "匯出與列印", "multi": false, "q": "We need to save a Workbook in Tableau as a Powerpoint. We need to use", "zh": "要把活頁簿存成 PowerPoint，該用哪個路徑？", "o": ["Presentation mode in the Toolbar", "File > Print to Powerpoint", "Worksheet -> Export -> Powerpoint", "File > Save As"], "a": [1], "ex": "依影片答案為 File 選單下的 PowerPoint 輸出。（新版 Tableau 的正式名稱是 File ▸ Export As PowerPoint，位置相同、名稱略有出入。）"}, {"id": "5sQje-6Bf34-600", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 600, "d": "D4", "topic": "檔案格式與產品線", "multi": true, "q": "Which three elements are included in a packaged workbook (.twbx)? (Choose three.)", "zh": ".twbx 封裝活頁簿包含哪三種元素？（複選）", "o": ["Background images", "A PDF copy of the workbook", "Custom shapes", "Tableau Datasource Customization (TDC) files", "Extract files"], "a": [0, 2, 4], "ex": ".twbx 打包的是活頁簿執行所需的本機資源：背景圖片、自訂圖形、以及資料擷取檔。它不會附上 PDF，TDC 檔屬於連接器層級的設定也不在其中。"}, {"id": "5sQje-6Bf34-640", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 640, "d": "D4", "topic": "檔案格式與產品線", "multi": false, "q": "What is a .TBM file?", "zh": ".tbm 是什麼檔案？", "o": ["Table bookmark", "Tableau bookmark", "Tableau bin mark", "Tableau data extract"], "a": [1], "ex": ".tbm 是 Tableau Bookmark（書籤），保存單一工作表以便在其他活頁簿重複使用。"}, {"id": "5sQje-6Bf34-700", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 700, "d": "D4", "topic": "檔案格式與產品線", "multi": false, "q": "Does a .TDSX file contain data and workbook?", "zh": "是非題：.tdsx 檔包含資料與活頁簿。", "o": ["True", "False"], "a": [1], "ex": "False。.tdsx 是封裝「資料來源」——連線資訊加上本機資料檔或擷取，但不含活頁簿（視覺化）。含活頁簿的是 .twbx。"}, {"id": "5sQje-6Bf34-760", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 760, "d": "D4", "topic": "檔案格式與產品線", "multi": false, "q": "What is a .TDE file?", "zh": ".tde 是什麼檔案？", "o": ["Tableau Workbook", "Tableau data extract", "Tableau data source", "None of the above"], "a": [1], "ex": ".tde 是舊版的 Tableau Data Extract 格式，2018.1 之後已由 .hyper 取代。"}, {"id": "5sQje-6Bf34-817", "vid": "5sQje-6Bf34", "part": "AllAboutDATA P9", "ts": 817, "d": "D4", "topic": "檔案格式與產品線", "multi": false, "q": "Data source file has ______ extension.", "zh": "資料來源檔的副檔名是什麼？", "o": [".tde", ".tds", ".tdsx", ".twbx"], "a": [1], "ex": ".tds 是 Tableau Data Source，只存連線資訊與中繼設定；封裝版本（連資料一起打包）是 .tdsx。"}, {"id": "lsiczrhapcs-412", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 412, "d": "D4", "topic": "維度 vs 度量", "multi": true, "q": "Which three statements accurately describe dimensions?", "zh": "哪三個敘述正確描述了「維度」？（複選）", "o": ["Contain qualitative values", "Affect the level of detail in the view", "Affect the formatting options in the view", "Can be continuous or discrete", "Contain numeric, quantitative values"], "a": [0, 1, 3], "ex": "維度存的是質化資料（名稱、類別、日期），會決定視圖的細分層級，而且可以是離散或連續（例如連續日期）。數值型的量化資料是度量的特徵。"}, {"id": "lsiczrhapcs-430", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 430, "d": "D4", "topic": "維度 vs 度量", "multi": true, "q": "Which statements accurately describe measures? (Select all apply)", "zh": "哪些敘述正確描述了「度量」？（複選）", "o": ["Measures are aggregated by default when dragged into views", "Affect the level of detail in the view", "Affect the formatting options in the view", "Can be continuous or discrete", "Contain numeric, quantitative values"], "a": [0, 3, 4], "ex": "度量拖進視圖時預設會被彙總（SUM）、內容是數值型的量化資料、而且也能在連續與離散之間切換。改變視圖細分層級的是維度而不是度量。"}, {"id": "lsiczrhapcs-460", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 460, "d": "D4", "topic": "維度 vs 度量", "multi": true, "q": "Which statements are correct?", "zh": "下列哪些敘述正確？（複選）", "o": ["Measure can be discrete or Continuous", "Dimensions are Numeric & Qualitative", "measures are numeric & Quantitative", "Dimensions can be only discrete"], "a": [0, 2], "ex": "度量可以是離散或連續，內容是數值型的量化資料。維度是質化的（不必然是數值），而且也能是連續，所以另外兩句都不對。"}, {"id": "lsiczrhapcs-500", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 500, "d": "D4", "topic": "維度 vs 度量", "multi": true, "q": "In Tableau, what are the ways that Dimensions and Measures are different? (Select all apply)", "zh": "維度與度量有哪些不同？（複選）", "o": ["When brought into a view Measures are aggregated by default whereas dimensions are not", "Dimensions affect the level of detail of a view whereas Measures do not", "Measures can be used as a Filter whereas Dimensions cannot", "Dimensions can be used in Calculated Fields whereas Measures cannot"], "a": [0, 1], "ex": "兩個關鍵差別：度量預設被彙總、維度不會；維度決定視圖的細分層級、度量不會。維度與度量都能當篩選器，也都能用在計算欄位裡。"}, {"id": "lsiczrhapcs-540", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 540, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "How many auto generated fields are added in dimensions?", "zh": "資料窗格的維度區會自動產生幾個欄位？", "o": ["2", "3", "4", "1"], "a": [3], "ex": "維度區只會自動多出一個 Measure Names。（度量區則會有 Measure Values，地理資料另外會產生 Latitude／Longitude。）"}, {"id": "lsiczrhapcs-580", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 580, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "What is created by a dimension that is placed in a view?", "zh": "把維度放進視圖會產生什麼？", "o": ["An Axis", "A filter", "A label/Header", "A field"], "a": [2], "ex": "離散的維度產生的是「標題（header）」——一格一格的標籤。只有連續欄位才會產生座標軸。"}, {"id": "lsiczrhapcs-620", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 620, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "What is created by a measure that is placed in a view?", "zh": "把度量放進視圖會產生什麼？", "o": ["A filter with a range of values", "A field with headers", "A label with names of fields", "An axis with range of values"], "a": [3], "ex": "度量預設是連續的，放進視圖會產生一條有數值範圍的座標軸。"}, {"id": "lsiczrhapcs-741", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 741, "d": "D4", "topic": "彙總與細分層級", "multi": true, "q": "What aggregations are possible for measures? (Select all apply)", "zh": "度量可以套用哪些彙總方式？（複選）", "o": ["Sum", "Percentage", "CountD", "Max"], "a": [0, 2, 3], "ex": "Measure 選單提供 Sum、Average、Median、Count、Count Distinct、Minimum、Maximum、Std. Dev、Variance 等。Percentage 不是彙總方式，而是表計算或「百分比」顯示設定。"}, {"id": "lsiczrhapcs-770", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 770, "d": "D4", "topic": "彙總與細分層級", "multi": false, "q": "By default, is aggregation possible for both dimensions and measures?", "zh": "是非題：預設情況下維度與度量都會被彙總。", "o": ["True", "False"], "a": [1], "ex": "False。只有度量拖進視圖時會自動被彙總（SUM）；維度不會，它是用來分組的。"}, {"id": "lsiczrhapcs-800", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 800, "d": "D1", "topic": "資料型別與欄位角色", "multi": true, "q": "Data types available for dimensions (Select All Apply)", "zh": "維度可以是哪些資料型別？（複選）", "o": ["Boolean", "Number", "sum", "Geograhic"], "a": [0, 3], "ex": "維度可以是布林值與地理值（也可以是字串、日期）。Sum 是彙總方式不是資料型別；Number 型別的欄位通常會被歸為度量。"}, {"id": "lsiczrhapcs-830", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 830, "d": "D4", "topic": "彙總與細分層級", "multi": false, "q": "Can we use multiple aggregation for the same measure field?", "zh": "同一個度量欄位可以同時套用多種彙總嗎？", "o": ["Yes", "No"], "a": [1], "ex": "依影片答案為 No——同一個欄位（pill）一次只能有一種彙總。（不過同一個度量可以重複拖進視圖多次，每一份各自設定不同的彙總，所以實務上是做得到的，這題問法偏向「單一 pill」。）"}, {"id": "lsiczrhapcs-860", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 860, "d": "D4", "topic": "離散 vs 連續", "multi": true, "q": "Which two types of fields appear blue? (Choose two.)", "zh": "哪兩種欄位會顯示為藍色？（複選）", "o": ["Continuous measures", "Discrete dimensions", "Discrete measures", "Continuous dimensions"], "a": [1, 2], "ex": "藍色代表「離散」，與維度或度量無關。所以離散維度與離散度量都是藍色。"}, {"id": "lsiczrhapcs-880", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 880, "d": "D4", "topic": "離散 vs 連續", "multi": true, "q": "Which two types of fields appear green? (Choose two.)", "zh": "哪兩種欄位會顯示為綠色？（複選）", "o": ["Continuous measures", "Discrete dimensions", "Discrete measures", "Continuous dimensions"], "a": [0, 3], "ex": "綠色代表「連續」，所以連續度量與連續維度都是綠色。"}, {"id": "lsiczrhapcs-912", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 912, "d": "D1", "topic": "資料型別與欄位角色", "multi": false, "q": "Number of decimal points supported by Tableau", "zh": "Tableau 支援幾位小數？", "o": ["8", "16", "24", "32"], "a": [1], "ex": "Tableau 的浮點數精度支援到 16 位小數。"}, {"id": "lsiczrhapcs-1016", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 1016, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "From the below mentioned values select the Discrete Date Part", "zh": "下列哪一個是「離散」的日期部分（date part）？", "o": ["4 Nov 22", "2019", "2022 Q4", "May 2021"], "a": [1], "ex": "Date part 只取日期的某一個部分，例如年份「2019」。其餘三個都是完整或組合的日期值（date value），屬於連續日期。"}, {"id": "lsiczrhapcs-1056", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 1056, "d": "D4", "topic": "彙總與細分層級", "multi": false, "q": "From where can we change the default aggregation for a measure?", "zh": "要更改度量的預設彙總方式，從哪裡設定？", "o": ["Data pane > Measure Field > Default Properties > Aggregation", "Rows Shelf > Measure Field > Measure (Sum)", "Data Grid in Data Source Page > Measure Field > Default Properties > Aggregation", "Metadata Grid in Data Source Page > Measure Field > Default Properties > Aggregation"], "a": [0], "ex": "在資料窗格的度量上按右鍵 ▸ Default Properties ▸ Aggregation，改的是「預設值」，之後每次拖進視圖都套用。在 Rows 上改只影響那一個 pill。"}, {"id": "lsiczrhapcs-1080", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 1080, "d": "D1", "topic": "資料型別與欄位角色", "multi": true, "q": "From the below data types select the ones that cannot be continuous (Select two options)", "zh": "下列哪兩種資料型別「不能」是連續的？（複選）", "o": ["Number (whole)", "Strings", "Boolean", "Date"], "a": [1, 2], "ex": "字串與布林值沒有數值上的連續性，只能是離散。數值與日期都可以在離散與連續之間切換。"}, {"id": "lsiczrhapcs-1100", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 1100, "d": "D4", "topic": "維度 vs 度量", "multi": true, "q": "From the below field types select the ones that will be represented as measures in Tableau (Select two options)", "zh": "下列哪兩個欄位在 Tableau 中會被歸類為度量？（複選）", "o": ["Shipping Date", "Discount", "Region", "Profit"], "a": [1, 3], "ex": "Discount 與 Profit 是數值，會被放進度量區。Shipping Date 是日期、Region 是文字，兩者都會被歸為維度。"}, {"id": "lsiczrhapcs-1120", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 1120, "d": "D4", "topic": "彙總與細分層級", "multi": false, "q": "What is the default type of aggregation applied to measures?", "zh": "度量預設套用哪一種彙總？", "o": ["Sum", "Avg", "ATTR", "Min"], "a": [0], "ex": "預設是 SUM，所以拖進視圖的度量會顯示成 SUM(欄位名)。"}, {"id": "lsiczrhapcs-1140", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 1140, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "In Tableau, dates can be used in two ways as Discrete & Continuous", "zh": "是非題：在 Tableau 中，日期可以用離散與連續兩種方式呈現。", "o": ["True", "False"], "a": [0], "ex": "True。離散日期（date part）產生一格一格的標題，連續日期（date value）產生連續的時間軸，兩者可在欄位下拉選單自由切換。"}, {"id": "lsiczrhapcs-1333", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 1333, "d": "D4", "topic": "彙總與細分層級", "multi": false, "q": "We need to change a measure such that it automatically aggregates as a Count instead of a Sum. Select the best option", "zh": "要讓某個度量預設以 Count 而非 Sum 彙總，最好的做法是？", "o": ["Right-click the measure in the Data pane, Select Change Data Type", "Drag and drop the measure in the Rows/Columns shelf. Right-click the measure, Select the desired Aggregation", "Right-click the measure in the Data pane, Select Default Properties", "Drag and drop the measure into the view. Right-click the measure and select Format to change the required Aggregation"], "a": [2], "ex": "關鍵字是「自動」——要改預設行為就得設 Default Properties ▸ Aggregation。在 Rows 上改只對當下那一個 pill 生效，不是預設值。"}, {"id": "lsiczrhapcs-1360", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 1360, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "With respect to the placement of pills in a shelf, which of the below statements are true?", "zh": "關於欄位（pill）在架上的擺放位置，哪個敘述正確？", "o": ["We cannot drop a dimension in front/left or behind/right of another dimension", "We cannot drop a dimension in front/left of a measure", "We cannot drop a measure in front/left of a dimension", "We cannot drop a measure in front/left or behind/right of another measure"], "a": [2], "ex": "同一個架上，度量必須放在維度後面——維度負責切分、度量負責產生軸，所以無法把度量插到維度前面。維度彼此之間則可以任意調換順序。"}, {"id": "lsiczrhapcs-1380", "vid": "lsiczrhapcs", "part": "AllAboutDATA P10", "ts": 1380, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "What does the field SUM(Profit) shown as a green pill represent?", "zh": "畫面上顯示為綠色的 SUM(Profit) 代表什麼？", "o": ["Continuous measures", "Discrete dimensions", "Discrete measures", "Continuous dimensions"], "a": [0], "ex": "綠色＝連續，SUM() 代表已被彙總的度量，合起來就是「連續度量」。"}, {"id": "VF8HTkcnq7o-170", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 170, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "When should you use data blending to combine data?", "zh": "什麼情況下該用 data blending 來合併資料？", "o": ["When the data has same structure but is for different time periods", "When data is from the same connection", "When the data will be used in multiple worksheets within a workbook", "When using data sources that can not be combined with the default method of using a relationship"], "a": [3], "ex": "Blending 是「最後手段」：當兩份資料無法用預設的 relationship 結合時才用它（跨資料來源、不同連線、粒度不同）。同一個連線內的資料應該用 relationship 或 join；結構相同只是期間不同，那是 union 的情境。"}, {"id": "VF8HTkcnq7o-325", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 325, "d": "D1", "topic": "Extract vs Live", "multi": true, "q": "What is the difference between Live and Extract connections? [select all that apply]", "zh": "Live 與 Extract 連線的差別有哪些？（複選）", "o": ["Live allows real-time data while extracts are kind of batch which needs to be refreshed from time to time to get the updated data", "Live Connection takes more time to load data than Extract Connection", "Live Connection does not slow down operational queries which results in fetching data quickly", "Both the connection takes same time to work with and they do not have any functional difference"], "a": [0, 1], "ex": "Live 直接查來源，看到的是即時資料；Extract 是排程更新的批次快照。也因為 Live 每次都查完整來源，載入比 Extract 慢——所以 C（Live 不會拖慢查詢）與 D（兩者沒差別）都是錯的。"}, {"id": "VF8HTkcnq7o-370", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 370, "d": "D1", "topic": "Extract vs Live", "multi": true, "q": "Why the direct connection to the extract is not recommended? [select all that apply]", "zh": "為什麼不建議直接連到 extract 檔？（複選）", "o": ["The table names will be different", "The extract cannot be refreshed", "The data model and relationships will be lost", "The extract cannot be removed once it is connected directly"], "a": [0, 1, 2], "ex": "直接連 .hyper 檔會失去原本資料來源的中繼資訊：資料表名稱會變成擷取時的內部命名、資料模型與 relationship 不會被保留，而且沒有原始連線也就無法再重新整理。只有 D 是編造的。"}, {"id": "VF8HTkcnq7o-420", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 420, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": true, "q": "Data Source (.tds) contains only the information we need to connect to the data source, including the following: [select all that apply]", "zh": ".tds 資料來源檔包含哪些連線所需的資訊？（複選）", "o": ["Data source type", "Groups, sets, calculated fields, bins", "Connection information specified on the data source page; for example, database server address, port, location of local files, tables", "Default field properties; for example, number formats, aggregation, and sort order"], "a": [0, 1, 2, 3], "ex": "四個全選。.tds 存的是「怎麼連、以及你對這個來源做過的所有中繼設定」：連線型別與位址、自訂的群組／集合／計算欄位／bin、以及欄位的預設屬性（數值格式、預設彙總、排序）。它不含資料本身，那是 .hyper。"}, {"id": "VF8HTkcnq7o-440", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 440, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "How many data sources can we blend in Tableau?", "zh": "Tableau 的一次 blend 可以混合幾個資料來源？", "o": ["Two", "Three", "Four", "Five"], "a": [0], "ex": "Blend 的架構是「一主一次」：一個 primary 資料來源加一個 secondary，兩份。工作表可以再連結更多次要來源，但每一組 blend 關係本身都是兩份資料的配對。"}, {"id": "VF8HTkcnq7o-470", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 470, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "In a Relationship we need to define the following Join type —", "zh": "建立 relationship 時需要指定哪一種 join 型別？", "o": ["Inner Join", "Left Join", "Right Join", "It is not required to define a join type in a relationship"], "a": [3], "ex": "Relationship 不需要你先決定 join 型別——這正是它跟 join 最大的差別。Tableau 會依視圖用到哪些欄位，在查詢時自動選擇適當的結合方式與粒度。要自己指定 join 型別得進到實體層。"}, {"id": "VF8HTkcnq7o-495", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 495, "d": "D4", "topic": "彙總與細分層級", "multi": false, "q": "Which option leads to adjusting the granularity of data in Tableau?", "zh": "哪一個選項會改變資料的細分程度（granularity）？", "o": ["Aggregate", "Group by", "Grouped Fields", "Extract"], "a": [0], "ex": "彙總（aggregate）與細分度是一體兩面：彙總得越多，粒度越粗；視圖裡的維度越細，粒度越細。Group 是把成員合併成新成員、Extract 是儲存方式，都不是在調整粒度的概念。"}, {"id": "VF8HTkcnq7o-555", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 555, "d": "D1", "topic": "Join / Relationship / Blending", "multi": true, "q": "Advantages to using relationships to combine tables: [select all that apply]", "zh": "用 relationship 結合資料表有哪些優點？（複選）", "o": ["Makes it easier to change the key fields used to combine the tables", "Make it easier to analyse data across multiple tables at different levels of granularity", "Makes it easier to combine rows from one table with rows from another", "Tables are only queried when fields from the tables are added to the viz"], "a": [1, 3], "ex": "Relationship 的兩大好處：能在同一個資料來源裡處理不同粒度的表而不會產生重複列，以及「延遲查詢」——只有視圖真的用到某張表的欄位時才去查它，效能較好。C 講的是 union（列的結合），不是 relationship 的賣點。"}, {"id": "VF8HTkcnq7o-590", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 590, "d": "D1", "topic": "資料來源與連線", "multi": false, "q": "Select the correct pathway to edit the data source -", "zh": "編輯資料來源的正確路徑是？", "o": ["Data Menu -> Select a Data source -> Edit Data Source", "Data Menu -> Select a Data source -> Extract Data", "Data Menu -> Select a Data source -> View Data", "Data Menu -> Select a Data source -> Edit Data Source Filters"], "a": [0], "ex": "Data 選單 ▸ 選取該資料來源 ▸ Edit Data Source，會回到資料來源頁去改連線、join 或欄位設定。另外三個路徑都存在，但做的是別的事：建立擷取、檢視資料列、編輯資料來源篩選器。"}, {"id": "VF8HTkcnq7o-640", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 640, "d": "D1", "topic": "資料清理（Pivot / Split / 別名）", "multi": true, "q": "Aliases cannot be created for the following — [select all that apply]", "zh": "哪些欄位「無法」建立別名（alias）？（複選）", "o": ["Discrete dimension", "Continuous dimension", "Measures", "Dates"], "a": [1, 2, 3], "ex": "別名是替「離散維度的成員」換一個顯示名稱，所以只有離散維度可以。連續欄位、度量、日期都是連續值，沒有可命名的成員清單，因此都不能設別名。"}, {"id": "VF8HTkcnq7o-690", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 690, "d": "D2", "topic": "地圖", "multi": false, "q": "While assigning geographic role to a field, Tableau adds two fields to the Measures area of the Data pane:", "zh": "指派地理角色給欄位時，Tableau 會在度量區自動新增哪兩個欄位？", "o": ["Latitude and Longitude", "Meridian and Longitude", "Meridian and Latitude", "Only Meridian"], "a": [0], "ex": "Tableau 會產生 Latitude (generated) 與 Longitude (generated) 兩個度量，用來把地理成員畫到地圖上。Meridian（子午線）不是 Tableau 產生的欄位，是干擾選項。"}, {"id": "VF8HTkcnq7o-735", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 735, "d": "D1", "topic": "資料型別與欄位角色", "multi": false, "q": "Choose the correct path to change the data type for a field in the view -", "zh": "在視圖中變更欄位資料型別的正確路徑是？", "o": ["Right click the field in the Data pane -> Change Data Type -> Data Types -> Choose the appropriate data type", "Right click the field in the Data pane -> Change Data Type -> Choose the appropriate data type", "Right click the field in the Data pane -> Data Types -> Choose the appropriate data type", "Right click the field in the Data pane -> Choose the appropriate data type"], "a": [1], "ex": "資料窗格中的欄位按右鍵 ▸ Change Data Type ▸ 直接選型別，兩層就到。其他選項多插了一層不存在的 Data Types 子選單，或少了 Change Data Type 這一層。"}, {"id": "VF8HTkcnq7o-775", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 775, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": false, "q": "Choose the correct path to add a default comment for a field-", "zh": "替欄位加上預設註解（comment）的正確路徑是？", "o": ["Right click a field in the Data pane-> Default Properties-> Comment", "Right click a field in the Data pane-> Aggregation -> Default Properties-> Comment", "Right click a field in the Data pane -> Comment", "Right click a field in the Data pane-> Describe-> Comment"], "a": [0], "ex": "Comment 屬於欄位的 Default Properties，所以路徑是右鍵 ▸ Default Properties ▸ Comment。加上註解後，滑鼠停在欄位上就會顯示說明，是團隊共用活頁簿時很實用的中繼資料。"}, {"id": "VF8HTkcnq7o-805", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 805, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "A union of two tables usually results in an ____.", "zh": "兩張表做 union 之後，通常會造成什麼結果？", "o": ["Increase in the number of columns", "Increase in the number of rows", "Decrease in the number of columns", "Decrease in the number of rows"], "a": [1], "ex": "Union 是把結構相同的表「往下疊」，所以列數增加、欄位數不變。欄位變多的是 join。"}, {"id": "VF8HTkcnq7o-845", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 845, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "When using a Blend, what is the color of a tick-mark on the primary and secondary data sources respectively?", "zh": "使用 blend 時，主要與次要資料來源上的勾號分別是什麼顏色？", "o": ["Red, Blue", "Orange, Blue", "Blue, Red", "Blue, Orange"], "a": [3], "ex": "主要資料來源顯示藍色勾號，次要資料來源顯示橘色勾號，橘色同時代表兩者之間的連結欄位。這個顏色慣例是判讀 blend 狀態的直接線索。"}, {"id": "VF8HTkcnq7o-875", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 875, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": true, "q": "Valid use case of managing metadata? [Select all Apply]", "zh": "管理中繼資料的有效用途有哪些？（複選）", "o": ["To view all hidden fields", "To see the fieldname in original data source", "To see the table a field belongs to", "To clean & automatically fix the issue"], "a": [0, 1, 2], "ex": "中繼資料管理（資料來源頁的 Manage metadata 檢視）讓你看到被隱藏的欄位、欄位在來源中的原始名稱、以及欄位屬於哪張表。它是「檢視與整理定義」，不會自動清理或修正資料問題——那要靠 Tableau Prep。"}, {"id": "VF8HTkcnq7o-905", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 905, "d": "D1", "topic": "資料型別與欄位角色", "multi": false, "q": "When user connect to tableau, the data fields in their data set are automatically assigned a ____ and ____ ?", "zh": "連接資料後，Tableau 會自動指派給每個欄位哪兩樣東西？", "o": ["TYPE & ROLE", "DataType & Value", "Role & Type", "Dimension & Measures"], "a": [0], "ex": "順序是先 type 後 role：Tableau 先判斷資料型別（字串／數值／日期／布林），再依型別指派角色（維度或度量）。A 與 C 內容相同但順序相反，考的就是這個先後。"}, {"id": "VF8HTkcnq7o-960", "vid": "VF8HTkcnq7o", "part": "AllAboutDATA P1", "ts": 960, "d": "D1", "topic": "Extract vs Live", "multi": true, "q": "What are options available while creating extract? [Select all apply]", "zh": "建立 extract 時有哪些可用的選項？（複選）", "o": ["Filters", "Aggregation", "Hide Unused Fields", "History"], "a": [0, 1, 2, 3], "ex": "四個全選。Extract Data 對話框可以：加篩選器只取部分資料、依可見維度彙總、隱藏未使用欄位以縮小檔案，以及設定累加更新（增量更新的歷程）。這些都是控制擷取檔大小與效能的手段。"}, {"id": "bF4sNorB0Uo-7", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 7, "d": "D2", "topic": "Marks Card", "multi": false, "q": "In which section of the Marks card can you adjust the transparency of colors?", "zh": "Marks card 的哪一個區塊可以調整顏色透明度？", "o": ["Color", "Size", "Label", "Detail"], "a": [0], "ex": "只有 Color 下拉裡有 Opacity（不透明度）滑桿，可從 0–100% 調整。Size 只能調標記大小、Label 只能設標籤顯示與重疊、Detail 只影響標記的細分層級，都沒有透明度設定。"}, {"id": "bF4sNorB0Uo-141", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 141, "d": "D4", "topic": "彙總與細分層級", "multi": false, "q": "Which aggregation functions can operate on both numeric and non-numeric fields?", "zh": "哪些聚合函數可同時用於數值與非數值欄位？", "o": ["COUNT, AVG", "SUM, MEDIAN", "COUNT, COUNTD", "CONCAT"], "a": [2], "ex": "COUNT 與 COUNTD（Count Distinct）對數值與字串都可用。AVG、SUM、MEDIAN 傳入字串會直接報錯。CONCAT 在 Tableau 中根本不存在（那是 Excel 的函數），純粹是干擾選項。"}, {"id": "bF4sNorB0Uo-285", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 285, "d": "D2", "topic": "Bins 與直方圖", "multi": false, "q": "True or False: A histogram in Tableau automatically creates bins based on the underlying data distribution.", "zh": "是非題：Tableau 建立直方圖時會依資料分布自動產生 bin。", "o": ["true", "false"], "a": [0], "ex": "選一個 measure 後從 Show Me 點 Histogram，Tableau 會自動在資料窗格產生一個「<欄位名> (bin)」欄位。之後可右鍵 Edit 調整 bin size，或改成參數驅動。"}, {"id": "bF4sNorB0Uo-355", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 355, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "To display data over time, which chart type is most effective in Tableau?", "zh": "要呈現隨時間變化的資料，哪種圖表最有效？", "o": ["Line chart", "Bar chart", "Pie chart", "Scatter plot"], "a": [0], "ex": "Tableau 官方文件對折線圖的說明是「useful when you want to see trends over time」。看到 over time / trend 就選折線圖。Bar chart 適合類別比較、Pie chart 適合部分與整體、Scatter plot 適合看兩個度量的相關性。"}, {"id": "bF4sNorB0Uo-458", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 458, "d": "D2", "topic": "Sets / Hierarchies", "multi": false, "q": "_____ is essential for drilling down into hierarchical levels of data in Tableau.", "zh": "＿＿＿ 是在 Tableau 中往下鑽取階層資料的關鍵。", "o": ["Tree map", "Pie chart", "Gantt chart", "Packed bubble chart"], "a": [0], "ex": "Tree map 需要「一個以上 dimension ＋ 一到兩個 measure」。把 Category 與 Sub-Category 一起放進去時，會用巢狀方塊呈現兩層階層：一眼看出上層占比，再往下看細項。其餘三者都無法乾淨表達階層。"}, {"id": "bF4sNorB0Uo-650", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 650, "d": "D2", "topic": "Marks Card", "multi": false, "q": "Which Tableau feature allows the visualization of data changes over time through animation?", "zh": "哪個 Tableau 功能可用動畫呈現資料隨時間的變化？", "o": ["Pages shelf", "Filters shelf", "Stories", "Analytics pane"], "a": [0], "ex": "把日期欄位拖到 Pages shelf，右側會出現播放控制器，可逐年／逐月前進或自動播放，形成動畫。Filters 只是篩選、Stories 是把多張圖組成敘事頁、Analytics pane 提供趨勢線／預測／叢集等分析功能。"}, {"id": "bF4sNorB0Uo-803", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 803, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "What is primarily used to connect Tableau to different data sources simultaneously?", "zh": "要同時連接不同資料來源，主要使用什麼？", "o": ["Data blending", "Data extraction", "Live connection", "Server connection"], "a": [0], "ex": "Data blending 的官方定義就是「a method for combining data from multiple sources」——在同一張工作表混合兩個不同資料來源，並以連結欄位對應。Join / Relationship 通常用於同一個資料來源內；Extract 與 Live 是連線模式。"}, {"id": "bF4sNorB0Uo-915", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 915, "d": "D3", "topic": "匯出與列印", "multi": false, "q": "True or False: Tableau Desktop cannot export visualizations directly to PDF format.", "zh": "是非題：Tableau Desktop 無法直接把視覺化匯出成 PDF。", "o": ["true", "false"], "a": [1], "ex": "陷阱題。Worksheet ▸ Export ▸ Image 只提供 PNG／BMP／EMF／JPEG，看起來像不能出 PDF；但 File ▸ Print（列印對話框左下角的 PDF）就能直接存成 PDF。所以「不能匯出 PDF」這個敘述是錯的 → false。"}, {"id": "bF4sNorB0Uo-1000", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 1000, "d": "D3", "topic": "儀表板動作 Actions", "multi": true, "q": "What allows the dynamic control of multiple visualization elements simultaneously in Tableau? (select multiple)", "zh": "在 Tableau 中，什麼能同時動態控制多個視覺化元件？（複選）", "o": ["Parameters", "Filters", "Calculated fields", "Actions", "Highlight actions"], "a": [0, 1, 2, 3, 4], "ex": "五個全選。典型組合是：Parameter（例如年份）→ Calculated field 判斷 → 當成 Filter 並 Apply to Worksheets 套用到多張表；Actions（含 Highlight actions）則能在儀表板中跨工作表連動高亮或篩選。"}, {"id": "bF4sNorB0Uo-1113", "vid": "bF4sNorB0Uo", "part": "Part 1", "ts": 1113, "d": "D4", "topic": "效能最佳化", "multi": false, "q": "Which component is not typically used to improve dashboard performance in Tableau?", "zh": "哪一個元件通常「不是」用來改善儀表板效能的？", "o": ["Data extracts", "Live connections", "Aggregated extracts", "Filters", "Calculated fields"], "a": [1], "ex": "注意題目問的是「不是」。Extract 把資料存在本地、Aggregated extract 再進一步縮小資料量、Filters 限制資料筆數、Calculated field 用得好（例如以 CASE 取代多層巢狀 IF）也能優化。只有 Live connection 每次操作都即時查詢資料庫，反而拖慢效能。"}, {"id": "dlLVylmVvXo-244", "vid": "dlLVylmVvXo", "part": "Part 10", "ts": 244, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "What is the main benefit of using a Gantt chart in Tableau?", "zh": "在 Tableau 使用甘特圖的主要好處是什麼？", "o": ["Tracking time durations", "Comparing categories", "Visualizing part-to-whole relationships", "Highlighting variations"], "a": [0], "ex": "甘特圖用長條的「長度」表示一段持續時間，並沿時間軸排列，最適合追蹤事件的期間與進度（例如出貨天數、專案排程）。它需要一個日期維度加上表示持續時間的度量。"}, {"id": "dlLVylmVvXo-465", "vid": "dlLVylmVvXo", "part": "Part 10", "ts": 465, "d": "D2", "topic": "地圖", "multi": true, "q": "Which Tableau tool is used for geographic analysis of data? (select multiple)", "zh": "哪些 Tableau 工具可用於資料的地理分析？（複選）", "o": ["Symbol maps", "Heat maps", "Line charts", "Pie charts", "Maps"], "a": [0, 4], "ex": "Show Me 中與地理相關的是 Symbol map（在地圖上以標記大小／顏色呈現）與 Map（填色地圖 filled map）。Heat map 在 Tableau 指的是用顏色深淺呈現的交叉表，不是地理工具。"}, {"id": "dlLVylmVvXo-518", "vid": "dlLVylmVvXo", "part": "Part 10", "ts": 518, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "True or False: Tableau Desktop supports scripting with JavaScript.", "zh": "是非題：Tableau Desktop 支援用 JavaScript 撰寫腳本。", "o": ["true", "false"], "a": [1], "ex": "false。Tableau Desktop 的外部腳本整合是 Python（TabPy）與 R（Rserve）。JavaScript API 是給網頁開發者用來嵌入並控制已發佈視圖的，不是 Desktop 內的腳本語言。"}, {"id": "dlLVylmVvXo-624", "vid": "dlLVylmVvXo", "part": "Part 10", "ts": 624, "d": "D1", "topic": "Extract vs Live", "multi": false, "q": "Which data connection type in Tableau provides the most up-to-date information?", "zh": "哪一種資料連線類型能提供最即時的資訊？", "o": ["Live connection", "Data extract", "Published data source", "Cloud data"], "a": [0], "ex": "Live connection 每次互動都直接向來源查詢，看到的永遠是當下最新的資料。Extract 是排程更新的快照；Published data source 與 Cloud data 講的是資料放在哪裡，不決定即時性。"}, {"id": "dlLVylmVvXo-711", "vid": "dlLVylmVvXo", "part": "Part 10", "ts": 711, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "True or False: A Continuous measure can be identified by a blue pill", "zh": "是非題：連續的度量可以用藍色欄位（pill）來辨識。", "o": ["true", "false"], "a": [1], "ex": "false。連續一律是「綠色」欄位，藍色代表離散。度量預設是連續（綠色），但也可以轉成離散變藍色——所以用顏色判斷的是離散／連續，不是維度／度量。"}, {"id": "yvlR98Sxc-w-392", "vid": "yvlR98Sxc-w", "part": "Part 11", "ts": 392, "d": "D2", "topic": "計算欄位", "multi": false, "q": "Which function do you use to convert a numeric field into a string field in Tableau?", "zh": "在 Tableau 中要把數值欄位轉成字串欄位，用哪個函數？", "o": ["STRING()", "STR()", "VARCHAR()", "CAST()"], "a": [1], "ex": "STR() 是 Tableau 的型別轉換函數（同族還有 INT()、FLOAT()、DATE()、BOOL()）。STRING()、VARCHAR()、CAST() 是 SQL 的寫法，Tableau 計算欄位不支援。"}, {"id": "yvlR98Sxc-w-530", "vid": "yvlR98Sxc-w", "part": "Part 11", "ts": 530, "d": "D3", "topic": "發佈到 Server / Cloud", "multi": false, "q": "What is the function of the \"Server\" menu in Tableau Desktop?", "zh": "Tableau Desktop 的「Server」選單有什麼功能？", "o": ["To configure data connections", "To manage publishing settings", "To administer server settings", "To access server logs"], "a": [1], "ex": "Desktop 的 Server 選單用來登入 Server／Cloud，以及發佈活頁簿或資料來源、建立擷取更新排程等發佈相關設定。真正的伺服器管理與日誌要在 Server 的網頁管理介面或 tsm 指令。"}, {"id": "yvlR98Sxc-w-670", "vid": "yvlR98Sxc-w", "part": "Part 11", "ts": 670, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "True or False: In Tableau, you can convert a discrete date part into a continuous date part.", "zh": "是非題：在 Tableau 中，可以把離散的日期部分轉成連續的日期。", "o": ["true", "false"], "a": [0], "ex": "true。在欄位（pill）上按右鍵即可在 Discrete 與 Continuous 之間切換，也可以在下拉選單中選 Year／Quarter 的離散版本或「綠色」的連續日期版本，兩者可自由互換。"}, {"id": "yvlR98Sxc-w-5", "vid": "yvlR98Sxc-w", "part": "Part 11", "ts": 5, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": true, "q": "How can you look at the underlying data in your workbook or visualization? (select multiple)", "zh": "要查看活頁簿／視覺化背後的基礎資料（underlying data），可以怎麼做？（複選）", "o": ["Use the Download Data option in the Data pane", "Use the View Data option in the Data pane", "Use the View Data option by right-clicking a mark", "Use the Download Data option by right-clicking a mark", "Use the View Data option in the Analysis toolbar menu"], "a": [1, 2, 4], "ex": "檢視基礎資料的入口有三個：資料窗格右上角的 View Data 圖示、在標記上按右鍵選 View Data、以及功能表 Analysis ▸ View Data。Tableau Desktop 沒有「Download Data」這個選項（那是 Server／Cloud 網頁版才有的下載功能）。", "src": "narration"}, {"id": "1y2xUj7SzDQ-275", "vid": "1y2xUj7SzDQ", "part": "Part 12", "ts": 275, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "Which of the following can be used to overlay 2 independent axes on the same pane?", "zh": "下列哪一個可以把兩個獨立的軸疊在同一個窗格上？", "o": ["Dual axis", "Double axis", "Dual pane", "Polynomial chart"], "a": [0], "ex": "Dual axis（雙軸）把第二個度量以獨立的軸疊在同一個窗格，右鍵該度量選 Dual Axis 即可；若要兩軸刻度一致再選 Synchronize Axis。其餘三個名詞在 Tableau 中不存在。"}, {"id": "1y2xUj7SzDQ-412", "vid": "1y2xUj7SzDQ", "part": "Part 12", "ts": 412, "d": "D3", "topic": "儀表板 Dashboards", "multi": false, "q": "True or False: In dashboards, only one sheet can be displayed at a time.", "zh": "是非題：在儀表板中一次只能顯示一張工作表。", "o": ["true", "false"], "a": [1], "ex": "false。儀表板的用途正是把多張工作表同時排在一起，再加上篩選器、圖例、文字、圖片、網頁等物件，並讓它們透過 action 互相連動。"}, {"id": "1y2xUj7SzDQ-660", "vid": "1y2xUj7SzDQ", "part": "Part 12", "ts": 660, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "What type of visualization is best suited for analyzing the distribution of data within individual categories?", "zh": "要分析各個類別「內部」的資料分布，哪一種視覺化最適合？", "o": ["Box-and-whisker plot", "Line chart", "Pie chart", "Scatter plot"], "a": [0], "ex": "盒鬚圖以中位數、四分位數、鬚線與離群值呈現一組資料的分布形狀，把它按類別並排就能比較各類別內部的分散程度。折線圖看趨勢、圓餅圖看占比、散佈圖看兩個度量的關係。"}, {"id": "1y2xUj7SzDQ-858", "vid": "1y2xUj7SzDQ", "part": "Part 12", "ts": 858, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "True or False: Dragging a discrete dimension to Color on the Marks card will result in a gradient color palette based on the underlying values", "zh": "是非題：把離散維度拖到 Marks card 的 Color 上，會產生依數值變化的漸層色盤。", "o": ["true", "false"], "a": [1], "ex": "false。離散（藍色）欄位得到的是「類別色盤」——每個成員一個不同顏色。漸層（sequential／diverging）色盤只有把連續（綠色）欄位放到 Color 時才會出現。"}, {"id": "aUds-njz53o-153", "vid": "aUds-njz53o", "part": "Part 13", "ts": 153, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "What does a blue pill always represent?", "zh": "藍色的欄位（pill）一定代表什麼？", "o": ["A dimension", "A measure value", "A discrete field", "A continuous field"], "a": [2], "ex": "顏色代表的是「離散 vs 連續」，不是「維度 vs 度量」。藍色＝離散（產生標題 headers），綠色＝連續（產生軸 axis）。維度通常是藍色但也可以是連續（例如連續日期），度量也可以被轉成離散，所以「藍色＝維度」是錯的。"}, {"id": "aUds-njz53o-321", "vid": "aUds-njz53o", "part": "Part 13", "ts": 321, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What can be used to take the difference between 2 measures?", "zh": "要計算兩個度量之間的差，可以用什麼？", "o": ["A Calculated Field", "The Analytics Pane", "Parameter", "A Global Variable"], "a": [0], "ex": "計算欄位（例如 [Sales] - [Profit]）是做欄位間算術的標準方式。Analytics 窗格只加參考線／趨勢線等分析物件；Parameter 是使用者輸入的單一值；Tableau 沒有 global variable 這個東西。"}, {"id": "aUds-njz53o-458", "vid": "aUds-njz53o", "part": "Part 13", "ts": 458, "d": "D3", "topic": "儀表板動作 Actions", "multi": true, "q": "Which type of dashboard actions are generally available? (select multiple)", "zh": "儀表板動作（dashboard actions）一般有哪些類型？（複選）", "o": ["Refresh Extract", "Highlight", "Tooltip Hover", "Filter", "Change Parameter"], "a": [1, 3, 4], "ex": "Dashboard ▸ Actions 中可建立的類型是 Filter、Highlight、Go to URL、Go to Sheet、Change Parameter、Change Set Values。Refresh Extract 是資料更新作業、Tooltip Hover 不是動作類型（hover 只是動作的觸發方式之一）。"}, {"id": "aUds-njz53o-565", "vid": "aUds-njz53o", "part": "Part 13", "ts": 565, "d": "D3", "topic": "儀表板 Dashboards", "multi": true, "q": "Which of the following are valid dashboard objects? (select multiple)", "zh": "下列哪些是有效的儀表板物件？（複選）", "o": ["Vertical", "Download", "Blank", "Parameter", "Menu Bar"], "a": [0, 1, 2], "ex": "儀表板 Objects 區塊包含：Horizontal、Vertical、Text、Image、Web Page、Blank、Navigation、Download、Extension、Ask Data。Parameter 是以「控制項」形式從工作表加入，不算物件；Menu Bar 不存在。"}, {"id": "ITywjhHzhNk-398", "vid": "ITywjhHzhNk", "part": "Part 14", "ts": 398, "d": "D2", "topic": "表計算 Table Calculations", "multi": false, "q": "Which of the following can best be used to compute percent of total?", "zh": "要計算「占總計的百分比」，下列哪一個最適合？", "o": ["Reference line", "LOD expression", "Quick table calculation", "Ad-hoc calculation"], "a": [2], "ex": "在度量上按右鍵 ▸ Quick Table Calculation ▸ Percent of Total，一步就完成。LOD 雖然也能算出同樣結果，但要自己寫運算式、費時且複雜；Reference line 只是畫線；Ad-hoc calculation 不是 Tableau 的正式名詞。"}, {"id": "ITywjhHzhNk-521", "vid": "ITywjhHzhNk", "part": "Part 14", "ts": 521, "d": "D4", "topic": "彙總與細分層級", "multi": false, "q": "What is the default aggregation applied to a measure when it is first dragged onto a Tableau view?", "zh": "把度量第一次拖進視圖時，預設會套用哪一種彙總？", "o": ["AVG", "COUNT", "SUM", "CONTINUOUS"], "a": [2], "ex": "度量拖進視圖預設彙總為 SUM（欄位會顯示成 SUM(Sales)）。可以在欄位右鍵 ▸ Measure 改成 Average、Median 等。CONTINUOUS 是欄位型態，不是彙總方式。"}, {"id": "ITywjhHzhNk-664", "vid": "ITywjhHzhNk", "part": "Part 14", "ts": 664, "d": "D3", "topic": "權限與訂閱", "multi": false, "q": "Which feature in Tableau provides the ability to automate report distribution via Emails?", "zh": "哪個功能可以自動以 email 寄送報表？", "o": ["Job alerts", "Subscriptions", "Email scheduling", "Filter Actions"], "a": [1], "ex": "Subscription（訂閱）讓使用者依排程自動收到視圖或儀表板的快照 email。Job alert 是管理員收到的工作失敗通知；Email scheduling 不是 Tableau 的功能名稱。"}, {"id": "ITywjhHzhNk-530", "vid": "ITywjhHzhNk", "part": "Part 14", "ts": 530, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "In which scenario is a packed bubble chart most effectively used?", "zh": "打包泡泡圖（packed bubble chart）在哪種情境最有效？", "o": ["Comparing parts of a whole", "Displaying trends over time", "Illustrating volume differences", "Analyzing geographical data"], "a": [2], "ex": "泡泡圖用「大小」表示度量值，最適合一眼比較各類別的量體差異。它不適合表達部分與整體（那是圓餅／堆疊長條）、也不呈現時間趨勢或地理位置。建立它需要一個維度加一個以上的度量。", "src": "narration"}, {"id": "9TUyKYiHgv4-267", "vid": "9TUyKYiHgv4", "part": "Part 15", "ts": 267, "d": "D2", "topic": "Sets / Hierarchies", "multi": false, "q": "What role do hierarchies play in Tableau?", "zh": "階層（hierarchy）在 Tableau 中扮演什麼角色？", "o": ["Organizing data into levels", "Aggregating data for security", "Filtering data across dashboards", "Simplifying data entry"], "a": [0], "ex": "階層把相關的維度依層級組織起來（例如 Country ▸ State ▸ City，或 Category ▸ Sub-Category），在視圖上就會出現 +／− 按鈕，可以逐層展開往下鑽取。"}, {"id": "9TUyKYiHgv4-470", "vid": "9TUyKYiHgv4", "part": "Part 15", "ts": 470, "d": "D3", "topic": "發佈到 Server / Cloud", "multi": false, "q": "What is the benefit of embedding a Tableau dashboard into a web page?", "zh": "把 Tableau 儀表板嵌入網頁的好處是什麼？", "o": ["Increases data security", "Enhances user interaction", "Simplifies data management", "Expands data accessibility"], "a": [3], "ex": "嵌入網頁的重點是「讓更多人更容易看到」——使用者不必登入 Tableau 介面，直接在既有的入口網站或內部網站就能看到儀表板，擴大了資料的觸及範圍。它並不會提升安全性。"}, {"id": "9TUyKYiHgv4-568", "vid": "9TUyKYiHgv4", "part": "Part 15", "ts": 568, "d": "D3", "topic": "發佈到 Server / Cloud", "multi": false, "q": "True or False: Tableau's version control capabilities allow for the tracking and restoring of previous workbook versions.", "zh": "是非題：Tableau 的版本控制功能可以追蹤並還原先前的活頁簿版本。", "o": ["true", "false"], "a": [0], "ex": "true。發佈到 Tableau Server／Cloud 的活頁簿會保留修訂歷程（Revision History），可以檢視、下載或還原到先前版本（保留幾版由管理員設定）。"}, {"id": "9TUyKYiHgv4-773", "vid": "9TUyKYiHgv4", "part": "Part 15", "ts": 773, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "What type of chart is most appropriate for displaying the relationship between two quantitative variables?", "zh": "要呈現兩個量化變數之間的關係，哪種圖表最合適？", "o": ["Scatter plot", "Line chart", "Bar chart", "Pie chart"], "a": [0], "ex": "散佈圖把兩個度量分別對應到 X 與 Y 軸，每個標記代表一筆資料，是檢視兩個量化變數關係（相關性、群聚、離群值）的標準圖表。"}, {"id": "-UVWgcG8_H0-209", "vid": "-UVWgcG8_H0", "part": "Part 16", "ts": 209, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "In Tableau, what is the result of blending multiple data sources?", "zh": "在 Tableau 中，混合（blend）多個資料來源的結果是什麼？", "o": ["A new single data source is created", "Related data from multiple sources is displayed together", "Data is summarized into a single table", "Data integrity is automatically checked"], "a": [1], "ex": "Blending 不會產生新的資料來源，也不會把資料合併成一張表。它是在「視圖層級」把主要資料來源與次要資料來源以連結欄位對應後，各自查詢再把結果一起呈現。"}, {"id": "-UVWgcG8_H0-357", "vid": "-UVWgcG8_H0", "part": "Part 16", "ts": 357, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "True or False: You can join tables in Tableau using custom SQL queries.", "zh": "是非題：在 Tableau 中可以用自訂 SQL 查詢來結合資料表。", "o": ["true", "false"], "a": [0], "ex": "true。在資料來源畫面的左側可拖入 New Custom SQL，直接撰寫 SQL（含 JOIN），Tableau 會把它當成一張虛擬資料表使用。"}, {"id": "-UVWgcG8_H0-516", "vid": "-UVWgcG8_H0", "part": "Part 16", "ts": 516, "d": "D2", "topic": "LOD 運算式", "multi": false, "q": "True or False: Tableau's LOD expressions cannot aggregate data beyond the visualization level.", "zh": "是非題：Tableau 的 LOD 運算式無法在超出視圖層級的細分度上彙總資料。", "o": ["true", "false"], "a": [1], "ex": "false。LOD 的存在意義正是「跳脫視圖層級」：FIXED 完全忽略視圖細分度、INCLUDE 加入更細的維度、EXCLUDE 移除視圖中的維度，三者都能在與視圖不同的層級上彙總。"}, {"id": "-UVWgcG8_H0-520", "vid": "-UVWgcG8_H0", "part": "Part 16", "ts": 520, "d": "D3", "topic": "Story 故事", "multi": false, "q": "Which Tableau capability is used to sequence a narrative of visualizations for presentation purposes?", "zh": "哪個 Tableau 功能可以把多個視覺化排成有順序的敘事，用於簡報？", "o": ["Dashboards", "Stories", "Workbooks", "Reports"], "a": [1], "ex": "官方定義：story 是「a sequence of visualizations that work together to convey information」。每個 story point 可以是工作表或儀表板，串起來就是一段有順序的資料敘事。Dashboard 是同時並列、Workbook 是整份檔案、Reports 不是 Tableau 的物件名稱。", "src": "narration"}, {"id": "BRUG1D3Q0LA-214", "vid": "BRUG1D3Q0LA", "part": "Part 17", "ts": 214, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "How does the 'Union' feature in Tableau help in data preparation?", "zh": "Tableau 的「Union」功能在資料準備上有什麼作用？", "o": ["It merges rows from multiple tables", "It merges columns from multiple tables", "It blends data from multiple sources", "It only displays rows that coincide between multiple tables"], "a": [0], "ex": "Union 是「往下疊」——把結構相同的多張表（例如各月份的工作表或多個 CSV）的「列」接在一起。Join 才是把「欄」接寬；Blending 是跨資料來源；只留相符列的是 inner join。"}, {"id": "BRUG1D3Q0LA-478", "vid": "BRUG1D3Q0LA", "part": "Part 17", "ts": 478, "d": "D3", "topic": "儀表板 Dashboards", "multi": false, "q": "How can \"Viz in Tooltip\" feature enhance a Tableau dashboard?", "zh": "「Viz in Tooltip」如何提升儀表板的效果？", "o": ["By providing additional context on hover", "By speeding up dashboard performance", "By reducing the need for extra sheets", "By launching a wizard to help create tooltips"], "a": [0], "ex": "滑鼠停在標記上時，提示框直接顯示一張以該標記為條件的迷你圖表，讓使用者不必離開目前視圖就取得更多脈絡。它反而會增加查詢負擔，不會加快效能。"}, {"id": "BRUG1D3Q0LA-727", "vid": "BRUG1D3Q0LA", "part": "Part 17", "ts": 727, "d": "D2", "topic": "篩選器 Filters", "multi": false, "q": "What does enabling \"Highlighting\" in Tableau do?", "zh": "在 Tableau 中啟用「Highlighting（強調）」會做什麼？", "o": ["It colors data points to emphasize differences", "It filters out unselected data", "It creates a focus on relevant marks", "It modifies data transparency"], "a": [2], "ex": "Highlight 把相關的標記保持原本顏色、其他標記變淡，讓注意力集中在相關資料上——但資料仍然全部留在視圖裡。這與 Filter（真的把資料移除）是關鍵差別。"}, {"id": "BRUG1D3Q0LA-929", "vid": "BRUG1D3Q0LA", "part": "Part 17", "ts": 929, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "This icon best describes which component in the Data Pane? (圖示為一個由上層方塊往下分支到兩個方塊的樹狀結構圖示)", "zh": "影片畫面上的圖示（樹狀分支結構）代表資料窗格中的哪個元件？", "o": ["Left Join", "Sets", "Location", "Hierarchy"], "a": [3], "ex": "樹狀分支的圖示代表 Hierarchy（階層）。在資料窗格中，Set 是兩個交疊的圓、Group 是迴紋針、地理欄位是地球儀，階層則是這個由上往下分支的樹狀圖示。"}, {"id": "GjrnbInnBaI-252", "vid": "GjrnbInnBaI", "part": "Part 18", "ts": 252, "d": "D2", "topic": "Bins 與直方圖", "multi": false, "q": "What is the primary function of 'Bins' in Tableau?", "zh": "Tableau 中「Bins」的主要功能是什麼？", "o": ["To group data into equal intervals", "To filter out unwanted data", "To organize data hierarchically", "To classify qualitative data"], "a": [0], "ex": "Bin 把連續的數值度量切成等距的區間（例如每 10 元一組），是製作直方圖的基礎。它處理的是量化資料，不是質化／類別資料。"}, {"id": "GjrnbInnBaI-450", "vid": "GjrnbInnBaI", "part": "Part 18", "ts": 450, "d": "D1", "topic": "資料來源與連線", "multi": false, "q": "What role does 'Custom SQL' play in Tableau?", "zh": "「Custom SQL」在 Tableau 中扮演什麼角色？", "o": ["It allows users to write their own SQL queries for data sources", "It automates data transformations", "It provides templates for common queries", "It enhances data security"], "a": [0], "ex": "Custom SQL 讓你直接撰寫 SQL 來定義資料來源，適合需要複雜 join、子查詢或資料庫端運算的情境。缺點是可能影響效能，且無法使用某些最佳化。"}, {"id": "GjrnbInnBaI-553", "vid": "GjrnbInnBaI", "part": "Part 18", "ts": 553, "d": "D3", "topic": "權限與訂閱", "multi": false, "q": "What advantage does 'Subscription' provide in Tableau Server?", "zh": "Tableau Server 的「Subscription（訂閱）」有什麼好處？", "o": ["Automated report delivery", "Real-time data update", "Enhanced security features", "Automated License Renewals"], "a": [0], "ex": "訂閱讓使用者依排程自動收到視圖或儀表板的快照 email（PNG／PDF），不必主動登入查看。它不會讓資料變即時，也與安全性或授權無關。"}, {"id": "GjrnbInnBaI-551", "vid": "GjrnbInnBaI", "part": "Part 18", "ts": 551, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "Which Tableau Desktop functionality allows you to recover back to your last saved changes?", "zh": "Tableau Desktop 的哪個功能可以還原到上次儲存的狀態？", "o": ["Roll back", "Version history", "Revert", "Restore"], "a": [2], "ex": "File ▸ Revert to Saved 會把活頁簿還原成上次存檔的樣子，丟棄之後所有未儲存的變更。Roll back 是資料庫術語；Server 上的版本功能叫 Revision History，不是 Version history，而且那是 Server 端不是 Desktop。", "src": "narration"}, {"id": "ILR4SFuWdsg-137", "vid": "ILR4SFuWdsg", "part": "Part 19", "ts": 137, "d": "D2", "topic": "表計算 Table Calculations", "multi": false, "q": "True or False: Running Total is a Quick Table Calculation", "zh": "是非題：Running Total（累計總和）屬於快速表計算。", "o": ["True", "False"], "a": [0], "ex": "true。在度量欄位上按右鍵 ▸ Quick Table Calculation 就能看到 Running Total、Difference、Percent Difference、Percent of Total、Rank、Percentile、Moving Average、YTD Total 等預設選項。"}, {"id": "ILR4SFuWdsg-415", "vid": "ILR4SFuWdsg", "part": "Part 19", "ts": 415, "d": "D4", "topic": "檔案格式與產品線", "multi": false, "q": "Which file format is used to save Tableau Workbook files?", "zh": "Tableau 活頁簿檔案用哪一種副檔名儲存？", "o": [".tdsx", ".twbx", ".hyper", ".tableau"], "a": [1], "ex": ".twbx 是封裝活頁簿（Packaged Workbook），把活頁簿與資料一起打包，可直接寄給別人用 Tableau Reader 開啟。.twb 只有活頁簿本身、.tdsx 是封裝資料來源、.hyper 是擷取檔。"}, {"id": "ILR4SFuWdsg-599", "vid": "ILR4SFuWdsg", "part": "Part 19", "ts": 599, "d": "D1", "topic": "中繼資料與資料來源篩選", "multi": false, "q": "Which feature in Tableau enables you to repoint references to a column", "zh": "哪個功能可以讓你把欄位的參照重新指向另一個欄位？", "o": ["Swap Field", "Refactor", "Replace References", "Replace() function"], "a": [2], "ex": "Replace References 用於換資料來源或欄位改名後：在欄位上按右鍵選 Replace References，所有用到舊欄位的工作表、計算與篩選都會一次改指向新欄位，不必逐一修正。"}, {"id": "ILR4SFuWdsg-140", "vid": "ILR4SFuWdsg", "part": "Part 19", "ts": 140, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "Which type of join displays only records that have matching values in both tables?", "zh": "哪一種 join 只會顯示兩張表都有相符值的記錄？", "o": ["Left join", "Right join", "Inner join", "Outer join"], "a": [2], "ex": "Inner join 只保留兩邊都找得到對應的列，任一邊沒有相符就整列捨棄。Left／Right join 會完整保留其中一邊；Full outer join 兩邊都保留並以 null 補齊。", "src": "narration"}, {"id": "OXphRDLlqag-236", "vid": "OXphRDLlqag", "part": "Part 2", "ts": 236, "d": "D2", "topic": "LOD 運算式", "multi": false, "q": "What is the primary purpose of using Level of Detail (LOD) expressions in Tableau?", "zh": "在 Tableau 使用 LOD（Level of Detail）運算式的主要目的是什麼？", "o": ["To increase data granularity", "To enhance visualization speed", "To bypass the normal aggregation level", "To secure data"], "a": [2], "ex": "LOD 運算式（FIXED／INCLUDE／EXCLUDE）讓計算跳脫視圖預設的彙總層級。例如視圖已依 Sub-Category 分組，仍可用 {FIXED [Category]: SUM([Sales])} 取得 Category 層級的總和，而不受視圖細分度限制。"}, {"id": "OXphRDLlqag-354", "vid": "OXphRDLlqag", "part": "Part 2", "ts": 354, "d": "D2", "topic": "Marks Card", "multi": false, "q": "In Tableau, which shelf is used to control the starting point of a path in a visualization?", "zh": "在 Tableau 中，哪個 shelf 用來控制視覺化中路徑的起點？", "o": ["Pages shelf", "Path shelf", "Filters shelf", "Tooltip shelf"], "a": [1], "ex": "Path 是 Marks card 上的一個屬性（線圖與多邊形才會出現），用來決定標記連線的順序與起點，常用於流動圖、路徑地圖。Tooltip shelf 這個名詞不存在（Tooltip 也是 Marks card 的屬性）。"}, {"id": "OXphRDLlqag-414", "vid": "OXphRDLlqag", "part": "Part 2", "ts": 414, "d": "D3", "topic": "發佈到 Server / Cloud", "multi": false, "q": "True or False: Tableau allows users to publish and share dashboards via Tableau Public without any data limit.", "zh": "是非題：Tableau 允許使用者透過 Tableau Public 發佈與分享儀表板，且沒有任何資料量限制。", "o": ["true", "false"], "a": [1], "ex": "false。Tableau Public 有明確限制：每個資料來源的資料列數上限（1,500 萬列），而且所有內容都會公開在網路上，無法設為私人。"}, {"id": "OXphRDLlqag-569", "vid": "OXphRDLlqag", "part": "Part 2", "ts": 569, "d": "D2", "topic": "參考線／趨勢線／預測", "multi": false, "q": "Which Tableau capability is specifically designed for in-depth temporal data analysis?", "zh": "哪個 Tableau 功能是專為深入的時間性資料分析而設計的？", "o": ["Forecasting", "Constant lines", "Clustering", "Data blending"], "a": [0], "ex": "Forecasting（預測）以指數平滑法分析時間序列，往未來延伸並給出信賴區間，是唯一針對「時間」設計的分析功能。Constant line 只是一條固定值線、Clustering 依度量分群、Data blending 是合併資料來源。"}, {"id": "OXphRDLlqag-653", "vid": "OXphRDLlqag", "part": "Part 2", "ts": 653, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "What type of join combines all records from two datasets and fills in nulls where there is no match?", "zh": "哪一種 join 會保留兩個資料集的所有記錄，沒有對應時以 null 填補？", "o": ["Inner join", "Left join", "Right join", "Full outer join"], "a": [3], "ex": "Full outer join 同時保留左右兩邊所有列，任一邊沒有相符的記錄就以 null 補齊。Inner join 只留兩邊都有的；Left／Right join 只完整保留其中一邊。"}, {"id": "pNl1hF8ha48-188", "vid": "pNl1hF8ha48", "part": "Part 20", "ts": 188, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "What does the following icon do? (畫面圖示為兩排小方塊搭配一組彎曲交換箭頭)", "zh": "畫面上這個圖示（兩排方塊加上交換箭頭）的功能是什麼？", "o": ["Union data", "Pivot data", "Rearrange containers", "Swap column and row pills"], "a": [3], "ex": "工具列上這個帶交換箭頭的圖示是 Swap Rows and Columns，把 Columns 與 Rows shelf 上的欄位對調（快捷鍵 Ctrl+W／⌘+W），一鍵把直條圖變橫條圖。"}, {"id": "pNl1hF8ha48-267", "vid": "pNl1hF8ha48", "part": "Part 20", "ts": 267, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "It's best practice to use pie charts with _____ categories", "zh": "最佳實務上，圓餅圖適合用在幾個類別？", "o": ["4-10", "2-3", "2-5", "7-12"], "a": [2], "ex": "圓餅圖只有在類別很少（約 2–5 個）時才好讀；切片一多，角度差異就難以辨識，這時應改用長條圖。"}, {"id": "pNl1hF8ha48-541", "vid": "pNl1hF8ha48", "part": "Part 20", "ts": 541, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "_____ Occur at the physical layer while _____ occur at the logical layer", "zh": "＿＿ 發生在實體層（physical layer），而 ＿＿ 發生在邏輯層（logical layer）。", "o": ["Joins, Relationships", "Relationships, Joins", "Horizontals, Blanks", "Measures, Dimensions"], "a": [0], "ex": "2020.2 起的資料模型分兩層：邏輯層（Logical layer）放的是 Relationship（麵條線，彈性、依視圖決定實際查詢）；雙擊進入實體層（Physical layer）才是傳統的 Join 與 Union。"}, {"id": "pNl1hF8ha48-631", "vid": "pNl1hF8ha48", "part": "Part 20", "ts": 631, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "_____ fields always result in a blue pill", "zh": "＿＿＿ 類型的欄位一定會呈現為藍色欄位（pill）。", "o": ["dimensions", "measures", "discrete", "continuous"], "a": [2], "ex": "藍色＝離散（discrete），綠色＝連續（continuous）。維度多半是離散但也可以是連續（連續日期），度量多半是連續但也能轉成離散，所以只有「離散」是永遠對應藍色的。"}, {"id": "M8KSQg1illA-406", "vid": "M8KSQg1illA", "part": "Part 21", "ts": 406, "d": "D2", "topic": "Sets / Hierarchies", "multi": false, "q": "Which of the following can be used with a parameter to dynamically control the top N members based on a measure?", "zh": "哪一個可以搭配參數，依度量動態控制前 N 名的成員？", "o": ["Groups", "Bins", "Hierarchy", "Sets"], "a": [3], "ex": "Set 的 Top 分頁可以直接綁定參數（例如 Top [N] by SUM(Sales)），使用者調整參數，集合成員就跟著變。Group 是靜態合併成員、Bin 是數值分組、Hierarchy 是階層。"}, {"id": "M8KSQg1illA-459", "vid": "M8KSQg1illA", "part": "Part 21", "ts": 459, "d": "D1", "topic": "資料型別與欄位角色", "multi": true, "q": "Which of the following are valid data types in Tableau?", "zh": "下列哪些是 Tableau 的有效資料型別？（複選）", "o": ["Number (whole)", "Date", "String", "Spatial", "Money"], "a": [0, 1, 2, 3], "ex": "Tableau 的資料型別有：Number (whole)、Number (decimal)、Date、Date & Time、String、Boolean、Geographic values、Cluster Group、Spatial。Money 不是型別，只是數值欄位的「顯示格式（currency）」。"}, {"id": "M8KSQg1illA-525", "vid": "M8KSQg1illA", "part": "Part 21", "ts": 525, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "What does the following icon represent in Tableau? (畫面圖示為一個迴紋針)", "zh": "畫面上這個迴紋針圖示在 Tableau 中代表什麼？", "o": ["Set", "Group", "Bin", "Attachment"], "a": [1], "ex": "迴紋針（paperclip）圖示代表 Group——把多個成員「夾」在一起。Set 是兩個交疊的圓、Bin 是類似長條圖的圖示。"}, {"id": "M8KSQg1illA-633", "vid": "M8KSQg1illA", "part": "Part 21", "ts": 633, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "Which of the following can be used to display multiple measures on the same line chart/time series?", "zh": "下列哪一個可以在同一張折線圖／時間序列上顯示多個度量？", "o": ["Blended axis", "Dual axis", "Duplicate axis", "Omni axis"], "a": [1], "ex": "Dual axis 讓第二個度量使用自己的軸並疊在同一個窗格上（需要時可 Synchronize Axis 對齊刻度）。Blended axis（Measure Values 共用一軸）雖然也能同圖顯示多度量，但本題影片給的答案是 Dual axis。"}, {"id": "c_4BgvRwX_k-121", "vid": "c_4BgvRwX_k", "part": "Part 22", "ts": 121, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "True or False: Tableau Animations can be turned off", "zh": "是非題：Tableau 的動畫效果可以關閉。", "o": ["True", "False"], "a": [0], "ex": "true。Format ▸ Animations 可以針對整本活頁簿或個別工作表開關動畫，也能調整動畫時長與型態（同時／循序）。"}, {"id": "c_4BgvRwX_k-254", "vid": "c_4BgvRwX_k", "part": "Part 22", "ts": 254, "d": "D1", "topic": "Extract vs Live", "multi": false, "q": "Which of the following can be used to work with data offline?", "zh": "下列哪一個可以讓你離線使用資料？", "o": ["Live Connection", "Extract", "Tableau Server", "Tableau Cloud"], "a": [1], "ex": "Extract 把資料存成本地 .hyper 檔，斷網也能繼續分析。Live connection 需要連得到來源；Server 與 Cloud 都需要網路。"}, {"id": "c_4BgvRwX_k-423", "vid": "c_4BgvRwX_k", "part": "Part 22", "ts": 423, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "Which of the following describes the image below? (畫面顯示左側欄位清單：Sample - Superstore、搜尋列、Tables、Orders 與其下的 Customer Name / Location / Order Date 等欄位)", "zh": "畫面顯示的是 Tableau 介面的哪一部分？（欄位清單，含搜尋列與 Orders 資料表下的欄位）", "o": ["Data Sources tab", "Data Pane", "Table Preview", "Analytics Pane"], "a": [1], "ex": "這是工作表左側的 Data Pane（資料窗格），列出目前資料來源的所有欄位，並以圖示標示資料型別與角色（Abc 字串、日曆 日期、樹狀 階層等）。"}, {"id": "c_4BgvRwX_k-619", "vid": "c_4BgvRwX_k", "part": "Part 22", "ts": 619, "d": "D3", "topic": "儀表板動作 Actions", "multi": false, "q": "True or False: Sheets can be used as filters for other sheets on a Dashboard", "zh": "是非題：在儀表板上，一張工作表可以當作其他工作表的篩選器。", "o": ["True", "False"], "a": [0], "ex": "true。點選工作表右上角的「Use as Filter」漏斗圖示，或建立 Filter action，就能讓使用者在一張圖上點選標記，同步篩選儀表板上的其他工作表。"}, {"id": "yg16dP_X0-A-257", "vid": "yg16dP_X0-A", "part": "Part 23", "ts": 257, "d": "D3", "topic": "儀表板動作 Actions", "multi": false, "q": "Which of the following actions can be used to direct a user to a web page?", "zh": "哪一個動作（action）可以把使用者導向網頁？", "o": ["Go to web page", "Go to URL", "Go to hyperlink", "Go to website"], "a": [1], "ex": "Tableau 的動作類型正式名稱是 Go to URL。設定後點選標記就會開啟指定網址，網址還能用欄位值動態組成（例如帶入客戶名稱去搜尋）。"}, {"id": "yg16dP_X0-A-459", "vid": "yg16dP_X0-A", "part": "Part 23", "ts": 459, "d": "D2", "topic": "篩選器 Filters", "multi": true, "q": "The following image illustrates which of the following? (select multiple) (畫面為 Filter [Year of Order Date] 對話框，General 分頁列出 2019/2020/2021/2022 供勾選)", "zh": "畫面上的篩選器對話框（Year of Order Date，可勾選 2019–2022）代表下列哪些概念？（複選）", "o": ["Date Part", "Filter", "Discrete Date", "Continuous Date", "Continuous Years"], "a": [0, 1, 2], "ex": "對話框標題是 Filter，欄位是 Year of Order Date（Date Part，只取年份這個部分），而且以「一格一格可勾選的成員清單」呈現——這正是離散日期（Discrete Date）的樣子。連續日期的篩選器會是可拖曳的範圍滑桿。"}, {"id": "yg16dP_X0-A-707", "vid": "yg16dP_X0-A", "part": "Part 23", "ts": 707, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "Dragging a _____ field to the color on the marks card will result in a color gradient while a _____ field will result in distinct colors based on a color palette", "zh": "把 ＿＿ 欄位拖到 Marks card 的 Color 會得到漸層色，而 ＿＿ 欄位會得到色盤上的不同色塊。", "o": ["Discrete, infinite", "Continuous, fixed", "Continuous, Discrete", "Discrete, Continuous"], "a": [2], "ex": "連續（綠色）欄位 → 依數值大小的漸層色階；離散（藍色）欄位 → 每個成員一個獨立顏色的類別色盤。這是判斷色彩圖例長相的關鍵。"}, {"id": "yg16dP_X0-A-920", "vid": "yg16dP_X0-A", "part": "Part 23", "ts": 920, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "The following image represents which feature in Tableau? (畫面圖示為兩個上下錯開、相接的方塊)", "zh": "畫面上這個圖示（兩個上下相接的方塊）代表 Tableau 的哪個功能？", "o": ["Dual Axis Bar Chart", "Union", "Horizontal Bar Chart", "Column Alignment"], "a": [1], "ex": "這是 Union（聯集）的圖示——兩個方塊上下相疊，正好象徵把多張表的列往下接在一起。"}, {"id": "mkOb1zF1IDY-300", "vid": "mkOb1zF1IDY", "part": "Part 24", "ts": 300, "d": "D1", "topic": "Join / Relationship / Blending", "multi": false, "q": "How are relationships depicted in Tableau, and at which layer do they function?", "zh": "Relationship 在 Tableau 中如何呈現？作用在哪一層？", "o": ["Noodles, physical layer", "Noodles, logical layer", "Venn diagrams, logical layer", "Venn diagrams, physical layer"], "a": [1], "ex": "Relationship 在資料來源畫面上顯示為連接兩張表的「麵條線（noodle）」，作用於邏輯層。Venn 圖（交集示意）是實體層 Join 的呈現方式。"}, {"id": "mkOb1zF1IDY-571", "vid": "mkOb1zF1IDY", "part": "Part 24", "ts": 571, "d": "D2", "topic": "排序與群組", "multi": false, "q": "What occurs in a bar chart when grouping by labels in the view?", "zh": "在視圖中依標籤建立群組時，長條圖會發生什麼事？", "o": ["The selected members will have the same color, while the rest will have different colors", "Grouping by labels is not allowed", "The view remains unchanged, but a group is created in the Dimensions shelf", "A new bar is generated, consolidating all members within the group"], "a": [3], "ex": "在視圖中選取多個成員按 Group（迴紋針）後，這些成員會合併成一個新成員，畫面上原本的多根長條會合併成一根，數值加總。"}, {"id": "mkOb1zF1IDY-702", "vid": "mkOb1zF1IDY", "part": "Part 24", "ts": 702, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "In a box plot, what does the box represent?", "zh": "在盒鬚圖中，中間的「盒子」代表什麼？", "o": ["The minimum value of the data", "The median of the middle half of the data points", "The mean value of the data", "The interquartile range"], "a": [3], "ex": "盒子的上下緣是第三四分位數（Q3）與第一四分位數（Q1），中間那條線是中位數；盒子本身涵蓋的範圍就是四分位距（IQR = Q3 − Q1），也就是中間 50% 的資料。"}, {"id": "mkOb1zF1IDY-701", "vid": "mkOb1zF1IDY", "part": "Part 24", "ts": 701, "d": "D1", "topic": "Join / Relationship / Blending", "multi": true, "q": "Which of the following can be used to create a join in Tableau? (select multiple)", "zh": "下列哪些做法可以在 Tableau 中建立 join？（複選）", "o": ["Right-click a logical table to open the join/union canvas in the physical layer", "Double-click a logical table to open the join/union canvas in the physical layer", "Right-click a physical table to open the join/union canvas in the logical layer", "Double-click a physical table to open the join/union canvas in the logical layer"], "a": [0, 1], "ex": "Join 發生在實體層，而進入實體層的方式是從邏輯層的表「往下鑽」——在邏輯表上按右鍵選 Open，或直接雙擊該邏輯表，都會打開 join/union canvas。反過來從實體表回到邏輯層去做 join 是不存在的操作（雙擊實體表只會變成重新命名）。", "src": "narration"}, {"id": "3Pmo6cngxRE-176", "vid": "3Pmo6cngxRE", "part": "Part 25", "ts": 176, "d": "D4", "topic": "檔案格式與產品線", "multi": false, "q": "Why would you use a .twbx file over a .twb file?", "zh": "為什麼要用 .twbx 而不是 .twb？", "o": ["To reduce the file size", "To include data extracts and resources within the file", "To remove excess data from the file", "To enable real-time data updates"], "a": [1], "ex": ".twbx（Packaged Workbook）把活頁簿、資料擷取、背景圖片、自訂圖形等資源全部打包成一個檔案，對方不需要原始資料連線就能開啟。代價是檔案更大，不是更小。"}, {"id": "3Pmo6cngxRE-297", "vid": "3Pmo6cngxRE", "part": "Part 25", "ts": 297, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "If you want to display a vertical bar chart. You should drag a measure to the _____", "zh": "想做出「直立」的長條圖，應該把度量拖到哪裡？", "o": ["Rows shelf", "Columns shelf", "Bars shelf", "Marks Card"], "a": [0], "ex": "直立長條圖的高度是數值，所以度量要放在 Rows（Y 軸），維度放 Columns。若把度量放到 Columns 就會變成橫向長條圖。Bars shelf 不存在。"}, {"id": "3Pmo6cngxRE-563", "vid": "3Pmo6cngxRE", "part": "Part 25", "ts": 563, "d": "D2", "topic": "計算欄位", "multi": false, "q": "What is a calculated field?", "zh": "什麼是計算欄位（calculated field）？", "o": ["The number of marks in a visualization", "A field created by applying custom formulas to existing data", "A Quick Table Calculation", "A field used to display metadata about the dataset"], "a": [1], "ex": "計算欄位是你自己寫公式、以既有欄位為基礎產生的新欄位（例如 Profit Ratio = SUM([Profit])/SUM([Sales])），建立後會出現在資料窗格，可像一般欄位一樣使用。"}, {"id": "HsO2vO-7UF4-147", "vid": "HsO2vO-7UF4", "part": "Part 26", "ts": 147, "d": "D2", "topic": "地圖", "multi": false, "q": "True or False: You can change the Geographic Role property of a given dimension", "zh": "是非題：可以更改某個維度的「地理角色」屬性。", "o": ["True", "False"], "a": [0], "ex": "true。在欄位上按右鍵 ▸ Geographic Role，即可指定或改成 City、State/Province、Country/Region、Zip Code、Airport 等角色，也可以設為 None 取消。"}, {"id": "HsO2vO-7UF4-266", "vid": "HsO2vO-7UF4", "part": "Part 26", "ts": 266, "d": "D1", "topic": "資料來源與連線", "multi": false, "q": "To connect Tableau to a CSV data source, which type of connection should you use?", "zh": "要連接 CSV 檔案，應該選哪一種連線類型？", "o": ["Raw File", "Microsoft Excel", "Text", "CSV"], "a": [2], "ex": "連線清單中沒有「CSV」這個項目——CSV 屬於 Text file（文字檔），選 Text file 後即可開啟 .csv、.txt、.tsv 等分隔檔。這題考的是連接器的正式名稱。"}, {"id": "HsO2vO-7UF4-526", "vid": "HsO2vO-7UF4", "part": "Part 26", "ts": 526, "d": "D1", "topic": "Extract vs Live", "multi": false, "q": "Which of the following best describes Incremental Refreshes?", "zh": "下列哪一項最能描述「增量更新（Incremental Refresh）」？", "o": ["they are the same as using an extract", "they only add fresh rows as compared to the previous refresh", "they should only be used with 1M + rows", "they reload all data in the extract"], "a": [1], "ex": "增量更新只把「比上次更新更新的列」加進擷取檔（依你指定的識別欄位，例如日期或 ID 判斷），不會重新載入全部資料——那是 Full Refresh。"}, {"id": "W_HTXbbiEPI-200", "vid": "W_HTXbbiEPI", "part": "Part 3", "ts": 200, "d": "D3", "topic": "儀表板 Dashboards", "multi": false, "q": "What does the 'Viz in Tooltip' feature in Tableau allow?", "zh": "Tableau 的「Viz in Tooltip」功能可以做什麼？", "o": ["Embedding visualizations within tooltips", "Embedding entire workbooks within tooltips", "Linking to external websites", "Embedding dashboard previews within tooltips"], "a": [0], "ex": "Viz in Tooltip 讓你把「另一張工作表」嵌進提示框裡：滑鼠停在某個標記上時，提示框會顯示以該標記為篩選條件的迷你圖表。嵌入的是單一 worksheet，不是整本 workbook，也不是儀表板預覽。"}, {"id": "W_HTXbbiEPI-271", "vid": "W_HTXbbiEPI", "part": "Part 3", "ts": 271, "d": "D1", "topic": "資料來源與連線", "multi": false, "q": "How can Tableau interact with web data in real-time?", "zh": "Tableau 要即時取用網路資料，該用什麼方式？", "o": ["Through Web Data Connectors", "Via live data feeds", "Using data extracts", "Through story points"], "a": [0], "ex": "Web Data Connector（WDC）是 Tableau 專門用來連接 REST API、JSON、XML 等網路資料來源的機制，可即時抓取。Extract 是離線快照、Story points 與資料連線無關。"}, {"id": "W_HTXbbiEPI-331", "vid": "W_HTXbbiEPI", "part": "Part 3", "ts": 331, "d": "D1", "topic": "資料清理（Pivot / Split / 別名）", "multi": false, "q": "True or False: Tableau Desktop can be used as a step by step ETL tool to combine, shape and clean data.", "zh": "是非題：Tableau Desktop 可以當成逐步式的 ETL 工具來合併、整形與清理資料。", "o": ["true", "false"], "a": [1], "ex": "false。Tableau Desktop 只有基本的資料整理（pivot、split、重新命名、資料來源篩選）。真正逐步式、可視化流程的 ETL 工具是 Tableau Prep Builder，那才是設計來做 clean / shape / combine 的產品。"}, {"id": "W_HTXbbiEPI-349", "vid": "W_HTXbbiEPI", "part": "Part 3", "ts": 349, "d": "D1", "topic": "Extract vs Live", "multi": false, "q": "What feature should be used to ensure that a workbook data reflects the most current data available in a database?", "zh": "要確保活頁簿的資料永遠反映資料庫中最新的資料，應該使用什麼？", "o": ["Server sync", "Live connection", "Scheduled extracts", "Data source filters"], "a": [1], "ex": "Live connection 每次操作都直接查詢來源資料庫，看到的一定是最新資料。Scheduled extract 只在排程時間點更新，中間會有時間差；Data source filter 是篩選、Server sync 不是 Tableau 的功能名稱。"}, {"id": "W_HTXbbiEPI-521", "vid": "W_HTXbbiEPI", "part": "Part 3", "ts": 521, "d": "D1", "topic": "資料來源與連線", "multi": true, "q": "Which types of data sources can Tableau connect to directly? (select multiple)", "zh": "Tableau 可以直接連接哪些類型的資料來源？（複選）", "o": ["SQL databases", "Web data connectors", "Local files", "Microsoft Access 97", "Cloud data"], "a": [0, 1, 2, 4], "ex": "SQL 資料庫、Web Data Connector、本機檔案（Excel／CSV／文字檔）、雲端資料來源都在原生連接器清單中。Microsoft Access 97 是被淘汰的舊版本，現代 Tableau 不支援，是干擾選項。"}, {"id": "pLl-ekr4jTY-266", "vid": "pLl-ekr4jTY", "part": "Part 4", "ts": 266, "d": "D2", "topic": "圖表類型與 Show Me", "multi": true, "q": "Which chart types are optimal for showing trends over time in Tableau? (select multiple)", "zh": "哪些圖表類型最適合呈現隨時間變化的趨勢？（複選）", "o": ["Line chart", "Bar chart", "Pie chart", "Area chart", "Scatter plot"], "a": [0, 3], "ex": "折線圖是時間趨勢的首選；區域圖（Area chart）本質上是填滿的折線圖，同樣沿時間軸呈現趨勢，還能表達累積量。長條圖適合類別比較、圓餅圖表達部分與整體、散佈圖看兩個度量的相關性。"}, {"id": "pLl-ekr4jTY-332", "vid": "pLl-ekr4jTY", "part": "Part 4", "ts": 332, "d": "D2", "topic": "地圖", "multi": false, "q": "True or False: Tableau Desktop allows users to create custom geographic regions.", "zh": "是非題：Tableau Desktop 允許使用者建立自訂的地理區域。", "o": ["true", "false"], "a": [0], "ex": "true。可以把多個地理成員（例如幾個州）框選後 Group 成自訂區域（例如 West Region），也可以匯入自訂地理編碼或空間檔（shapefile／GeoJSON）來定義自己的區域。"}, {"id": "pLl-ekr4jTY-490", "vid": "pLl-ekr4jTY", "part": "Part 4", "ts": 490, "d": "D1", "topic": "Extract vs Live", "multi": true, "q": "What are the primary benefits of using data extracts in Tableau? (select multiple)", "zh": "在 Tableau 使用資料擷取（extract）的主要好處有哪些？（複選）", "o": ["Faster loading times", "Offline data access", "Real-time updates", "Enhanced security", "Ability to use COUNTD"], "a": [0, 1, 4], "ex": "Extract 把資料存成本地的 .hyper 檔：查詢更快、可離線使用，而且部分來源（例如某些不支援 COUNTD 的連接器）在轉成 extract 之後才能使用 COUNTD 等函數。Real-time updates 反而是 extract 的缺點；安全性由權限管理決定，不是 extract 的功能。"}, {"id": "pLl-ekr4jTY-680", "vid": "pLl-ekr4jTY", "part": "Part 4", "ts": 680, "d": "D3", "topic": "發佈到 Server / Cloud", "multi": true, "q": "What functionality does Tableau Server provide for collaborating on visualizations? (select multiple)", "zh": "Tableau Server 提供哪些協作視覺化的功能？（複選）", "o": ["Comments", "Sharing links", "Version history", "Data-driven Alerts", "Subscribing to views"], "a": [0, 1, 2, 3, 4], "ex": "五個全選。Tableau Server 的協作功能包含：在視圖上留言、分享連結、活頁簿版本歷程（可回復舊版）、資料驅動警示（數值超過門檻時寄信），以及訂閱視圖（定期收到快照）。"}, {"id": "pLl-ekr4jTY-756", "vid": "pLl-ekr4jTY", "part": "Part 4", "ts": 756, "d": "D3", "topic": "發佈到 Server / Cloud", "multi": false, "q": "True or False: Tableau Server or Tableau Cloud is required to publish and share dashboards with others.", "zh": "是非題：要發佈並與他人分享儀表板，必須要有 Tableau Server 或 Tableau Cloud。", "o": ["true", "false"], "a": [0], "ex": "true（依本題影片給的答案）。真正在組織內「發佈」並讓別人以互動方式檢視儀表板，需要 Tableau Server 或 Tableau Cloud 作為發佈目的地。注意：Tableau Public 也能公開分享，但那會把資料公開到網路上，不算組織內的正式發佈途徑。"}, {"id": "o9iadTiDmEM-305", "vid": "o9iadTiDmEM", "part": "Part 5", "ts": 305, "d": "D2", "topic": "Sets / Hierarchies", "multi": false, "q": "Which feature in Tableau helps to reduce data noise based on measure values?", "zh": "哪個 Tableau 功能可依度量值來降低資料雜訊？", "o": ["Filter", "Sets", "Highlighting", "Clustering"], "a": [3], "ex": "Clustering（分群）在 Analytics 窗格中，會依度量值把相近的標記自動分群，把雜亂的散點整理成幾個有意義的群組。Filter 是把資料拿掉、Set 是自訂成員集合、Highlighter 只是視覺強調。"}, {"id": "o9iadTiDmEM-520", "vid": "o9iadTiDmEM", "part": "Part 5", "ts": 520, "d": "D2", "topic": "圖表類型與 Show Me", "multi": true, "q": "Which types of visualizations effectively compare parts of a whole? (select multiple)", "zh": "哪些視覺化類型能有效比較「部分與整體」？（複選）", "o": ["Pie chart", "Tree map", "Line chart", "Bar chart", "Stacked bar chart"], "a": [0, 1, 4], "ex": "圓餅圖、樹狀圖、堆疊長條圖都是把一個整體切成若干部分來呈現占比。折線圖是趨勢、一般長條圖是類別間比較，都不是部分對整體。"}, {"id": "o9iadTiDmEM-712", "vid": "o9iadTiDmEM", "part": "Part 5", "ts": 712, "d": "D2", "topic": "參考線／趨勢線／預測", "multi": true, "q": "What can be found in the \"Analytics\" pane?", "zh": "「Analytics」窗格中可以找到哪些項目？（複選）", "o": ["Totals", "Box plot", "Constant Line", "Gantt Bar", "Histogram"], "a": [0, 1, 2], "ex": "Analytics 窗格提供 Summarize（Constant Line、Average Line、Median with Quartiles、Box Plot、Totals）、Model（Average with CI、Trend Line、Forecast、Cluster）、Custom（Reference Line／Band／Distribution Band）。Gantt Bar 與 Histogram 是圖表類型，出現在 Marks 下拉或 Show Me，不在 Analytics 窗格。"}, {"id": "o9iadTiDmEM-865", "vid": "o9iadTiDmEM", "part": "Part 5", "ts": 865, "d": "D1", "topic": "Join / Relationship / Blending", "multi": true, "q": "Which data management features does Tableau offer to enhance analysis? (select multiple)", "zh": "Tableau 提供哪些資料管理功能來強化分析？（複選）", "o": ["Data blending", "Data pivoting", "Data clustering", "Data joining", "Data cleansing"], "a": [0, 1, 2, 3], "ex": "Blending（混合不同資料來源）、Pivoting（欄轉列）、Clustering（分群）、Joining（結合資料表）都是 Tableau Desktop 內建功能。Data cleansing（完整的資料清理流程）屬於 Tableau Prep 的範疇，Desktop 只做得到很基本的整理。"}, {"id": "o9iadTiDmEM-904", "vid": "o9iadTiDmEM", "part": "Part 5", "ts": 904, "d": "D2", "topic": "篩選器 Filters", "multi": false, "q": "What allows users to create dynamic and interactive filters in Tableau?", "zh": "在 Tableau 中，什麼可以建立動態且可互動的篩選？", "o": ["Parameters", "Extracts", "Criteria Shelf", "Highlight Actions"], "a": [0], "ex": "Parameter 是使用者可調整的變數，搭配計算欄位當篩選條件，就能做出動態互動篩選（例如自選門檻值、自選要看的度量）。Criteria Shelf 根本不存在；Highlight Action 只是高亮不是篩選。"}, {"id": "xy1RoS0HRWc-180", "vid": "xy1RoS0HRWc", "part": "Part 6", "ts": 180, "d": "D4", "topic": "離散 vs 連續", "multi": false, "q": "True or False: A discrete date pill on the rows shelf will generate an axis in the Viz.", "zh": "是非題：把「離散」的日期欄位放到 Rows shelf 會產生一條座標軸。", "o": ["true", "false"], "a": [1], "ex": "false。離散（藍色）欄位產生的是「標題（headers）」——一格一格的標籤；只有連續（綠色）欄位才會產生座標軸（axis）。這是離散 vs 連續最常考的分辨點。"}, {"id": "xy1RoS0HRWc-426", "vid": "xy1RoS0HRWc", "part": "Part 6", "ts": 426, "d": "D3", "topic": "儀表板 Dashboards", "multi": false, "q": "Which element is NOT directly editable within a Tableau dashboard?", "zh": "哪一個元素「無法」在儀表板中直接編輯？", "o": ["Data source", "Filter configurations", "Container placement", "Mark Colors"], "a": [0], "ex": "資料來源必須回到 Data Source 分頁去修改（換連線、加 join、改資料型別）。篩選器設定、容器排版、標記顏色都可以在儀表板畫面上直接調整。"}, {"id": "xy1RoS0HRWc-505", "vid": "xy1RoS0HRWc", "part": "Part 6", "ts": 505, "d": "D2", "topic": "地圖", "multi": false, "q": "True or False: Tableau can automatically detect geographic data based on field names like \"City\" or \"Country\".", "zh": "是非題：Tableau 能依據欄位名稱（例如 City 或 Country）自動辨識地理資料。", "o": ["true", "false"], "a": [0], "ex": "true。Tableau 會依欄位名稱自動指派地理角色並產生 Latitude／Longitude（generated）。若沒有自動判斷正確，也可以手動指定 Geographic Role。"}, {"id": "xy1RoS0HRWc-691", "vid": "xy1RoS0HRWc", "part": "Part 6", "ts": 691, "d": "D3", "topic": "Story 故事", "multi": false, "q": "What Tableau feature allows you to switch between different views or dashboards dynamically as a user?", "zh": "哪個 Tableau 功能讓使用者可以動態切換不同的視圖或儀表板？", "o": ["Stories", "Dashboards", "Workbook", "Data sources"], "a": [0], "ex": "Story 把多個 story point（可以是工作表或儀表板）串成一系列導覽頁籤，讀者點頁籤就能在不同視圖之間切換，形成有敘事順序的簡報。"}, {"id": "xy1RoS0HRWc-755", "vid": "xy1RoS0HRWc", "part": "Part 6", "ts": 755, "d": "D3", "topic": "儀表板 Dashboards", "multi": false, "q": "Which Tableau feature would you use to create a detailed tooltip that includes visuals?", "zh": "要做出包含圖表的詳細提示框，該用哪個功能？", "o": ["Viz in Tooltip", "Tooltips", "Dynamic tooltips", "Embedded charts"], "a": [0], "ex": "Viz in Tooltip 是專門的功能：在 Tooltip 編輯視窗插入 <Sheet name=\"...\"> 就能把另一張工作表嵌進提示框。一般 Tooltip 只能放文字與欄位值。"}, {"id": "Dh5A77lHet4-132", "vid": "Dh5A77lHet4", "part": "Part 7", "ts": 132, "d": "D3", "topic": "發佈到 Server / Cloud", "multi": false, "q": "Which method is recommended for sharing a dashboard with offline users?", "zh": "要把儀表板分享給沒有網路（離線）的使用者，建議用哪種方式？", "o": ["Publishing to Tableau Server", "Sharing via Tableau Reader", "Emailing as a PDF", "Embedding in a web page"], "a": [1], "ex": "Tableau Reader 是免費的桌面應用程式，可開啟 .twbx 封裝活頁簿並保留完整互動（篩選、提示框），完全不需連線。Server／嵌入網頁都要連線；PDF 則失去互動性。"}, {"id": "Dh5A77lHet4-361", "vid": "Dh5A77lHet4", "part": "Part 7", "ts": 361, "d": "D2", "topic": "圖表類型與 Show Me", "multi": false, "q": "What allows for the analysis of relationships between numerical values in Tableau?", "zh": "在 Tableau 中，什麼可以用來分析數值之間的關聯性？", "o": ["Scatter plot", "Pie chart", "Bar chart", "Line chart"], "a": [0], "ex": "散佈圖把兩個度量分別放在 X／Y 軸，是檢視兩個數值變數相關性（正相關、負相關、離群值）的標準做法，還可加上趨勢線量化關係。"}, {"id": "Dh5A77lHet4-571", "vid": "Dh5A77lHet4", "part": "Part 7", "ts": 571, "d": "D3", "topic": "格式化與版面", "multi": false, "q": "Which pane enables users to manage the layout and design of multiple dashboards in Tableau?", "zh": "哪個窗格可以管理儀表板的版面與設計？", "o": ["Dashboard", "Layout", "Data", "Story"], "a": [1], "ex": "在儀表板編輯畫面左側有 Dashboard 與 Layout 兩個分頁：Dashboard 分頁放工作表與物件，Layout 分頁則控制選取項目的位置、尺寸、內距、邊界、背景等版面設定。"}, {"id": "Dh5A77lHet4-680", "vid": "Dh5A77lHet4", "part": "Part 7", "ts": 680, "d": "D4", "topic": "介面與名詞", "multi": false, "q": "True or False: You can use Python scripts in Tableau calculations through the TabPy server.", "zh": "是非題：可以透過 TabPy 伺服器在 Tableau 的計算中使用 Python 腳本。", "o": ["true", "false"], "a": [0], "ex": "true。TabPy（Tableau Python Server）是官方的外部服務整合，設定連線後即可在計算欄位中用 SCRIPT_REAL、SCRIPT_STR 等函數呼叫 Python。R 也有對應的 Rserve 整合。"}, {"id": "Dh5A77lHet4-1015", "vid": "Dh5A77lHet4", "part": "Part 7", "ts": 1015, "d": "D2", "topic": "篩選器 Filters", "multi": false, "q": "What is the main advantage of using context filters in Tableau?", "zh": "使用 context filter（內容篩選器）的主要優點是什麼？", "o": ["They aggregate data for faster processing", "They filter data at the extract layer", "They create dependent filters", "They create independent filters"], "a": [2], "ex": "Context filter 會先執行並產生一個暫存子集，其他篩選器（尤其是 Top N 與 FIXED LOD 之外的篩選）都在這個子集上運作，因此形成「相依」關係——這正是要讓 Top N 只在特定範圍內計算時的標準做法。"}, {"id": "IPHdPbrkbDY-244", "vid": "IPHdPbrkbDY", "part": "Part 8", "ts": 244, "d": "D4", "topic": "效能最佳化", "multi": false, "q": "Which method is NOT a way to enhance dashboard performance in Tableau?", "zh": "下列哪一種做法「不是」提升儀表板效能的方法？", "o": ["Using higher level of detail", "Reducing the use of filters", "Increasing the use of complex calculations", "Simplifying visualizations"], "a": [2], "ex": "複雜計算（多層巢狀 IF、大量表計算、字串運算）會讓每次查詢都變慢，是效能殺手。提高彙總層級（少一點細節）、減少篩選器數量、簡化視圖都能加快渲染。"}, {"id": "IPHdPbrkbDY-337", "vid": "IPHdPbrkbDY", "part": "Part 8", "ts": 337, "d": "D1", "topic": "資料清理（Pivot / Split / 別名）", "multi": false, "q": "True or False: Tableau's data interpreter can clean and reshape messy data sourced from SQL databases.", "zh": "是非題：Tableau 的 Data Interpreter 可以清理並重整來自 SQL 資料庫的雜亂資料。", "o": ["true", "false"], "a": [1], "ex": "false。Data Interpreter 只適用於「以檔案為基礎」的來源——Excel、CSV、PDF、Google Sheets，用來移除標題裝飾列、合併儲存格等。連接 SQL 資料庫時這個選項根本不會出現。"}, {"id": "IPHdPbrkbDY-578", "vid": "IPHdPbrkbDY", "part": "Part 8", "ts": 578, "d": "D2", "topic": "Marks Card", "multi": true, "q": "The Pages shelf allows which of the following? (select multiple)", "zh": "Pages shelf 可以做到下列哪些事？（複選）", "o": ["A way to page through SQL records", "A way to jump to a specific page", "A way to manually iterate through pages", "A way to automatically iterate through pages", "A way to size the dashboard dimensions based on devices"], "a": [1, 2, 3], "ex": "Pages shelf 產生的控制器可以直接跳到特定頁（下拉選單）、用箭頭手動逐頁前進，也可以按播放鍵自動播放形成動畫。它與 SQL 分頁無關；依裝置調整尺寸是儀表板的 Device Preview／Layout 功能。"}, {"id": "IPHdPbrkbDY-716", "vid": "IPH
